        <h3>🎉 完成学习</h3>
        <p>恭喜你完成了这个算法的学习！接下来让我们通过练习来巩固吧！</p>
        <button class="btn-primary" onclick="LessonView.completeIntro()">完成学习，开始做题 →</button>
      </div>
    `;

    // 高亮代码
    setTimeout(() => {
      document.querySelectorAll('pre code').forEach(block => {
        hljs.highlightElement(block);
      });
    }, 100);
  },

  // 渲染题目
  async renderProblem(module) {
    const content = document.getElementById('lessonContent');
    content.innerHTML = `
      <div class="lesson-card">
        <div class="loading"></div>
        <p>正在加载题目...</p>
      </div>
    `;

    const problem = await Luogu.getProblem(module.luoguId);

    content.innerHTML = `
      <div class="problem-card">
        <div class="problem-header">
          <div class="problem-title">${problem.title}</div>
          <div class="problem-id">${problem.id}</div>
        </div>

        <div class="problem-section">
          <h4>📝 题目描述</h4>
          <p>${this.formatMarkdown(problem.description)}</p>
        </div>

        <div class="problem-section">
          <h4>📋 样例</h4>
          ${problem.samples.map((sample, i) => `
            <div class="sample-block">
              <div class="sample-label">样例输入 ${i + 1}</div>
              <div class="sample-content">${sample.input}</div>
            </div>
            <div class="sample-block">
              <div class="sample-label">样例输出 ${i + 1}</div>
              <div class="sample-content">${sample.output}</div>
            </div>
          `).join('')}
        </div>

        <div class="problem-section">
          <h4>📏 数据范围</h4>
          <p>${problem.constraints}</p>
        </div>
      </div>

      <div class="thinking-area">
        <h4>💭 你的思路</h4>
        <p style="color: var(--text-secondary); margin-bottom: 12px;">
          在写代码之前，先写下你的想法吧！可以是完整的思路，也可以是部分分的策略。
        </p>
        <textarea class="thinking-textarea" id="thinkingInput" placeholder="写下你的思路..."></textarea>
        <div class="thinking-actions">
          <button class="btn-primary" onclick="LessonView.analyzeThinking()">分析思路</button>
          <button class="btn-secondary" onclick="Luogu.submitCode('${problem.id}', '')">去洛谷提交</button>
        </div>
      </div>

      <div id="aiResponseArea"></div>

      <div class="lesson-card">
        <h3>✅ 完成关卡</h3>
        <p>如果你在洛谷上成功AC了这道题，点击下方按钮完成关卡！</p>
        <button class="btn-ac" id="btnAC" onclick="LessonView.markAC()">
          <span>🎉</span>
          <span>我AC了！</span>
        </button>
      </div>
    `;
  },

  // 分析用户思路
  async analyzeThinking() {
    const thinking = document.getElementById('thinkingInput').value.trim();
    if (!thinking) {
      alert('请先写下你的思路！');
      return;
    }

    const responseArea = document.getElementById('aiResponseArea');
    responseArea.innerHTML = `
      <div class="ai-response">
        <div class="loading"></div>
        <p>AI 正在分析你的思路...</p>
      </div>
    `;

    const problem = await Luogu.getProblem(this.currentModule.luoguId);
    const context = `${this.currentChapter.title} - ${problem.title}\n${problem.description}`;

    const result = await AI.analyzeThinking(thinking, context);

    if (result.success) {
      responseArea.innerHTML = `
        <div class="ai-response">
          <h4>🤖 AI 助手的分析</h4>
          <div class="ai-response-content">${this.formatMarkdown(result.message)}</div>
        </div>

        <div class="followup-area">
          <h4>💬 继续追问</h4>
          <textarea class="followup-input" id="followupInput" placeholder="有什么不明白的地方吗？可以继续提问..."></textarea>
          <div class="followup-actions">
            <button class="btn-primary" onclick="LessonView.askFollowup()">提问</button>
            <button class="btn-secondary" onclick="LessonView.requestDebug()">帮我Debug</button>
          </div>
        </div>
      `;
    } else {
      responseArea.innerHTML = `
        <div class="ai-response">
          <h4>❌ 分析失败</h4>
          <p>${result.message}</p>
        </div>
      `;
    }
  },

  // 追问
  async askFollowup() {
    const question = document.getElementById('followupInput').value.trim();
    if (!question) {
      alert('请输入你的问题！');
      return;
    }

    const responseArea = document.getElementById('aiResponseArea');
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'ai-response';
    loadingDiv.innerHTML = `
      <div class="loading"></div>
      <p>AI 正在思考...</p>
    `;
    responseArea.appendChild(loadingDiv);

    const result = await AI.sendMessage(question, `${this.currentChapter.title}`);

    if (result.success) {
      loadingDiv.innerHTML = `
        <h4>🤖 AI 助手的回答</h4>
        <div class="ai-response-content">${this.formatMarkdown(result.message)}</div>
      `;
    } else {
      loadingDiv.innerHTML = `
        <h4>❌ 回答失败</h4>
        <p>${result.message}</p>
      `;
    }
  },

  // 请求Debug
  async requestDebug() {
    const code = prompt('请粘贴你的代码：');
    if (!code) return;

    const errorMsg = prompt('有错误信息吗？（可选）') || '';

    const responseArea = document.getElementById('aiResponseArea');
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'ai-response';
    loadingDiv.innerHTML = `
      <div class="loading"></div>
      <p>AI 正在帮你Debug...</p>
    `;
    responseArea.appendChild(loadingDiv);

    const result = await AI.helpDebug(code, errorMsg);

    if (result.success) {
      loadingDiv.innerHTML = `
        <h4>🔧 Debug 结果</h4>
        <div class="ai-response-content">${this.formatMarkdown(result.message)}</div>
      `;
    } else {
      loadingDiv.innerHTML = `
        <h4>❌ Debug 失败</h4>
        <p>${result.message}</p>
      `;
    }
  },

  // 标记AC
  markAC() {
    if (Luogu.checkAC(this.currentModule.luoguId)) {
      Storage.completeModule(this.currentModule.id);
      
      const btn = document.getElementById('btnAC');
      btn.classList.add('completed');
      btn.innerHTML = '<span>✅</span><span>已完成！</span>';
      btn.disabled = true;

      setTimeout(() => {
        alert('🎉 恭喜你完成了一道题！继续加油！');
        this.back();
      }, 500);
    }
  },

  // 完成介绍
  completeIntro() {
    Storage.completeModule(this.currentModule.id);
    
    // 找到当前章节的第一道题
    const chapter = this.currentChapter;
    if (chapter && chapter.modules.length > 1) {
      const firstProblem = chapter.modules.find(m => m.type === 'problem');
      if (firstProblem) {
        // 直接跳转到第一道题
        this.open(firstProblem, chapter);
        return;
      }
    }
    
    // 如果找不到题目，返回章节概览
    this.showChapter(chapter);
  },

  // 返回地图
  back() {
    App.showMap();
  },

  // 切换视图（内部使用，统一通过App管理）
  showView(viewId) {
    if (viewId === 'mapView') {
      App.showMap();
    } else {
      App.showLesson();
    }
  },

  // 格式化Markdown（兼容同步和异步）
  formatMarkdown(text) {
    if (!text) return '';
    // marked v12+ 默认返回 Promise，使用 marked.parseInline 或配置同步模式
    if (typeof marked.parse === 'function') {
      const result = marked.parse(text);
      // 如果返回 Promise，则先用简单替换
      if (result && typeof result.then === 'function') {
        return this.simpleMarkdown(text);
      }
      return result;
    }
    return this.simpleMarkdown(text);
  },

  // 简单Markdown解析（备用）
  simpleMarkdown(text) {
    if (!text) return '';
    return text
      .replace(/\n/g, '<br>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/`(.*?)`/g, '<code>$1</code>')
      .replace(/^- (.*?)(<br>|$)/g, '<li>$1</li>')
      .replace(/(<li>.*?<\/li>)/gs, '<ul>$1</ul>')
      .replace(/### (.*?)(<br>|$)/g, '<h3>$1</h3>')
      .replace(/## (.*?)(<br>|$)/g, '<h2>$1</h2>');
  },

  // 创建代码块
  createCodeBlock(code, lang) {
    return `
      <div class="code-block">
        <div class="code-block-header">
          <span class="code-block-lang">${lang}</span>
          <button class="btn-copy" onclick="LessonView.copyCode(this)">复制</button>
        </div>
        <pre><code class="language-${lang}">${this.escapeHtml(code)}</code></pre>
      </div>
    `;
  },

  // 复制代码
  copyCode(btn) {
    const code = btn.closest('.code-block').querySelector('code').textContent;
    navigator.clipboard.writeText(code).then(() => {
      btn.textContent = '已复制！';
      setTimeout(() => {
        btn.textContent = '复制';
      }, 2000);
    });
  },

  // HTML转义
  escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  },

  // 显示章节（供MapView调用）
  showChapter(chapter) {
    this.currentChapter = chapter;
    document.getElementById('lessonTitle').textContent = chapter.title;
    document.getElementById('lessonContent').innerHTML = this.renderChapterOverview(chapter);
    document.getElementById('mapView').classList.remove('active');
    document.getElementById('lessonView').classList.add('active');
    document.getElementById('btnBack').style.display = 'block';
  },

  // 渲染章节概览
  renderChapterOverview(chapter) {
    let html = '<div class="lesson-card"><h3>' + chapter.icon + ' ' + chapter.title + '</h3>';
    html += '<p>' + chapter.description + '</p></div>';
    html += '<div class="modules-grid">';
    chapter.modules.forEach((mod, idx) => {
      const completed = Storage.isCompleted(mod.id);
      const statusClass = completed ? 'completed' : 'available';
      const statusIcon = completed ? '✅' : (mod.type === 'intro' ? '📖' : '🎯');
      html += '<div class="module-node" onclick="LessonView.openModule(\'' + chapter.id + '\', ' + idx + ')">';
      html += '<div class="module-circle ' + statusClass + '"><span>' + statusIcon + '</span></div>';
      html += '<div class="module-label">' + mod.title + '</div>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  },

  // 打开模块（供章节概览页点击调用）
  openModule(chapterId, moduleIdx) {
    const chapter = CHAPTERS.find(ch => ch.id === chapterId);
    if (!chapter) return;
    const module = chapter.modules[moduleIdx];
    if (!module) return;
    this.open(module, chapter);
  }
};


// == app.js ==
// 主应用逻辑
const App = {
  // 初始化应用
  init() {
    console.log('OI练习助手启动中...');
    
    // 初始化存储
    Storage.init();
    
    // 初始化地图视图
    MapView.init();
    
    // 初始化课程视图
    LessonView.init();
    
    // 初始化AI助手
    AIAssistant.init();
    
    // 绑定全局事件
    this.bindGlobalEvents();
    
    // 更新全局进度
    this.updateGlobalProgress();
    
    console.log('应用初始化完成');
  },

  // 绑定全局事件
  bindGlobalEvents() {
    // 设置按钮
    const btnSettings = document.getElementById('btnSettings');
    if (btnSettings) {
      btnSettings.addEventListener('click', () => {
        this.showSettings();
      });
    }

    // 统计按钮
    const btnStats = document.getElementById('btnStats');
    if (btnStats) {
      btnStats.addEventListener('click', () => {
        this.showStats();
      });
    }

    // 返回按钮（由LessonView处理）
    // 这里不再重复绑定
  },

  // 显示地图视图
  showMap() {
    document.getElementById('mapView').classList.add('active');
    document.getElementById('lessonView').classList.remove('active');
    document.getElementById('btnBack').style.display = 'none';
    
    // 重新渲染地图以更新进度
    MapView.renderMap();
    this.updateGlobalProgress();
  },

  // 显示课程视图
  showLesson() {
    document.getElementById('mapView').classList.remove('active');
    document.getElementById('lessonView').classList.add('active');
    document.getElementById('btnBack').style.display = 'block';
  },

  // 显示设置弹窗
  showSettings() {
    const modal = document.getElementById('settingsModal');
    modal.classList.add('active');
    
    // 加载当前设置
    const settings = Storage.getSettings();
    document.getElementById('settingApiUrl').value = settings.apiUrl || '';
    document.getElementById('settingApiKey').value = settings.apiKey || '';
    document.getElementById('settingModel').value = settings.model || 'gpt-3.5-turbo';
    document.getElementById('settingLuoguUser').value = settings.luoguUser || '';
    
    // 保存按钮
    const saveBtn = document.getElementById('btnSaveSettings');
    saveBtn.onclick = () => {
      const newSettings = {
        apiUrl: document.getElementById('settingApiUrl').value.trim(),
        apiKey: document.getElementById('settingApiKey').value.trim(),
        model: document.getElementById('settingModel').value.trim(),
        luoguUser: document.getElementById('settingLuoguUser').value.trim()
      };
      
      Storage.saveSettings(newSettings);
      modal.classList.remove('active');
      alert('设置已保存！');
    };
    
    // 关闭按钮
    const closeBtn = modal.querySelector('.modal-close');
    closeBtn.onclick = () => {
      modal.classList.remove('active');
    };
  },

  // 显示统计弹窗
  showStats() {
    const modal = document.getElementById('statsModal');
    const body = document.getElementById('statsBody');
    
    // 计算统计数据
    const stats = this.calculateStats();
    
    body.innerHTML = `
      <div class="stats-content">
        <div class="stat-card">
          <div class="stat-icon">📚</div>
          <div class="stat-info">
            <div class="stat-value">${stats.totalChapters}</div>
            <div class="stat-label">总章节数</div>
          </div>
        </div>
        
        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <div class="stat-info">
            <div class="stat-value">${stats.completedChapters}</div>
            <div class="stat-label">已完成章节</div>
          </div>
        </div>
        
        <div class="stat-card">
          <div class="stat-icon">🎯</div>
          <div class="stat-info">
            <div class="stat-value">${stats.totalModules}</div>
            <div class="stat-label">总关卡数</div>
          </div>
        </div>
        
        <div class="stat-card">
          <div class="stat-icon">🏆</div>
          <div class="stat-info">
            <div class="stat-value">${stats.completedModules}</div>
            <div class="stat-label">已完成关卡</div>
          </div>
        </div>
        
        <div class="stat-card">
          <div class="stat-icon">📊</div>
          <div class="stat-info">
            <div class="stat-value">${stats.completionRate}%</div>
            <div class="stat-label">完成率</div>
          </div>
        </div>
        
        <div class="stat-card">
          <div class="stat-icon">⏱️</div>
          <div class="stat-info">
            <div class="stat-value">${stats.studyTime}h</div>
            <div class="stat-label">学习时长</div>
          </div>
        </div>
      </div>
    `;
    
    modal.classList.add('active');
    
    // 关闭按钮
    const closeBtn = modal.querySelector('.modal-close');
    closeBtn.onclick = () => {
      modal.classList.remove('active');
    };
  },

  // 计算统计数据
  calculateStats() {
    let totalModules = 0;
    let completedModules = 0;
    
    CHAPTERS.forEach(chapter => {
      chapter.modules.forEach(module => {
        totalModules++;
        const progress = Storage.getModuleProgress(module.id);
        if (progress && progress.status === 'completed') {
          completedModules++;
        }
      });
    });

    const completedChapters = CHAPTERS.filter(chapter => {
      const progress = MapView.calculateChapterProgress(chapter);
      return progress.completed === progress.total;
    }).length;

    // 计算学习时长（从localStorage读取）
    const studyTime = Storage.getStudyTime() || 0;

    return {
      totalChapters: CHAPTERS.length,
      completedChapters,
      totalModules,
      completedModules,
      completionRate: totalModules > 0 ? Math.round((completedModules / totalModules) * 100) : 0,
      studyTime: Math.round(studyTime / 60) // 转换为小时
    };
  },

  // 更新全局进度
  updateGlobalProgress() {
    const stats = this.calculateStats();
    const progressFill = document.getElementById('globalProgress');
    const progressText = document.getElementById('globalProgressText');
    
    progressFill.style.width = `${stats.completionRate}%`;
    progressText.textContent = `${stats.completionRate}%`;
  }
};

window.addEventListener('DOMContentLoaded', () => {
  App.init();
});
