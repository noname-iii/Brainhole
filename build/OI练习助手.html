using namespace std;

const int MAXN = 10000005;
int phi[MAXN];
int primes[MAXN], cnt = 0;
bool not_prime[MAXN];

// 线性筛求欧拉函数
void euler_sieve(int n) {
    phi[1] = 1;
    for (int i = 2; i <= n; i++) {
        if (!not_prime[i]) {
            primes[cnt++] = i;
            phi[i] = i - 1;
        }
        for (int j = 0; j < cnt && (long long)i * primes[j] <= n; j++) {
            not_prime[i * primes[j]] = true;
            if (i % primes[j] == 0) {
                phi[i * primes[j]] = phi[i] * primes[j];
                break;
            } else {
                phi[i * primes[j]] = phi[i] * (primes[j] - 1);
            }
        }
    }
}

// 单个欧拉函数
int euler_phi(int n) {
    int res = n;
    for (int i = 2; i * i <= n; i++) {
        if (n % i == 0) {
            res = res / i * (i - 1);
            while (n % i == 0) n /= i;
        }
    }
    if (n > 1) res = res / n * (n - 1);
    return res;
}

int main() {
    int n;
    cin >> n;
    euler_sieve(n);
    // 求1~n的欧拉函数之和（洛谷P2158）
    long long sum = 0;
    for (int i = 1; i <= n; i++)
        sum += phi[i];
    cout << sum << endl;
    return 0;
}`

### 一、线性同余方程

**ax ≡ b (mod m)** 等价于 **ax - my = b**，也就是 **ax + m(-y) = b**。

这不就是不定方程吗？！用**扩展欧几里得**就能解！

**有解条件**：gcd(a, m) | b（b 是 gcd 的倍数）

### 二、乘法逆元

当 gcd(a, m) = 1 时，ax ≡ 1 (mod m) 一定有解！

三种求法：
1. **exGCD法**：直接解 ax + my = 1
2. **费马小定理**：当 m 是质数时，a⁻¹ ≡ a^(m-2) (mod m)
3. **线性递推**：O(N) 批量求 1~N 的逆元

> 🧠 费马小定理的原理：a^(m-1) ≡ 1 (mod m)，两边除以 a 得 a^(m-2) ≡ a⁻¹ (mod m)

### 三、线性递推求逆元

有个巧妙的递推式：

inv[i] = -(m/i) · inv[m%i] (mod m)

> 🎯 比喻：用"已知的小逆元"推"大的逆元"，像多米诺骨牌一样！`,

    derivation: `## 📐 推导与实现

### 一、exGCD 解线性同余方程

**ax ≡ b (mod m)** → **ax + my = b**

1. 用 exGCD 求 ax₀ + my₀ = g，其中 g = gcd(a,m)
2. 若 b % g ≠ 0，无解
3. 否则，x₀ = x₀ · (b/g)，这就是一组特解
4. 通解：x = x₀ + (m/g)·t
5. 最小正整数解：((x₀ % (m/g)) + m/g) % (m/g)

### 二、费马小定理求逆元

**前提**：p 是质数，gcd(a, p) = 1

由费马小定理：a^(p-1) ≡ 1 (mod p)
→ a · a^(p-2) ≡ 1 (mod p)
→ a⁻¹ ≡ a^(p-2) (mod p)

用快速幂计算 a^(p-2) mod p，时间复杂度 O(log p)。

### 三、线性递推求逆元 O(N)

**推导**：设 m = k·i + r（k = m/i, r = m%i）

则 k·i + r ≡ 0 (mod m)

两边乘 i⁻¹·r⁻¹：k·r⁻¹ + i⁻¹ ≡ 0 (mod m)

→ **i⁻¹ ≡ -k·r⁻¹ ≡ -(m/i)·(m%i)⁻¹ (mod m)**

\`\`\`
inv[1] = 1;
for (int i = 2; i <= n; i++)
    inv[i] = (long long)(MOD - MOD / i) * inv[MOD % i] % MOD;
\`\`\`

| 方法 | 条件 | 复杂度 | 适用场景 |
|------|------|--------|---------|
| exGCD | gcd(a,m)=1 | O(log m) | 通用 |
| 费马小定理 | m为质数 | O(log m) | 模数为质数 |
| 线性递推 | m为质数 | O(N) | 批量求1~N |`,

#include <bits/stdc++.h>
using namespace std;
typedef long long ll;

// 扩展欧几里得
ll exgcd(ll a, ll b, ll &x, ll &y) {
    if (b == 0) { x = 1; y = 0; return a; }
    ll g = exgcd(b, a % b, x, y);
    ll tmp = x; x = y; y = tmp - (a / b) * y;
    return g;
}

// 方法1：exGCD求逆元
ll inv_exgcd(ll a, ll m) {
    ll x, y;
    ll g = exgcd(a, m, x, y);
    if (g != 1) return -1;  // 逆元不存在
    return (x % m + m) % m;
}

// 方法2：快速幂求逆元（m必须是质数）
ll qpow(ll a, ll b, ll m) {
    ll res = 1; a %= m;
    while (b) {
        if (b & 1) res = res * a % m;
        a = a * a % m;
        b >>= 1;
    }
    return res;

ll inv_fermat(ll a, ll p) {

}

// 方法3：线性递推求1~n的逆元（p必须是质数）
const int MAXN = 3000005;
ll inv[MAXN];
void get_inv(int n, ll p) {
    inv[1] = 1;
    for (int i = 2; i <= n; i++)
        inv[i] = (p - p / i) * inv[p % i] % p;

    problemDesc: `## 🌟 6.3.2 中国剩余定理（CRT）

### 这是什么问题？

想象你是一个古代的将军，你需要点兵。你知道：
- 3人一排多2人
- 5人一排多3人
- 7人一排多2人

问：最少有多少兵？

这就是著名的**"韩信点兵"**问题！数学上就是解一组同余方程：

x ≡ 2 (mod 3)
x ≡ 3 (mod 5)
x ≡ 2 (mod 7)

**中国剩余定理（CRT）** 就是解决这类问题的神器！当模数两两互质时，它能给出唯一解。

经典题目：洛谷 P4777【CRT模板】、洛谷 P1082 的加强版。`,

    idea: `## 💡 算法思想

### 一、问题形式

求解：
x ≡ a₁ (mod m₁)
x ≡ a₂ (mod m₂)
...
x ≡ aₙ (mod mₙ)

其中 m₁, m₂, ..., mₙ **两两互质**。

### 二、核心思想

> 🎯 比喻：想象你在拼拼图，每个同余方程是一块拼图。CRT告诉你怎么把它们拼在一起！

**构造法**：
1. 令 M = m₁ · m₂ · ... · mₙ（所有模数的乘积）
2. 令 Mᵢ = M / mᵢ
3. 求 Mᵢ 模 mᵢ 的逆元 tᵢ（即 Mᵢ · tᵢ ≡ 1 (mod mᵢ)）
4. 答案 x = Σ aᵢ · Mᵢ · tᵢ (mod M)

**为什么有效？**
- 对于第 j 个方程：当 i ≠ j 时，Mᵢ 是 mⱼ 的倍数，所以 aᵢ·Mᵢ·tᵢ ≡ 0 (mod mⱼ)
- 只有 i = j 时，aⱼ·Mⱼ·tⱼ ≡ aⱼ·1 ≡ aⱼ (mod mⱼ)
- 所以 x ≡ aⱼ (mod mⱼ) ✅

### 三、扩展CRT（EXCRT）

当模数**不互质**时，CRT不直接适用。EXCRT通过逐个合并方程来解决。`,

    derivation: `## 📐 推导与实现

### 一、标准CRT

设 M = ∏mᵢ，Mᵢ = M/mᵢ

**步骤**：
1. 对每个 i，求 tᵢ = Mᵢ⁻¹ mod mᵢ（用exGCD或逆元）
2. x = (Σ aᵢ · Mᵢ · tᵢ) mod M

**例子**（韩信点兵）：
- m₁=3, a₁=2; m₂=5, a₂=3; m₃=7, a₃=2
- M = 105
- M₁=35, M₂=21, M₃=15
- t₁=35⁻¹ mod 3 = 2, t₂=21⁻¹ mod 5 = 1, t₃=15⁻¹ mod 7 = 1
- x = (2·35·2 + 3·21·1 + 2·15·1) mod 105 = (140+63+30) mod 105 = 233 mod 105 = 23 ✅

### 二、扩展CRT（模数不互质）

**合并两个方程**：
x ≡ a₁ (mod m₁)  →  x = a₁ + k₁·m₁
x ≡ a₂ (mod m₂)  →  x = a₂ + k₂·m₂

代入：a₁ + k₁·m₁ = a₂ + k₂·m₂
→ k₁·m₁ - k₂·m₂ = a₂ - a₁
→ k₁·m₁ ≡ (a₂ - a₁) (mod m₂)

用exGCD解出k₁，然后合并为：x ≡ a' (mod lcm(m₁,m₂))

**有解条件**：gcd(m₁,m₂) | (a₂-a₁)

逐个合并n个方程即可。

\`\`\`
// EXCRT核心：合并 x ≡ a1 (mod m1) 和 x ≡ a2 (mod m2)
// 返回合并后的 (a, lcm(m1,m2))
pair<ll,ll> merge(ll a1, ll m1, ll a2, ll m2) {
    ll x, y;
    ll g = exgcd(m1, m2, x, y);
    if ((a2 - a1) % g != 0) return {-1, -1}; // 无解
    ll lcm = m1 / g * m2;
    ll delta = (a2 - a1) / g;
    // k1 = delta * x mod (m2/g)
    ll k1 = (__int128)delta % (m2/g) * (x % (m2/g)) % (m2/g);
    ll a_new = (a1 + (__int128)k1 % lcm * m1 % lcm) % lcm;
    a_new = (a_new + lcm) % lcm;
    return {a_new, lcm};
}
\`\`\`

| 版本 | 模数条件 | 复杂度 |
|------|---------|--------|
| CRT | 两两互质 | O(n log M) |
| EXCRT | 无限制 | O(n log M) |`,

    code: `// 完整代码示例：CRT模板（洛谷P4777）
#include <bits/stdc++.h>
using namespace std;
typedef long long ll;

ll exgcd(ll a, ll b, ll &x, ll &y) {
    if (b == 0) { x = 1; y = 0; return a; }
    ll g = exgcd(b, a % b, x, y);
    ll tmp = x; x = y; y = tmp - (a / b) * y;
    return g;
}

// 快速乘（防溢出）
ll mul(ll a, ll b, ll m) {
    return (__int128)a * b % m;
}

// 中国剩余定理（模数两两互质）
ll CRT(int n, ll a[], ll m[]) {
    ll M = 1;
    for (int i = 1; i <= n; i++) M *= m[i];
    ll ans = 0;
    for (int i = 1; i <= n; i++) {
        ll Mi = M / m[i];
        ll x, y;
        exgcd(Mi, m[i], x, y);
        x = (x % m[i] + m[i]) % m[i];  // Mi的逆元
        ans = (ans + mul(a[i], mul(Mi, x, M), M)) % M;
    }
    return (ans % M + M) % M;
}

// 扩展CRT（模数不一定互质）
ll EXCRT(int n, ll a[], ll m[]) {
    ll cur_a = a[1], cur_m = m[1];
    for (int i = 2; i <= n; i++) {
        ll x, y;
        ll g = exgcd(cur_m, m[i], x, y);
        if ((a[i] - cur_a) % g != 0) return -1;  // 无解
        ll lcm = cur_m / g * m[i];
        ll delta = (a[i] - cur_a) / g;
        ll k = (__int128)delta % (m[i]/g) * (x % (m[i]/g)) % (m[i]/g);
        cur_a = (cur_a + (__int128)k % lcm * cur_m % lcm) % lcm;
        cur_a = (cur_a + lcm) % lcm;
        cur_m = lcm;
    }
    return cur_a;
}

int main() {
    int n;
    scanf("%d", &n);
    ll a[105], m[105];
    for (int i = 1; i <= n; i++)
        scanf("%lld%lld", &m[i], &a[i]);
    printf("%lld\\n", CRT(n, a, m));
    return 0;
}`

### 这是什么问题？

**a^x ≡ b (mod p)**

直接枚举 x = 0, 1, 2, ... 最坏要枚举到 p-1，时间复杂度 O(p)，对于 p = 10^9 就TLE了。

### 二、BSGS（Baby-step Giant-step）

> 🎯 比喻：想象你在一个巨大的图书馆找一本书。暴力是一本本翻（O(p)），BSGS是先确定在哪个书架（Giant-step），再在书架上找具体位置（Baby-step）。

**核心思想**：分块！

设 m = ⌈√p⌉，令 x = i·m - j（其中 0 ≤ j < m, 1 ≤ i ≤ m）

则 a^x = a^(im-j) ≡ b (mod p)
→ a^(im) ≡ b · a^j (mod p)

**步骤**：
1. **Baby-step**：计算 b·a^j mod p（j=0,1,...,m-1），存入哈希表
2. **Giant-step**：计算 a^(im) mod p（i=1,2,...,m），在哈希表中查找

时间复杂度 O(√p · log(√p))，空间 O(√p)。

### 三、扩展BSGS

当 gcd(a,p) ≠ 1 时，先提取公因子转化为互质的情况，再用标准BSGS。`,

    derivation: `## 📐 推导与实现

### 一、标准BSGS推导

**目标**：a^x ≡ b (mod p)，gcd(a,p) = 1

设 m = ⌈√p⌉，x = im - j（i ∈ [1,m], j ∈ [0,m-1]）

> 为什么这样设？因为 x 的范围是 [0, p-1]，而 im-j 可以覆盖 [0, m²-1] ⊇ [0, p-1]

a^(im-j) ≡ b (mod p)
两边乘 a^j：a^(im) ≡ b·a^j (mod p)

**Baby-step**：枚举 j = 0,1,...,m-1，计算 b·a^j mod p，存入 map（值→最小的j）

**Giant-step**：枚举 i = 1,2,...,m，计算 a^(im) mod p = (a^m)^i mod p，在map中查找

找到后 x = im - j，取最小的 x。

**复杂度**：
- 时间：O(m log m) = O(√p log p)（map的log）
- 空间：O(m) = O(√p)
- 用unordered_map可以优化到 O(√p)

### 二、exBSGS（a和p不互质）

当 gcd(a,p) = g > 1 时：

a^x ≡ b (mod p)

若 g ∤ b，则当 x ≥ 1 时无解（因为左边是g的倍数，右边不是）。

若 g | b：两边除以g → a^(x-1) · (a/g) ≡ b/g (mod p/g)

但这还不够，因为 a/g 和 p/g 可能还不互质...

**通用方法**：
1. 不断提取 g = gcd(a, p)，同时除 b
2. 设提取了 k 次后 gcd(a, p') = 1
3. 此时方程变为 a^(x-k) · C ≡ b' (mod p')
4. 用标准BSGS解 a^(x-k) ≡ b'·C⁻¹ (mod p')

\`\`\`
// exBSGS核心思路
int exBSGS(int a, int b, int p) {
    a %= p; b %= p;
    if (b == 1 || p == 1) return 0;
    int cnt = 0, D = 1;
    for (int g = gcd(a, p); g > 1; g = gcd(a, p)) {
        if (b % g) return -1;  // 无解
        p /= g; b /= g;
        D = (long long)D * (a / g) % p;
        cnt++;
        if (D == b) return cnt;
    }
    // 现在gcd(a,p)=1，用标准BSGS
    // 解 a^(x-cnt) ≡ b * D^(-1) (mod p)
    ...
}
\`\`\`

| 算法 | 条件 | 复杂度 |
|------|------|--------|
| BSGS | gcd(a,p)=1 | O(√p log p) |
| exBSGS | 无限制 | O(√p log p) |`,

    code: `// 完整代码示例：BSGS（洛谷P3846）
#include <bits/stdc++.h>
using namespace std;
typedef long long ll;

ll qpow(ll a, ll b, ll p) {
    ll res = 1; a %= p;
    while (b) {
        if (b & 1) res = res * a % p;
        a = a * a % p;
        b >>= 1;
    }
    return res;
}

// BSGS：求最小的非负整数x使得 a^x ≡ b (mod p)，gcd(a,p)=1
ll BSGS(ll a, ll b, ll p) {
    a %= p; b %= p;
    if (b == 1 || p == 1) return 0;
    ll m = ceil(sqrt(p));
    unordered_map<ll, ll> mp;  // 存 b*a^j -> j
    ll cur = b % p;
    for (ll j = 0; j < m; j++) {
        mp[cur] = j;  // 保留最小的j
        cur = cur * a % p;
    }
    ll am = qpow(a, m, p);  // a^m
    cur = am;
    for (ll i = 1; i <= m; i++) {
        if (mp.count(cur)) {
            ll ans = i * m - mp[cur];
            return ans;
        }
        cur = cur * am % p;
    }
    return -1;  // 无解
}

// exBSGS：a和p不一定互质
ll exBSGS(ll a, ll b, ll p) {
    a %= p; b %= p;
    if (b == 1 || p == 1) return 0;
    ll cnt = 0, D = 1;
    for (ll g = __gcd(a, p); g > 1; g = __gcd(a, p)) {
        if (b % g) return -1;
        p /= g; b /= g;
        D = D * (a / g) % p;
        cnt++;
        if (D == b) return cnt;
    }
    // 现在gcd(a,p)=1，转化为 a^(x-cnt) ≡ b/D (mod p)
    ll invD = qpow(D, p - 2, p);  // D的逆元（p此时是质数或用exgcd）
    ll target = b * invD % p;
    ll res = BSGS(a, target, p);
    if (res == -1) return -1;
    return res + cnt;
}

int main() {
    ll a, b, p;
    while (scanf("%lld%lld%lld", &p, &a, &b) != EOF) {
        ll ans = BSGS(a, b, p);
        if (ans == -1) puts("no solution");
        else printf("%lld\\n", ans);
    }
    return 0;
}`

    problemDesc: `## 🌟 6.6.1 排列组合

### 这是什么问题？

生活中处处是排列组合！

- 从5个人中选3个人组队，有多少种选法？（**组合** C(5,3)）
- 5个人排成一排拍照，有多少种排法？（**排列** A(5,5) = 5!）
- 把10个不同的球放进3个不同的盒子，有多少种放法？

排列组合是**计数**的基础！在OI中，几乎每场考试都有计数题。

核心问题：
1. 求排列数 A(n,m) = n!/(n-m)!
2. 求组合数 C(n,m) = n!/(m!·(n-m)!)
3. 取模运算下的组合数（Lucas定理等）`,

    idea: `## 💡 算法思想

### 一、基本计数原理

- **加法原理**：完成一件事有n类方法，第i类有aᵢ种，总共 a₁+a₂+...+aₙ 种
- **乘法原理**：完成一件事有n步，第i步有aᵢ种，总共 a₁·a₂·...·aₙ 种

> 🎯 比喻：加法是"或者"，乘法是"然后"。

### 二、排列与组合

- **排列** A(n,m)：从n个**不同**元素中选m个**排顺序** → n!/(n-m)!
- **组合** C(n,m)：从n个**不同**元素中选m个**不排顺序** → n!/(m!(n-m)!)

> 🧠 关系：C(n,m) = A(n,m) / m!（排列去掉顺序就是组合）

### 三、计算方法

1. **递推（杨辉三角）**：C(n,m) = C(n-1,m-1) + C(n-1,m)
2. **阶乘+逆元**：C(n,m) = n! · (m!)⁻¹ · ((n-m)!)⁻¹ mod p
3. **Lucas定理**：当p是质数，C(n,m) mod p = C(n/p, m/p) · C(n%p, m%p) mod p

### 四、特殊技巧

- **隔板法**：把n个相同球放进k个不同盒子（每盒至少1个）→ C(n-1, k-1)
- **多重集组合**：有重复元素的组合`,

    derivation: `## 📐 推导与实现

### 一、杨辉三角（帕斯卡三角）

C(n,0)=1, C(n,n)=1
C(n,m) = C(n-1,m-1) + C(n-1,m)

\`\`\`
C[0][0] = 1;
for (int i = 1; i <= n; i++)
    for (int j = 0; j <= i; j++)
        C[i][j] = (C[i-1][j-1] + C[i-1][j]) % MOD;
\`\`\`

**复杂度**：O(n²)，适合 n ≤ 5000。

### 二、阶乘+逆元 O(N)

预处理阶乘和阶乘的逆元：

\`\`\`
fact[0] = 1;
for (int i = 1; i <= N; i++) fact[i] = fact[i-1] * i % MOD;
inv_fact[N] = qpow(fact[N], MOD - 2);  // 费马小定理
for (int i = N - 1; i >= 0; i--) inv_fact[i] = inv_fact[i+1] * (i+1) % MOD;

ll C(int n, int m) {
    if (m < 0 || m > n) return 0;
    return fact[n] % MOD * inv_fact[m] % MOD * inv_fact[n-m] % MOD;
}
\`\`\`

### 三、Lucas定理

**定理**：p为质数时，C(n,m) mod p = C(⌊n/p⌋, ⌊m/p⌋) · C(n%p, m%p) mod p

**推导**：把n,m写成p进制，逐位计算组合数再相乘。

\`\`\`
ll lucas(ll n, ll m, ll p) {
    if (m == 0) return 1;
    return C(n % p, m % p, p) * lucas(n / p, m / p, p) % p;
}
\`\`\`

**复杂度**：O(p + log_p(n)·log p)，适合 n 很大但 p 不太大（p ≤ 10^5）。

| 方法 | 适用条件 | 复杂度 |
|------|---------|--------|
| 杨辉三角 | n较小 | O(n²) |
| 阶乘+逆元 | 模数为质数 | O(N)预处理，O(1)查询 |
| Lucas | n很大，p较小且为质数 | O(p + log²n) |`,

    code: `// 完整代码示例
#include <bits/stdc++.h>
using namespace std;
typedef long long ll;

const int MOD = 1e9 + 7;
const int MAXN = 200005;

ll fact[MAXN], inv_fact[MAXN];

ll qpow(ll a, ll b, ll p) {
    ll res = 1; a %= p;
    while (b) {
        if (b & 1) res = res * a % p;
        a = a * a % p; b >>= 1;
    }
    return res;
}

void init() {
    fact[0] = 1;
    for (int i = 1; i < MAXN; i++)
        fact[i] = fact[i-1] * i % MOD;
    inv_fact[MAXN-1] = qpow(fact[MAXN-1], MOD-2, MOD);
    for (int i = MAXN-2; i >= 0; i--)
        inv_fact[i] = inv_fact[i+1] * (i+1) % MOD;
}

// 组合数 C(n,m) mod MOD
ll C(int n, int m) {
    if (m < 0 || m > n) return 0;
    return fact[n] % MOD * inv_fact[m] % MOD * inv_fact[n-m] % MOD;
}

// 排列数 A(n,m) mod MOD
ll A(int n, int m) {
    if (m < 0 || m > n) return 0;
    return fact[n] % MOD * inv_fact[n-m] % MOD;
}

// Lucas定理（p为质数）
ll lucas(ll n, ll m, ll p) {
    if (m == 0) return 1;
    // 需要小范围的C函数
    ll fn = 1, fm = 1, fnm = 1;
    ll nn = n % p, mm = m % p;
    for (int i = 1; i <= nn; i++) fn = fn * i % p;
    for (int i = 1; i <= mm; i++) fm = fm * i % p;
    for (int i = 1; i <= nn-mm; i++) fnm = fnm * i % p;
    ll small_C = fn % p * qpow(fm, p-2, p) % p * qpow(fnm, p-2, p) % p;
    return small_C * lucas(n/p, m/p, p) % p;
}

int main() {
    init();
    int n, m;
    cin >> n >> m;
    cout << "C(" << n << "," << m << ") = " << C(n, m) << endl;
    return 0;
}`

### 这是什么问题？

有些计数问题看起来各不相同，但答案都是同一个数列——**卡特兰数**！

- n对括号有多少种合法匹配方式？
- n个节点能构成多少种不同的二叉搜索树？
- 从(0,0)走到(n,n)，每步向右或向上，不越过对角线，有多少种走法？

答案都是 Cₙ = C(2n,n)/(n+1)！

而**斯特林数**解决的是另一类问题：
- 把n个不同的球放进k个**相同的**盒子（第一类/第二类斯特林数）

这些特殊数列在高级计数题中频繁出现！`,

    idea: `## 💡 算法思想

### 一、卡特兰数（Catalan Number）

**定义**：C₀=1, Cₙ = Σ Cᵢ·Cₙ₋₁₋ᵢ（i=0到n-1）

**通项公式**：Cₙ = C(2n, n) / (n+1) = (2n)! / (n! · (n+1)!)

**前几项**：1, 1, 2, 5, 14, 42, 132, 429...

> 🎯 经典模型：
> - 合法括号序列
> - 栈的出栈序列
> - 二叉树计数
> - 不越对角线的格路

### 二、第一类斯特林数 s(n,k)

**定义**：n个不同元素分成k个**圆排列**（环）的方案数。

**递推**：s(n,k) = s(n-1,k-1) + (n-1)·s(n-1,k)

> 🧠 第n个元素：要么自己成一个环（s(n-1,k-1)），要么插入前n-1个元素的某个环中（(n-1)种位置）

### 三、第二类斯特林数 S(n,k)

**定义**：n个不同元素分成k个**非空集合**的方案数。

**递推**：S(n,k) = S(n-1,k-1) + k·S(n-1,k)

> 🧠 第n个元素：要么自己成一个集合（S(n-1,k-1)），要么放入已有的k个集合之一（k种选择）

### 四、计算方法

都可以用递推 O(n²) 或 NTT 优化到 O(n log n)。`,

不合法路径 = C(2n, n-1)（反射原理）
合法路径 = C(2n,n) - C(2n,n-1) = C(2n,n)/(n+1)

| 数列 | 递推 | 通项 | 应用 |

#include <bits/stdc++.h>
using namespace std;
typedef long long ll;

const int MOD = 998244353;
const int MAXN = 200005;

ll fact[MAXN], inv_fact[MAXN];

ll qpow(ll a, ll b, ll p) {
    ll res = 1; a %= p;
    while (b) {
        if (b & 1) res = res * a % p;
        a = a * a % p; b >>= 1;
    }
    return res;
}

    fact[0] = 1;
    for (int i = 1; i < MAXN; i++) fact[i] = fact[i-1] * i % MOD;
    inv_fact[MAXN-1] = qpow(fact[MAXN-1], MOD-2, MOD);
    for (int i = MAXN-2; i >= 0; i--) inv_fact[i] = inv_fact[i+1] * (i+1) % MOD;
}

ll C(int n, int m) {
    if (m < 0 || m > n) return 0;
    return fact[n] % MOD * inv_fact[m] % MOD * inv_fact[n-m] % MOD;
}

// 卡特兰数 C_n = C(2n,n)/(n+1)
ll catalan(int n) {
    return C(2*n, n) % MOD * qpow(n+1, MOD-2, MOD) % MOD;
}

// 第二类斯特林数（递推）
ll S[1005][1005];
void init_stirling(int n) {
    S[0][0] = 1;
    for (int i = 1; i <= n; i++)
        for (int k = 1; k <= i; k++)
            S[i][k] = (S[i-1][k-1] + k * S[i-1][k]) % MOD;
}

// 第二类斯特林数（通项，单点查询）
// S(n,k) = 1/k! * sum_{j=0}^{k} (-1)^{k-j} * C(k,j) * j^n
ll stirling2(int n, int k) {
    ll res = 0;
    for (int j = 0; j <= k; j++) {
        ll term = C(k, j) * qpow(j, n, MOD) % MOD;
        if ((k - j) % 2 == 1) res = (res - term + MOD) % MOD;
        else res = (res + term) % MOD;
    }
    res = res * inv_fact[k] % MOD;
    return res;
}

    init();
    int n;
    cin >> n;
    cout << "Catalan(" << n << ") = " << catalan(n) << endl;
    return 0;

  'ch6_6_3_intro': {
    problemDesc: `## 🌟 6.6.3 容斥原理

### 这是什么问题？

想象你在统计班级里喜欢数学或语文的人数：
- 喜欢数学的有20人
- 喜欢语文的有15人
- 两科都喜欢的有5人

问：至少喜欢一科的有多少人？

答案 = 20 + 15 - 5 = 30（减去重复计算的）

这就是**容斥原理**的核心思想：**先加后减，交替进行**！

当问题变成"求不满足任何条件的方案数"时，容斥原理就派上大用场了！

经典题目：洛谷 P3164【HAOI2011】Problem b（莫比乌斯反演+容斥）`,

    idea: `## 💡 算法思想

### 一、基本公式

|A₁ ∪ A₂ ∪ ... ∪ Aₙ| = Σ|Aᵢ| - Σ|Aᵢ∩Aⱼ| + Σ|Aᵢ∩Aⱼ∩Aₖ| - ...

> 🎯 比喻：像荡秋千一样，一加一减，来回摆动！

### 二、补集形式（更常用）

**不满足任何条件的方案数** = 总数 - 至少满足一个条件的方案数

= Σ(-1)^|S| · (满足S中所有条件的方案数)

其中 S 遍历所有条件子集。

### 三、应用

1. **错排问题**：n个元素的错排数 = Σ(-1)^k · C(n,k) · (n-k)!
2. **互质计数**：1~n中和m互质的数的个数
3. **莫比乌斯反演**：本质就是容斥！
4. **带限制的组合计数**

### 四、实现

通常用**二进制枚举**子集，复杂度 O(2^n · 单次计算)。

当条件数n ≤ 20 时完全可行！`,

    derivation: `## 📐 推导与实现

### 一、容斥原理的证明

**Venn图直觉**：
- 两个集合：|A∪B| = |A| + |B| - |A∩B|
  - 加|A|和|B|时，A∩B被算了两次，减一次刚好
- 三个集合：|A∪B∪C| = |A|+|B|+|C| - |A∩B|-|A∩C|-|B∩C| + |A∩B∩C|

**一般证明**（数学归纳法或计数论证）：
对于恰好属于k个集合的元素，在右边被计算了 C(k,1) - C(k,2) + C(k,3) - ... = 1 次（k≥1时）。

### 二、错排公式

n个元素的错排（每个元素都不在自己位置）：

D(n) = n! · (1 - 1/1! + 1/2! - 1/3! + ... + (-1)^n/n!)
     = Σ_{k=0}^{n} (-1)^k · C(n,k) · (n-k)!
     = Σ_{k=0}^{n} (-1)^k · n! / k!

**推导**：
- 全集 = n!（所有排列）
- Aᵢ = 第i个元素在自己位置的排列
- |Aᵢ| = (n-1)!，|Aᵢ∩Aⱼ| = (n-2)!，...
- |A₁∪...∪Aₙ| = C(n,1)·(n-1)! - C(n,2)·(n-2)! + ...
- D(n) = n! - |A₁∪...∪Aₙ| = Σ(-1)^k · C(n,k)·(n-k)!

### 三、代码实现框架

\`\`\`
ll ans = 0;
for (int S = 0; S < (1 << n); S++) {
    int cnt = __builtin_popcount(S);  // 选了几个条件
    ll ways = calc(S);  // 满足S中所有条件的方案数
    if (cnt % 2 == 0) ans += ways;
    else ans -= ways;
}
\`\`\`

### 四、经典应用：1~n中与m互质的数的个数

m的质因子为p₁,p₂,...,pₖ

答案 = n - Σ⌊n/pᵢ⌋ + Σ⌊n/(pᵢpⱼ)⌋ - ...

= Σ_{S⊆{p₁,...,pₖ}} (-1)^|S| · ⌊n/∏_{p∈S} p⌋

| 应用 | 条件数 | 复杂度 |
|------|--------|--------|
| 错排 | n | O(n) |
| 互质计数 | k（质因子个数） | O(2^k) |
| 一般容斥 | n | O(2^n · calc) |`,

    code: `// 完整代码示例
#include <bits/stdc++.h>
using namespace std;
typedef long long ll;

// 例1：错排数 D(n)
const int MOD = 1e9 + 7;
const int MAXN = 100005;
ll fact[MAXN];

void init() {
    fact[0] = 1;
    for (int i = 1; i < MAXN; i++) fact[i] = fact[i-1] * i % MOD;
}

// 错排数 D(n) = sum (-1)^k * n!/k!
ll derangement(int n) {
    ll res = 0;
    for (int k = 0; k <= n; k++) {
        ll term = fact[n] % MOD * /* inv_fact[k] */ 1 % MOD; // 简化
        if (k % 2 == 0) res = (res + term) % MOD;
        else res = (res - term + MOD) % MOD;
    }
    return res;
}

// 例2：1~n中与m互质的数的个数（容斥）
ll count_coprime(ll n, ll m) {
    // 先找m的质因子
    vector<ll> primes;
    for (ll i = 2; i * i <= m; i++) {
        if (m % i == 0) {
            primes.push_back(i);
            while (m % i == 0) m /= i;
        }
    }
    if (m > 1) primes.push_back(m);
    
    int k = primes.size();
    ll ans = 0;
    // 二进制枚举子集
    for (int S = 0; S < (1 << k); S++) {
        ll prod = 1;
        int cnt = 0;
        for (int i = 0; i < k; i++) {
            if (S >> i & 1) {
                prod *= primes[i];
                cnt++;
            }
        }
        ll term = n / prod;
        if (cnt % 2 == 0) ans += term;
        else ans -= term;
    }
    return ans;
}

int main() {
    ll n, m;
    cin >> n >> m;
    cout << count_coprime(n, m) << endl;
    return 0;
}`

### 这是什么问题？

矩阵就是一个**数表**——m行n列的数字排列。但别小看它！

- 解方程组？矩阵！
- 图上的路径计数？矩阵乘法！
- 递推数列的第n项？矩阵快速幂！
- 图形变换（旋转、缩放）？矩阵！

在OI中，矩阵最重要的应用是**矩阵快速幂**——把O(n)的递推优化到O(log n)！

经典题目：洛谷 P3390【矩阵快速幂】、斐波那契数列第n项`,

    idea: `## 💡 算法思想

### 一、矩阵基础

- **矩阵乘法**：C[i][j] = Σ A[i][k] · B[k][j]
- **单位矩阵** I：对角线为1，其余为0。A·I = A
- **矩阵快速幂**：A^n = A·A·...·A，用快速幂优化到 O(k³ log n)

> 🎯 比喻：矩阵乘法就像"流水线"——输入一个向量，经过矩阵变换，输出新向量。

### 二、矩阵快速幂的应用

**核心思想**：把递推关系写成矩阵形式！

比如斐波那契：F(n) = F(n-1) + F(n-2)

写成矩阵：
[F(n)  ]   [1 1]   [F(n-1)]
[F(n-1)] = [1 0] · [F(n-2)]

所以 [F(n), F(n-1)]^T = M^(n-2) · [F(2), F(1)]^T

用矩阵快速幂，O(log n) 搞定！

### 三、常见递推的矩阵构造

| 递推 | 矩阵 |
|------|------|
| F(n) = F(n-1) + F(n-2) | [[1,1],[1,0]] |
| F(n) = a·F(n-1) + b·F(n-2) | [[a,b],[1,0]] |
| 带常数的递推 | 增加一维存常数 |`,

    derivation: `## 📐 推导与实现

### 一、矩阵乘法

\`\`\`
struct Matrix {
    ll a[105][105];
    int n, m;  // n行m列
};

Matrix mul(Matrix A, Matrix B) {
    Matrix C;
    C.n = A.n; C.m = B.m;
    memset(C.a, 0, sizeof(C.a));
    for (int i = 0; i < C.n; i++)
        for (int k = 0; k < A.m; k++)
            for (int j = 0; j < C.m; j++)
                C.a[i][j] = (C.a[i][j] + A.a[i][k] * B.a[k][j]) % MOD;
    return C;
}
\`\`\`

**复杂度**：O(n³)（或优化到 O(n^2.8) 的Strassen，但OI不常用）

### 二、矩阵快速幂

\`\`\`
Matrix qpow(Matrix A, ll b) {
    Matrix res;
    res.n = res.m = A.n;
    memset(res.a, 0, sizeof(res.a));
    for (int i = 0; i < res.n; i++) res.a[i][i] = 1;  // 单位矩阵
    while (b) {
        if (b & 1) res = mul(res, A);
        A = mul(A, A);
        b >>= 1;
    }
    return res;
}
\`\`\`

**复杂度**：O(k³ log n)，k是矩阵大小。

### 三、斐波那契数列示例

F(n) = F(n-1) + F(n-2)，F(1)=F(2)=1

构造转移矩阵 M = [[1,1],[1,0]]

[F(n)  ]       [F(2)]   [1]
[F(n-1)] = M^(n-2) · [F(1)] = M^(n-2) · [1]

\`\`\`
ll fib(ll n) {
    if (n <= 2) return 1;
    Matrix M;
    M.n = M.m = 2;
    M.a[0][0] = 1; M.a[0][1] = 1;
    M.a[1][0] = 1; M.a[1][1] = 0;
    Matrix res = qpow(M, n - 2);
    return (res.a[0][0] + res.a[0][1]) % MOD;
}
\`\`\`

| 操作 | 复杂度 |
|------|--------|
| 矩阵乘法 | O(k³) |
| 矩阵快速幂 | O(k³ log n) |
| 斐波那契第n项 | O(log n) |`,

    code: `// 完整代码示例：矩阵快速幂（洛谷P3390）
#include <bits/stdc++.h>
using namespace std;
typedef long long ll;

const ll MOD = 1e9 + 7;

struct Matrix {
    ll a[105][105];
    int n;
    Matrix(int _n) : n(_n) {
        memset(a, 0, sizeof(a));
    }
};

// 矩阵乘法
Matrix mul(const Matrix &A, const Matrix &B) {
    Matrix C(A.n);
    for (int i = 0; i < A.n; i++)
        for (int k = 0; k < A.n; k++)
            if (A.a[i][k])  // 小优化
                for (int j = 0; j < A.n; j++)
                    C.a[i][j] = (C.a[i][j] + A.a[i][k] * B.a[k][j]) % MOD;
    return C;
}

// 矩阵快速幂
Matrix qpow(Matrix A, ll b) {
    Matrix res(A.n);
    for (int i = 0; i < A.n; i++) res.a[i][i] = 1;  // 单位矩阵
    while (b) {
        if (b & 1) res = mul(res, A);
        A = mul(A, A);
        b >>= 1;
    }
    return res;
}

int main() {
    ll n, k;
    scanf("%lld%lld", &n, &k);
    Matrix A(n);
    for (int i = 0; i < n; i++)
        for (int j = 0; j < n; j++)
            scanf("%lld", &A.a[i][j]);
    Matrix res = qpow(A, k);
    for (int i = 0; i < n; i++) {
        for (int j = 0; j < n; j++)
            printf("%lld ", res.a[i][j]);
        puts("");
    }
    return 0;
}`

    problemDesc: `## 🌟 6.7.2 高斯消元

### 这是什么问题？

给你n个未知数、n个方程，求每个未知数的值：

2x + y - z = 8
-3x - y + 2z = -11
-2x + y + 2z = -3

这就是**线性方程组**！初中你就学过用"消元法"解方程组，而**高斯消元**就是系统化的消元法。

在OI中，高斯消元常用于：
- 解线性方程组
- 求矩阵的秩/行列式
- 结合异或运算解**异或方程组**

经典题目：洛谷 P3389【高斯消元】、洛谷 P2447【异或方程组】`,

    idea: `## 💡 算法思想

### 一、高斯消元的基本步骤

> 🎯 比喻：就像整理书桌——把东西一层层归位。

**两个阶段**：

1. **前向消元**：把增广矩阵化成上三角形（行阶梯形）
   - 选主元（选绝对值最大的行，减少误差）
   - 用主元行消去下面行的对应列
   
2. **回代**：从最后一行往上，依次求出每个未知数

### 二、解的情况

- **唯一解**：化成上三角后，每行都有主元
- **无解**：出现 0 = 非零数 的行
- **无穷多解**：出现 0 = 0 的行（自由变量）

### 三、异或方程组

当所有运算都是异或（mod 2）时，高斯消元更简单：
- 不需要选主元（没有精度问题）
- 加减法都变成异或
- 常用于"开关问题"、"翻转问题"

### 四、复杂度

O(n³)，n是未知数个数。`,

    derivation: `## 📐 推导与实现

### 一、高斯消元算法

**增广矩阵**：把系数和常数放一起

\`\`\`
[2  1 -1 |  8]
[-3 -1  2 | -11]
[-2  1  2 | -3]
\`\`\`

**第1步**：用第1行消去第2、3行的第1列
- R2 = R2 - (-3/2)·R1
- R3 = R3 - (-2/2)·R1

**第2步**：用第2行消去第3行的第2列

**最终得到上三角**：
\`\`\`
[2  1  -1  |  8 ]
[0  1/2 1/2 | 1/2]
[0  0   3   |  6 ]
\`\`\`

**回代**：
- z = 6/3 = 2
- y = (1/2 - 1/2·2)/(1/2) = ...
- x = ...

### 二、代码实现

\`\`\`
int gauss(double a[][MAXN], double x[], int n) {
    for (int i = 0; i < n; i++) {
        // 选主元
        int pivot = i;
        for (int j = i + 1; j < n; j++)
            if (fabs(a[j][i]) > fabs(a[pivot][i]))
                pivot = j;
        swap(a[i], a[pivot]);
        
        if (fabs(a[i][i]) < EPS) continue;  // 这列没有主元
        
        // 消元
        for (int j = i + 1; j < n; j++) {
            double factor = a[j][i] / a[i][i];
            for (int k = i; k <= n; k++)
                a[j][k] -= factor * a[i][k];
        }
    }
    
    // 回代
    for (int i = n - 1; i >= 0; i--) {
        x[i] = a[i][n];
        for (int j = i + 1; j < n; j++)
            x[i] -= a[i][j] * x[j];
        x[i] /= a[i][i];
    }
}
\`\`\`

### 三、异或方程组

\`\`\`
// 用bitset优化，O(n^3/64)
bitset<MAXN> a[MAXN];
int n;

bool xor_gauss() {
    for (int i = 0; i < n; i++) {
        int pivot = i;
        while (pivot < n && !a[pivot][i]) pivot++;
        if (pivot == n) return false;  // 无解或多解
        swap(a[i], a[pivot]);
        for (int j = 0; j < n; j++)
            if (j != i && a[j][i])
                a[j] ^= a[i];
    }
    return true;  // 唯一解，存在a[i][n]中
}
\`\`\`

| 类型 | 复杂度 | 特点 |
|------|--------|------|
| 实数高斯消元 | O(n³) | 注意精度 |
| 异或高斯消元 | O(n³/64) | bitset优化 |`,

    code: `// 完整代码示例：高斯消元（洛谷P3389）
#include <bits/stdc++.h>
using namespace std;

const double EPS = 1e-9;
const int MAXN = 105;

double a[MAXN][MAXN];  // 增广矩阵
double x[MAXN];        // 解
int n;

// 高斯消元，返回0唯一解，1无解，2无穷多解
int gauss() {
    for (int i = 0; i < n; i++) {
        int pivot = i;
        for (int j = i + 1; j < n; j++)
            if (fabs(a[j][i]) > fabs(a[pivot][i]))
                pivot = j;
        if (fabs(a[pivot][i]) < EPS) continue;
        for (int k = 0; k <= n; k++)
            swap(a[i][k], a[pivot][k]);
        
        double inv = 1.0 / a[i][i];
        for (int k = i; k <= n; k++) a[i][k] *= inv;
        
        for (int j = 0; j < n; j++) {
            if (j == i) continue;
            double factor = a[j][i];
            for (int k = i; k <= n; k++)
                a[j][k] -= factor * a[i][k];
        }
    }
    
    for (int i = 0; i < n; i++) {
        bool all_zero = true;
        for (int j = 0; j < n; j++)
            if (fabs(a[i][j]) > EPS) { all_zero = false; break; }
        if (all_zero && fabs(a[i][n]) > EPS) return 1;  // 无解
        if (all_zero) return 2;  // 无穷多解
    }
    
    for (int i = 0; i < n; i++) x[i] = a[i][n];
    return 0;
}

int main() {
    scanf("%d", &n);
    for (int i = 0; i < n; i++)
        for (int j = 0; j <= n; j++)
            scanf("%lf", &a[i][j]);
    int res = gauss();
    if (res == 0) {
        for (int i = 0; i < n; i++)
            printf("%.2f\\n", x[i]);
    } else if (res == 1) puts("No solution");
    else puts("Infinite solutions");
    return 0;
}`

  'ch6_7_3_intro': {
    problemDesc: `## 🌟 6.7.3 线性基

### 这是什么问题？

给你n个数，每个数都可以选或不选。问：选出的数的**异或和**能产生多少种不同的值？

或者：选出的数的异或和中，第k小的是多少？最大的是多少？

> 🎯 比喻：线性基就像一组"密码钥匙"——用最少的钥匙，就能打开所有可能的"密码锁"（异或值）。

**线性基**是一组数，它和原集合有**相同的异或生成空间**，但个数最少（且线性无关）。

经典题目：洛谷 P3812【线性基模板】、WC2011 最大XOR和路径`,

    idea: `## 💡 算法思想

### 一、什么是线性基？

给定一个数的集合S，线性基是一组数B = {b₁, b₂, ..., bₖ}，满足：
1. B中元素**线性无关**（任意一个不能被其他的异或出来）
2. S中每个数都能用B中元素的异或表示
3. |B| 最小

> 🎯 比喻：就像向量的基——用最少的基向量表示整个空间。这里是"异或空间"的基！

### 二、线性基的性质

1. 线性基的大小 ≤ log₂(max_value)（比如64位整数最多64个）
2. 异或空间中有 2^|B| 种不同的异或值
3. 可以用**贪心**求最大异或值

### 三、插入操作

对于每个数x，从高位到低位：
- 如果x的第i位是1：
  - 如果b[i]为空，把x放在b[i]，结束
  - 如果b[i]有值，x = x ⊕ b[i]，继续往下

### 四、查询操作

- **最大异或值**：从高位到低位贪心，能异或就异或
- **第k小异或值**：把线性基化成"最简形式"，然后按k的二进制位选`,

    derivation: `## 📐 推导与实现

### 一、构建线性基

\`\`\`
ll b[64];  // b[i]表示最高位为i的基向量

bool insert(ll x) {
    for (int i = 62; i >= 0; i--) {
        if (!(x >> i & 1)) continue;
        if (!b[i]) { b[i] = x; return true; }
        x ^= b[i];
    }
    return false;  // x已经能被表示了
}
\`\`\`

**复杂度**：每个数 O(log(max_val))，总共 O(n log(max_val))。

**正确性**：每次插入要么新增一个基向量，要么x被消成0（说明x已经在生成空间中）。

### 二、查询最大异或值

\`\`\`
ll query_max() {
    ll res = 0;
    for (int i = 62; i >= 0; i--)
        res = max(res, res ^ b[i]);  // 能变大就异或
    return res;
}
\`\`\`

**贪心正确性**：高位比所有低位加起来还大（2^i > 2^(i-1) + ... + 1），所以从高位贪心是对的。

### 三、查询第k小异或值

先把线性基**重构**成最简形式（每个b[i]的第j位(j≠i)都是0）：

\`\`\`
void rebuild() {
    for (int i = 62; i >= 0; i--)
        for (int j = i - 1; j >= 0; j--)
            if (b[i] >> j & 1)
                b[i] ^= b[j];
}

ll query_kth(ll k) {
    // 把非零的基向量提取出来
    vector<ll> basis;
    for (int i = 0; i <= 62; i++)
        if (b[i]) basis.push_back(b[i]);
    if (k > (1LL << basis.size())) return -1;  // 不存在
    k--;  // 从0开始
    ll res = 0;
    for (int i = 0; i < basis.size(); i++)
        if (k >> i & 1) res ^= basis[i];
    return res;
}
\`\`\`

| 操作 | 复杂度 |
|------|--------|
| 插入 | O(log V) |
| 查询最大值 | O(log V) |
| 查询第k小 | O(log V)（需rebuild） |
| 构建 | O(n log V) |`,

    code: `// 完整代码示例：线性基（洛谷P3812）
#include <bits/stdc++.h>
using namespace std;
typedef long long ll;

struct LinearBasis {
    ll b[64];  // b[i]：最高位为i的基
    int cnt;   // 基的个数
    
    LinearBasis() {
        memset(b, 0, sizeof(b));
        cnt = 0;
    }
    
    // 插入一个数
    bool insert(ll x) {
        for (int i = 62; i >= 0; i--) {
            if (!(x >> i & 1)) continue;
            if (!b[i]) {
                b[i] = x;
                cnt++;
                return true;
            }
            x ^= b[i];
        }
        return false;  // 已经在生成空间中
    }
    
    // 查询最大异或值
    ll query_max() {
        ll res = 0;
        for (int i = 62; i >= 0; i--)
            res = max(res, res ^ b[i]);
        return res;
    }
    
    // 查询最小异或值（非空子集）
    ll query_min() {
        for (int i = 0; i <= 62; i++)
            if (b[i]) return b[i];
        return 0;
    }
    
    // 重构为最简形式（用于查询第k小）
    void rebuild() {
        for (int i = 62; i >= 0; i--)
            for (int j = i - 1; j >= 0; j--)
                if (b[i] >> j & 1)
                    b[i] ^= b[j];
    }
    
    // 查询第k小（1-indexed，需要rebuild）
    ll query_kth(ll k) {
        vector<ll> basis;
        for (int i = 0; i <= 62; i++)
            if (b[i]) basis.push_back(b[i]);
        int sz = basis.size();
        if (k > (1LL << sz)) return -1;
        k--;
        ll res = 0;

> 🎯 单峰函数：先严格递减再严格递增（下凸），或先递增后递减（上凸）。

### 一、从二分法说起

二分法：在单调函数上找零点。每次取中点，判断零点在左半还是右半，区间减半。

### 二、三分法

单峰函数上找极值，每次取**两个**中点！

> 🎯 比喻：想象你在山谷里，派两个侦察兵分别走到1/3和2/3的位置，比较他们的高度——谁更高，谁那一侧就不可能是谷底！

**步骤**（求最小值，下凸函数）：
1. 取 m₁ = l + (r-l)/3, m₂ = r - (r-l)/3
2. 比较 f(m₁) 和 f(m₂)：
   - 若 f(m₁) < f(m₂)：极值点在 [l, m₂]
   - 若 f(m₁) > f(m₂)：极值点在 [m₁, r]
   - 若相等：极值点在 [m₁, m₂]
3. 重复直到 r-l 足够小

### 三、为什么有效？

- 如果 f(m₁) < f(m₂)，说明 m₂ 在"上坡"段（或m₁在"下坡"段），极值点一定在 m₂ 左边
- 每次区间缩小为原来的 2/3

### 四、整数三分

当定义域是整数时，也可以用整数三分（注意边界处理）。`,

### 一、实数三分

double ternary_search(double l, double r) {
    while (r - l > 1e-9) {  // 精度控制
        double m1 = l + (r - l) / 3;
        double m2 = r - (r - l) / 3;
        if (f(m1) < f(m2))
            r = m2;  // 极值在[l, m2]
        else
            l = m1;  // 极值在[m1, r]
    }
    return f(l);  // 或f((l+r)/2)
}

**自适应辛普森法**是一种数值积分方法：用抛物线去逼近曲线，自动调整精度，快速求出定积分的近似值！

    idea: `## 💡 算法思想

### 一、数值积分

求 ∫[a,b] f(x) dx 的近似值。

**基本思路**：用简单的图形（矩形、梯形、抛物线）去逼近曲线下的面积。

### 二、辛普森公式

> 🎯 比喻：用一段抛物线代替曲线，算抛物线下的面积。

**辛普森公式**：
∫[a,b] f(x)dx ≈ (b-a)/6 · [f(a) + 4f((a+b)/2) + f(b)]

用三个点的函数值，构造一条抛物线，算抛物线的积分。

**精度**：对三次多项式精确！

### 三、自适应策略

> 🧠 核心思想：如果整段的辛普森值和分成两半后的辛普森值之差很小，说明精度够了；否则递归细分！

\`\`\`
simpson(a, b) 和 simpson(a, mid) + simpson(mid, b) 的差 < eps？
- 是：返回结果
- 否：递归细分两半
\`\`\`

### 四、复杂度

自适应，取决于函数的"弯曲程度"。光滑函数很快，振荡函数可能较慢。`,

    derivation: `## 📐 推导与实现

### 一、辛普森公式推导

在 [a,b] 上，用三个点 (a,f(a)), (m,f(m)), (b,f(b))（m=(a+b)/2）构造抛物线 p(x)：

∫[a,b] p(x)dx = (b-a)/6 · [f(a) + 4f(m) + f(b)]

**误差**：O((b-a)^5 · f⁽⁴⁾(ξ))，对不超过三次的多项式精确。

### 二、自适应辛普森

\`\`\`
double simpson(double a, double b) {
    double mid = (a + b) / 2;
    return (b - a) / 6 * (f(a) + 4 * f(mid) + f(b));
}

double asr(double a, double b, double eps, double ans) {
    double mid = (a + b) / 2;
    double left = simpson(a, mid);
    double right = simpson(mid, b);
    if (abs(left + right - ans) <= 15 * eps)  // 15倍误差估计
        return left + right + (left + right - ans) / 15;  // Richardson外推
    return asr(a, mid, eps / 2, left) + asr(mid, b, eps / 2, right);
}

double integrate(double a, double b, double eps = 1e-9) {
    return asr(a, b, eps, simpson(a, b));
}
\`\`\`

### 三、关键细节

1. **15倍eps的判断**：经验值，实际误差大约是 |S(a,b) - S(a,m) - S(m,b)| / 15
2. **Richardson外推**：最后加上 (left+right-ans)/15 可以提高精度
3. **eps的选取**：一般 1e-8 到 1e-12

### 四、与其他方法比较

| 方法 | 精度 | 速度 | 特点 |
|------|------|------|------|
| 矩形法 | O(h) | 快 | 最粗糙 |
| 梯形法 | O(h²) | 快 | 较平滑 |
| 辛普森 | O(h⁴) | 中 | 抛物线逼近 |
| 自适应辛普森 | 可控 | 自适应 | 智能细分 |`,

// 示例函数：f(x) = (cx+d)/(ax+b) 的不定积分
// 或者任意你需要的函数
double a_coeff, b_coeff, c_coeff, d_coeff;

    return (c_coeff * x + d_coeff) / (a_coeff * x + b_coeff);
}

// 辛普森公式
double simpson(double l, double r) {
    double mid = (l + r) / 2;
    return (r - l) / 6.0 * (f(l) + 4 * f(mid) + f(r));
}

// 自适应辛普森递归
// eps: 当前精度要求
// ans: simpson(l, r) 的值
double asr(double l, double r, double eps, double ans) {

    double left = simpson(l, mid);
    double right = simpson(mid, r);

    // 否则递归细分
    return asr(l, mid, eps / 2, left) + asr(mid, r, eps / 2, right);
}

// 积分接口
double integrate(double l, double r, double eps = 1e-9) {
    return asr(l, r, eps, simpson(l, r));
}

    problemDesc: `## 🧱 7.9 分块（块状数据结构，莫队基础）

### 这是什么问题？

想象你是一个图书馆管理员，面前有100万本书排成一排，读者们不断提出两种要求：
1. **修改操作**：把第i本书的价格改成x元 💰
2. **查询操作**：统计第i本到第j本书的总价格 📊

如果用普通数组，修改O(1)但查询O(n)；如果用前缀和，查询O(1)但修改O(n)。有没有两全其美的办法？

**分块思想**：把100万本书分成1000堆，每堆1000本。每堆维护一个"总价标签"。这样：
- 修改一本书：更新它所在堆的标签，O(√n)
- 查询区间：完整堆直接加标签，零散的本本加，O(√n)

这就是**块状数据结构**的精髓！它还是**莫队算法**的基础——一个能解决区间查询问题的神奇离线技巧。`,

    idea: `## 💡 算法思想

### 一、分块：平衡的艺术 🎭

想象你在分蛋糕🍰，一整块太大不好拿，太碎又麻烦。分块就是把数据分成"大小适中"的小块：

- **块大小**：通常设为√n（n是数据规模）
- **块数量**：也是√n个块
- **核心思想**：用空间换时间，用"块级操作"代替"逐个操作"

> 🎯 比喻：分块就像班级管理！老师不直接管50个学生，而是管5个组长，每个组长管10个学生。效率up up！

### 二、块状数组的操作

**预处理**：
1. 把数组分成√n块，每块√n个元素
2. 计算每块的和/最值/其他信息

**单点修改**：
1. 找到元素所在的块
2. 更新元素值
3. 更新该块的信息
→ 时间复杂度：O(√n)

**区间查询**：
1. 如果区间在同一个块内：暴力遍历，O(√n)
2. 如果跨多个块：
   - 左边的零散部分：暴力遍历
   - 中间的完整块：直接加块信息
   - 右边的零散部分：暴力遍历
→ 时间复杂度：O(√n)

### 三、莫队算法：分块的升级版 🚀

莫队算法解决的是**离线区间查询**问题。核心思想：

1. 把所有查询按"左端点所在块"排序
2. 同一块内按"右端点"排序
3. 维护一个"当前区间"，通过**移动端点**来回答所有查询

> 🧠 关键洞察：相邻查询的区间重叠很多，移动端点的代价很小！

**时间复杂度**：O(n√n)，比暴力快得多！`,

    derivation: `## 分块的推导与实现

### 1. 块状数组的数学分析

设数组长度为n，块大小为B：
- 块数量：⌈n/B⌉
- 单点修改：O(1)更新元素 + O(1)更新块信息 = O(1)
- 区间查询：最多2个零散块（各B个元素）+ 最多n/B个完整块
  - 总时间：O(B + n/B)

**最优块大小**：令 B = n/B，解得 B = √n
- 此时时间复杂度：O(√n)

### 2. 块状数组代码实现

\`\`\`cpp
#include <bits/stdc++.h>
using namespace std;

const int MAXN = 100005;
const int BLOCK = 320; // √100000 ≈ 316

int a[MAXN];        // 原数组
long long sum[350]; // 每块的和
int n, m;

// 查询元素x所在的块编号
int getBlock(int x) {
    return x / BLOCK;
}

// 单点修改：a[pos] += val
void update(int pos, int val) {
    int b = getBlock(pos);
    a[pos] += val;
    sum[b] += val; // 更新块信息
}

// 区间查询：sum(a[l..r])
long long query(int l, int r) {
    long long ans = 0;
    int bl = getBlock(l), br = getBlock(r);
    
    if (bl == br) {
        // 同一个块内：暴力
        for (int i = l; i <= r; i++)
            ans += a[i];
    } else {
        // 左边零散部分
        for (int i = l; i < (bl + 1) * BLOCK; i++)
            ans += a[i];
        // 中间完整块
        for (int b = bl + 1; b < br; b++)
            ans += sum[b];
        // 右边零散部分
        for (int i = br * BLOCK; i <= r; i++)
            ans += a[i];
    }
    return ans;
}
\`\`\`

### 3. 莫队算法推导

**问题**：给定数组a，多次查询区间[l,r]内不同元素的个数。

**朴素做法**：每次查询用set统计，O(n log n) per query，总O(n² log n) ❌

**莫队优化**：
1. 离线所有查询
2. 按左端点分块排序，同块内按右端点排序
3. 维护当前区间的答案，通过移动端点更新

**关键分析**：
- 左端点：每次最多移动O(√n)（因为同块内）
- 右端点：每换一个块，右端点最多移动O(n)，共√n个块，总O(n√n)
- 总时间复杂度：O(n√n) ✅

\`\`\`cpp
struct Query {
    int l, r, id;
} q[MAXN];

// 排序规则
bool cmp(Query a, Query b) {
    int ba = a.l / BLOCK, bb = b.l / BLOCK;
    if (ba != bb) return ba < bb;
    return a.r < b.r; // 同块内按右端点排序
}

int cnt[MAXN]; // 每个元素出现次数
int ans[MAXN];
int currentAns = 0;

// 添加元素
void add(int pos) {
    cnt[a[pos]]++;
    if (cnt[a[pos]] == 1) currentAns++; // 新出现
}

// 删除元素
void del(int pos) {
    cnt[a[pos]]--;
    if (cnt[a[pos]] == 0) currentAns--; // 消失了
}

// 莫队主过程
void moTeam() {
    sort(q + 1, q + m + 1, cmp);
    int curL = 1, curR = 0; // 当前区间为空
    
    for (int i = 1; i <= m; i++) {
        // 扩展区间
        while (curR < q[i].r) add(++curR);
        while (curL > q[i].l) add(--curL);
        // 缩小区间
        while (curR > q[i].r) del(curR--);
        while (curL < q[i].l) del(curL++);
        
        ans[q[i].id] = currentAns;
    }
}
\`\`\`

### 4. 时间复杂度总结

| 操作 | 块状数组 | 莫队算法 |
|------|---------|---------|
| 预处理 | O(n) | O(n) |
| 单点修改 | O(√n) | - |
| 区间查询 | O(√n) | - |
| 离线查询 | - | O(n√n) |

### 这是什么问题？

想象你是一个游戏设计师，需要管理玩家的战斗力排名系统🏆：

如果用普通堆，合并两个堆需要O(n)——把一个小堆的元素逐个插入大堆。太慢了！

**可并堆**（Mergeable Heap）就是为了解决这个问题！它支持：
- **合并**两个堆：O(log n) 甚至 O(1)
- **插入**元素：O(log n)
- **查询/删除最值**：O(log n)

**左偏树**（Leftist Tree）是可并堆的一种优雅实现，它通过"左偏"的性质保证树的高度平衡，让合并操作飞快！`,

    idea: `## 💡 算法思想

### 一、什么是可并堆？ 🎯

可并堆就是一种**支持快速合并**的堆数据结构。

> 🧠 比喻：普通堆像一个严格的班级，只能按成绩排队。可并堆像两个班级合并，能快速重新排好队！

**核心操作**：
- **merge(A, B)**：合并两个堆，返回新堆
- **insert(x)**：插入元素（可以看成merge一个单元素堆）
- **findMin()**：查询最小值
- **deleteMin()**：删除最小值

### 二、左偏树的性质 🌳

左偏树是一种**二叉树**，满足：
1. **堆性质**：每个节点的值 ≤ 它儿子的值（小根堆）
2. **左偏性质**：每个节点的左儿子距离 ≥ 右儿子距离

**距离（dist）**定义：
- 空节点的dist = -1
- 非空节点的dist = 右儿子的dist + 1

> 🎯 关键洞察：左偏树的"左偏"保证了树的高度是O(log n)！

**为什么左偏能保证平衡？**
- 如果一个节点有n个后代，它的dist最多是log(n+1)-1
- 因为左偏，左子树至少和右子树一样"深"
- 所以树不会"歪"得太厉害

### 三、合并操作的核心思想 🚀

合并两个左偏树A和B（假设A的根更小）：
1. 把B合并到A的**右子树**（因为右子树更"浅"）
2. 递归合并A的右子树和B
3. 合并后，如果左儿子的dist < 右儿子的dist，交换左右儿子（恢复左偏性质）
4. 更新当前节点的dist

**时间复杂度**：O(log n)，因为每次递归都往右走，而右路径长度是O(log n)！`,

    derivation: `## 左偏树的推导与实现

### 1. 左偏树的数学性质

**定理**：一棵有n个节点的左偏树，根节点的dist ≤ log₂(n+1) - 1

**证明**（归纳法）：
- 基础：n=1时，dist=0，log₂(2)-1=0 ✓
- 归纳：设左子树有nL个节点，右子树有nR个节点
  - 由左偏性质：dist(left) ≥ dist(right)
  - 由归纳假设：dist(right) ≤ log₂(nR+1) - 1
  - 所以 dist(root) = dist(right) + 1 ≤ log₂(nR+1)
  - 又因为 n ≥ nL + nR + 1 ≥ 2·nR + 1（左偏保证左子树≥右子树）
  - 所以 nR ≤ (n-1)/2
  - 代入得：dist(root) ≤ log₂((n-1)/2 + 1) = log₂((n+1)/2) = log₂(n+1) - 1 ✓

**推论**：左偏树的高度是O(log n)，所以merge操作是O(log n)！

### 2. 节点结构

\`\`\`cpp
struct Node {
    int val;       // 节点值
    int dist;      // 距离
    int left, right; // 左右儿子
    int fa;        // 父节点（用于删除）
} t[MAXN];
\`\`\`

### 3. 合并操作实现

\`\`\`cpp
// 合并两棵左偏树，返回新树的根
int merge(int x, int y) {
    if (!x || !y) return x | y; // 空树处理
    
    // 保证x是较小的（堆性质）
    if (t[x].val > t[y].val) swap(x, y);
    
    // 把y合并到x的右子树
    t[x].right = merge(t[x].right, y);
    t[t[x].right].fa = x; // 维护父指针
    
    // 恢复左偏性质
    if (t[t[x].left].dist < t[t[x].right].dist)
        swap(t[x].left, t[x].right);
    
    // 更新dist
    t[x].dist = t[t[x].right].dist + 1;
    
    return x;
}
\`\`\`

### 4. 其他操作

\`\`\`cpp
// 插入元素：合并一个单节点
int insert(int root, int val) {
    int x = ++nodeCnt;
    t[x].val = val;
    t[x].dist = 0;
    t[x].left = t[x].right = 0;
    return merge(root, x);
}

// 查询最小值
int findMin(int root) {
    return t[root].val;
}

// 删除最小值：把根的左右子树合并
int deleteMin(int root) {
    int left = t[root].left;
    int right = t[root].right;
    t[left].fa = t[right].fa = 0;
    return merge(left, right);
}

// 删除任意节点（需要父指针）
int deleteNode(int x) {
    int left = t[x].left, right = t[x].right;
    int fa = t[x].fa;
    
    // 合并x的左右子树
    int newSubtree = merge(left, right);
    t[newSubtree].fa = fa;
    
    // 把x从父节点断开，连上新子树
    if (t[fa].left == x) t[fa].left = newSubtree;
    else t[fa].right = newSubtree;
    
    // 向上维护左偏性质
    while (fa) {
        if (t[t[fa].left].dist < t[t[fa].right].dist)
            swap(t[fa].left, t[fa].right);
        t[fa].dist = t[t[fa].right].dist + 1;
        fa = t[fa].fa;
    }
    
    return newSubtree; // 返回新根
}
\`\`\`

### 5. 时间复杂度总结

| 操作 | 时间复杂度 | 说明 |
|------|-----------|------|
| merge | O(log n) | 递归深度≤log n |
| insert | O(log n) | 一次merge |
| findMin | O(1) | 直接返回根 |
| deleteMin | O(log n) | 一次merge |
| deleteNode | O(log n) | merge + 向上维护 |

左偏树是"可并堆的优雅实现"，在需要频繁合并堆的场景中大放异彩！`,

    t[x].left = t[x].right = t[x].fa = 0;

    if (!x || !y) return x | y;
    
    if (t[x].val > t[y].val) swap(x, y);
    
    t[x].right = merge(t[x].right, y);

    else t[fa].right = newSubtree;

        t[fa].dist = t[t[fa].right].dist + 1;

  'ch7_11_intro': {
    problemDesc: `## 🌳 7.11 主席树（可持久化线段树）

### 这是什么问题？

想象你是一个历史学家，需要记录一个王朝的变迁📜：
- **第1年**：村庄A有10户人家
- **第2年**：村庄A变成15户，村庄B新建5户
- **第3年**：查询第1年村庄A有多少户？第2年所有村庄总共有多少户？

如果用普通线段树，每次修改都会**覆盖**之前的状态，无法回答历史查询！

**主席树**（可持久化线段树）就是为了解决这个问题！它支持：
- **修改**：更新某个位置的值
- **查询历史版本**：查询任意历史时刻的区间信息
- **保留所有版本**：每次修改都生成一个新版本，不破坏旧版本

> 🎯 比喻：主席树就像"时光机"，可以回到过去的任何时刻查看数据！

经典应用：查询区间第k小值（洛谷P3834）。`,

    idea: `## 💡 算法思想

### 一、可持久化的核心思想 🕰️

**问题**：如何保存数据结构的"所有历史版本"？

**朴素想法**：每次修改都完整复制一份。但这样空间O(n·m)，m是修改次数，爆炸💥！

**主席树的优化**：
- 每次修改只影响线段树的**一条路径**（从根到叶子）
- 其他节点可以**共享**！
- 所以只需要**新建被修改的节点**，其他指向旧版本

> 🧠 比喻：就像修改作文，只重写改动的段落，其他段落复印原来的！

### 二、主席树的结构 🌲

**建树过程**：
1. 初始版本：建一棵完整的线段树（版本0）
2. 第i次修改：
   - 从版本i-1的根开始
   - 沿着修改路径，**新建**经过的节点
   - 新建节点的子节点：如果没被修改，指向旧版本的节点
   - 生成版本i的新根

**关键性质**：
- 每次修改新建O(log n)个节点
- 总空间：O(n + m log n)，m是修改次数
- 查询历史版本：从对应版本的根开始查询

### 三、经典应用：区间第k小 🎯

**问题**：给定数组，多次查询区间[l,r]中第k小的数。

**主席树解法**：
1. 对数组建立**权值线段树**（按数值大小建线段树）
2. 每个版本i保存前i个元素的权值线段树
3. 查询[l,r]：用版本r的线段树 - 版本l-1的线段树
4. 在权值线段树上二分，找到第k小

> 🎯 比喻：就像数数1~100中第k小的数，先看左半区有多少个，如果<k就去右半区找！`,

    derivation: `## 主席树的推导与实现

### 1. 空间复杂度分析

设数组长度为n，修改次数为m：
- 初始建树：O(n)个节点
- 每次修改：新建O(log n)个节点（一条路径）
- 总空间：O(n + m log n)

**对比**：
- 朴素复制：O(n·m) ❌
- 主席树：O(n + m log n) ✅

### 2. 节点结构

\`\`\`cpp
struct Node {
    int left, right; // 左右儿子编号
    int sum;         // 区间和（或其他信息）
} t[MAXN * 40];      // 空间要开够！

int root[MAXN];      // 每个版本的根节点
int nodeCnt = 0;
\`\`\`

### 3. 建树

\`\`\`cpp
// 建树：版本0
int build(int l, int r) {
    int p = ++nodeCnt;
    if (l == r) {
        t[p].sum = 0;
        return p;
    }
    int mid = (l + r) / 2;
    t[p].left = build(l, mid);
    t[p].right = build(mid + 1, r);
    t[p].sum = t[t[p].left].sum + t[t[p].right].sum;
    return p;
}
\`\`\`

### 4. 修改（生成新版本）

\`\`\`cpp
// 修改：在版本pre的基础上，把位置pos加上val
// 返回新版本的根
int modify(int pre, int l, int r, int pos, int val) {
    int p = ++nodeCnt; // 新建节点
    t[p] = t[pre];     // 复制旧节点
    
    if (l == r) {
        t[p].sum += val;
        return p;
    }
    
    int mid = (l + r) / 2;
    if (pos <= mid)
        t[p].left = modify(t[pre].left, l, mid, pos, val);
    else
        t[p].right = modify(t[pre].right, mid + 1, r, pos, val);
    
    t[p].sum = t[t[p].left].sum + t[t[p].right].sum;
    return p;
}
\`\`\`

### 5. 查询历史版本

\`\`\`cpp
// 查询版本root[i]中区间[ql,qr]的和
int query(int root, int l, int r, int ql, int qr) {
    if (ql <= l && r <= qr) return t[root].sum;
    
    int mid = (l + r) / 2;
    int ans = 0;
    if (ql <= mid) ans += query(t[root].left, l, mid, ql, qr);
    if (qr > mid) ans += query(t[root].right, mid + 1, r, ql, qr);
    return ans;
}
\`\`\`

### 6. 区间第k小（经典应用）

\`\`\`cpp
// 查询区间[ql,qr]中第k小的数
// root[i]表示前i个元素的权值线段树
int queryKth(int rootL, int rootR, int l, int r, int k) {
    if (l == r) return l;
    
    int mid = (l + r) / 2;
    // 左半区的元素个数 = 版本R的左子树 - 版本L-1的左子树
    int leftCount = t[t[rootR].left].sum - t[t[rootL].left].sum;
    
    if (k <= leftCount)
        // 第k小在左半区
        return queryKth(t[rootL].left, t[rootR].left, l, mid, k);
    else
        // 第k小在右半区，k减去左半区的数量
        return queryKth(t[rootL].right, t[rootR].right, mid + 1, r, k - leftCount);
}
\`\`\`

### 7. 完整流程示例

假设数组a = [3, 1, 4, 1, 5]，查询[2,4]中第2小的数：

1. 建树：root[0] = 空树
2. 插入a[1]=3：root[1] = modify(root[0], 1, 5, 3, 1)
3. 插入a[2]=1：root[2] = modify(root[1], 1, 5, 1, 1)
4. 插入a[3]=4：root[3] = modify(root[2], 1, 5, 4, 1)
5. 插入a[4]=1：root[4] = modify(root[3], 1, 5, 1, 1)
6. 插入a[5]=5：root[5] = modify(root[4], 1, 5, 5, 1)

查询[2,4]第2小：queryKth(root[1], root[4], 1, 5, 2)
- root[4] - root[1] 表示a[2..4] = [1, 4, 1]
- 第2小是1（排序后[1, 1, 4]）

### 8. 时间复杂度总结

| 操作 | 时间复杂度 | 空间复杂度 |
|------|-----------|-----------|
| 建树 | O(n) | O(n) |
| 修改 | O(log n) | O(log n) 新节点 |
| 查询 | O(log n) | O(1) |
| 区间第k小 | O(log n) | O(1) |

主席树是"可持久化思想的典范"，让线段树拥有了"时光机"能力！`,

struct Node {

    int sum;

int getRank(int x) {
    return lower_bound(vals.begin(), vals.end(), x) - vals.begin() + 1;
}

// 建树
int build(int l, int r) {
    int p = ++nodeCnt;
    t[p].sum = 0;
    if (l == r) {
        t[p].left = t[p].right = 0;
        return p;
    }
    int mid = (l + r) / 2;
    t[p].left = build(l, mid);
    t[p].right = build(mid + 1, r);
    return p;
}

// 修改：生成新版本
int modify(int pre, int l, int r, int pos, int val) {
    int p = ++nodeCnt;
    t[p] = t[pre];
    
    if (l == r) {
        t[p].sum += val;
        return p;
    }
    
    int mid = (l + r) / 2;
    if (pos <= mid)
        t[p].left = modify(t[pre].left, l, mid, pos, val);
    else
        t[p].right = modify(t[pre].right, mid + 1, r, pos, val);
    
    t[p].sum = t[t[p].left].sum + t[t[p].right].sum;
    return p;
}

    if (k <= leftCount)
        return queryKth(t[rootL].left, t[rootR].left, l, mid, k);
    else

    problemDesc: `## ⚖️ 7.12 平衡树（Splay/Treap）

### 这是什么问题？

想象你是一个学校图书管理员，需要管理一个动态的书单📚：
1. **插入**一本新书
2. **删除**一本书
3. **查询**某本书的排名（按价格排序）
4. **查询**排名为k的书是哪本
5. **查询**某本书的前驱（价格比它低的书中最高的）和后继（价格比它高的书中最低的）

如果用普通数组，插入删除O(n)太慢；如果用普通BST，可能退化成链，也是O(n)！

**平衡树**就是为了解决这个问题！它通过"旋转"或"随机优先级"保持树的平衡，让所有操作都是O(log n)。

**两种经典实现**：
- **Splay**：通过"伸展"操作，把访问的节点旋转到根
- **Treap**：给每个节点随机优先级，用堆性质保持平衡

> 🎯 比喻：平衡树就像"会自我调整的书架"，让常用的书总在容易拿到的地方！`,

    idea: `## 💡 算法思想

### 一、BST的问题与平衡的必要性 🌳

**二叉搜索树（BST）**的性质：
- 左子树所有节点 < 根 < 右子树所有节点
- 中序遍历是有序的

**问题**：如果插入顺序是1,2,3,4,5... BST会退化成链！
\`\`\`
1
 \\
  2
   \\
    3
     \\
      4
\`\`\`
这样查询就变成O(n)了！

**解决方案**：让树"平衡"起来，保证高度是O(log n)。

### 二、Splay：旋转的艺术 🔄

**核心思想**：每次访问一个节点后，通过"旋转"把它移到根节点。

**旋转操作**：
- **左旋**：把右儿子提上来，自己变成左儿子
- **右旋**：把左儿子提上来，自己变成右儿子

> 🧠 比喻：就像玩魔方，通过旋转让目标面转到顶层！

**Splay的三种情况**（把节点x旋转到父节点p的下方）：
1. **Zig**：x是p的儿子，p是根 → 单次旋转
2. **Zig-Zig**：x和p都是左儿子（或都是右儿子）→ 先旋转p，再旋转x
3. **Zig-Zag**：x是左儿子p是右儿子（或相反）→ 先旋转x，再旋转x

**关键洞察**：虽然单次操作可能O(n)，但**均摊分析**证明每次操作是O(log n)！

### 三、Treap：随机的魔法 🎲

**核心思想**：给每个节点一个**随机优先级**，同时满足：
- BST性质：左子树 < 根 < 右子树
- 堆性质：父节点优先级 > 儿子优先级（大根堆）

**为什么随机能保持平衡？**
- 随机优先级让树的形状"期望平衡"
- 期望高度是O(log n)

**操作**：
- **插入**：先按BST性质插入，然后通过旋转维护堆性质
- **删除**：把要删的节点旋转到叶子，然后删除
- **查询**：和普通BST一样`,

    derivation: `## 平衡树的推导与实现

### 1. Splay的均摊复杂度分析

**势能法**：定义势能Φ = Σlog(size(x))，x是所有节点

- **初始势能**：O(n log n)
- **最终势能**：O(n log n)
- **每次splay的实际代价**：O(旋转次数)
- **势能变化**：O(log n)

**结论**：每次splay的**均摊代价**是O(log n)！

### 2. Splay代码实现

\`\`\`cpp
struct Node {
    int ch[2]; // 左右儿子
    int fa;    // 父节点
    int val;   // 节点值
    int cnt;   // 重复次数
    int size;  // 子树大小
} t[MAXN];

int root, nodeCnt;

// 判断x是父节点的左儿子还是右儿子
bool get(int x) {
    return t[t[x].fa].ch[1] == x;
}

// 更新节点信息
void pushup(int x) {
    if (x) {
        t[x].size = t[x].cnt;
        if (t[x].ch[0]) t[x].size += t[t[x].ch[0]].size;
        if (t[x].ch[1]) t[x].size += t[t[x].ch[1]].size;
    }
}

// 旋转操作
void rotate(int x) {
    int y = t[x].fa, z = t[y].fa, k = get(x);
    t[y].ch[k] = t[x].ch[k ^ 1];
    if (t[x].ch[k ^ 1]) t[t[x].ch[k ^ 1]].fa = y;
    t[x].ch[k ^ 1] = y;
    t[y].fa = x;
    t[x].fa = z;
    if (z) t[z].ch[t[z].ch[1] == y] = x;
    pushup(y);
    pushup(x);
}

// Splay操作：把x旋转到目标节点goal的下方
void splay(int x, int goal) {
    while (t[x].fa != goal) {
        int y = t[x].fa, z = t[y].fa;
        if (z != goal) {
            if (get(x) == get(y)) rotate(y); // Zig-Zig
            else rotate(x); // Zig-Zag
        }
        rotate(x);
    }
    if (goal == 0) root = x;
}
\`\`\`

### 3. Splay的完整操作

\`\`\`cpp
// 插入值为val的节点
void insert(int val) {
    int cur = root, p = 0;
    while (cur && t[cur].val != val) {
        p = cur;
        cur = t[cur].ch[val > t[cur].val];
    }
    if (cur) {
        t[cur].cnt++; // 已存在，增加计数
    } else {
        cur = ++nodeCnt;
        if (p) t[p].ch[val > t[p].val] = cur;
        t[cur].fa = p;
        t[cur].ch[0] = t[cur].ch[1] = 0;
        t[cur].val = val;
        t[cur].cnt = t[cur].size = 1;
    }
    splay(cur, 0); // 旋转到根
}

// 查询值为val的节点的排名
int getRank(int val) {
    int cur = root, rank = 0;
    while (cur) {
        if (val == t[cur].val) {
            rank += t[t[cur].ch[0]].size + 1;
            splay(cur, 0);
            return rank;
        } else if (val < t[cur].val) {
            cur = t[cur].ch[0];
        } else {
            rank += t[t[cur].ch[0]].size + t[cur].cnt;
            cur = t[cur].ch[1];
        }
    }
    return -1; // 不存在
}

// 查询排名为k的节点值
int getKth(int k) {
    int cur = root;
    while (cur) {
        int leftSize = t[t[cur].ch[0]].size;
        if (k <= leftSize) {
            cur = t[cur].ch[0];
        } else if (k <= leftSize + t[cur].cnt) {
            splay(cur, 0);
            return t[cur].val;
        } else {
            k -= leftSize + t[cur].cnt;
            cur = t[cur].ch[1];
        }
    }
    return -1;
}

// 查询前驱（小于val的最大值）
int getPre(int val) {
    int cur = root, pre = -1;
    while (cur) {
        if (t[cur].val < val) {
            pre = t[cur].val;
            cur = t[cur].ch[1];
        } else {
            cur = t[cur].ch[0];
        }
    }
    return pre;
}

// 查询后继（大于val的最小值）
int getNxt(int val) {
    int cur = root, nxt = -1;
    while (cur) {
        if (t[cur].val > val) {
            nxt = t[cur].val;
            cur = t[cur].ch[0];
        } else {
            cur = t[cur].ch[1];
        }
    }
    return nxt;
}

// 删除值为val的节点
void del(int val) {
    int cur = root;
    while (cur && t[cur].val != val) {
        cur = t[cur].ch[val > t[cur].val];
    }
    if (!cur) return;
    
    splay(cur, 0); // 先旋转到根
    
    if (t[cur].cnt > 1) {
        t[cur].cnt--;
        pushup(cur);
        return;
    }
    
    // 只有一个儿子或没有儿子
    if (!t[cur].ch[0] && !t[cur].ch[1]) {
        root = 0;
    } else if (!t[cur].ch[0]) {
        root = t[cur].ch[1];
        t[root].fa = 0;
    } else if (!t[cur].ch[1]) {
        root = t[cur].ch[0];
        t[root].fa = 0;
    } else {
        // 有两个儿子：找前驱，把前驱旋转到根，把右子树挂到前驱的右儿子
        int pre = t[cur].ch[0];
        while (t[pre].ch[1]) pre = t[pre].ch[1];
        splay(pre, 0);
        t[pre].ch[1] = t[cur].ch[1];
        t[t[cur].ch[1]].fa = pre;
        pushup(pre);
    }
}
\`\`\`

### 4. Treap代码实现（简化版）

\`\`\`cpp
struct Node {
    int ch[2];
    int val, pri; // 值和随机优先级
    int size;
} t[MAXN];

int root, nodeCnt;

// 旋转
void rotate(int &x, int k) {
    int y = t[x].ch[k];
    t[x].ch[k] = t[y].ch[k ^ 1];
    t[y].ch[k ^ 1] = x;
    x = y;
}

// 插入
void insert(int &x, int val) {
    if (!x) {
        x = ++nodeCnt;
        t[x].val = val;
        t[x].pri = rand();
        t[x].size = 1;
        return;
    }
    t[x].size++;
    if (val < t[x].val) {
        insert(t[x].ch[0], val);
        if (t[t[x].ch[0]].pri > t[x].pri) rotate(x, 0);
    } else {
        insert(t[x].ch[1], val);
        if (t[t[x].ch[1]].pri > t[x].pri) rotate(x, 1);
    }
}
\`\`\`

    problemDesc: `## 🔗 7.13 树链剖分

### 这是什么问题？

想象你是一个快递公司的调度员，需要管理一棵树形物流网络🚚：
- 节点是城市，边是道路
- **修改操作**：给从城市u到城市v路径上的所有城市增加物资
- **查询操作**：查询从城市u到城市v路径上的总物资

如果用朴素方法，每次操作都要遍历整条路径，O(n)太慢！

**树链剖分**就是为了解决这个问题！它把树"切割"成若干条"重链"，然后用线段树维护，让路径操作变成O(log² n)！

> 🎯 比喻：树链剖分就像把一棵大树"切成几段木头"，每段木头用线段树快速处理！

核心思想：**重链剖分**，让每条路径被分成O(log n)段重链，每段用线段树O(log n)处理，总O(log² n)！`,

    idea: `## 💡 算法思想

### 一、树的问题：路径操作太难了 🌲

**问题**：给定一棵树，支持：
1. 路径修改：给u到v路径上的所有点加值
2. 路径查询：查询u到v路径上的和
3. 子树修改：给u的子树所有点加值
4. 子树查询：查询u的子树的和

**难点**：树不是线性的，不能直接用线段树！

### 二、树链剖分的核心思想 🔪

**关键观察**：如果我们能把树"拉直"成一条线，就能用线段树了！

**树链剖分**的做法：
1. **定义重儿子**：每个节点的儿子中，子树最大的那个是"重儿子"
2. **定义重边**：连接节点和重儿子的边是"重边"
3. **定义重链**：由重边连成的链是"重链"

> 🧠 比喻：就像把一棵树"梳理"成几条"辫子"，每条辫子是连续的！

**性质**：
- 每个节点属于且仅属于一条重链
- 从根到任意节点的路径，最多经过O(log n)条重链

### 三、DFS序：把树拉直 📏

**第一次DFS**：计算每个节点的：
- **深度（depth）**：到根的距离
- **子树大小（size）**：后代数量
- **重儿子（heavy_son）**：子树最大的儿子
- **父节点（fa）**：直接上级

**第二次DFS**：给节点重新编号，让同一条重链的编号连续！
- 优先访问重儿子，让重链的编号连续
- 记录每个节点的**DFS序（dfn）**和**子树的DFS序范围**

**结果**：
- 重链在DFS序上是连续的区间
- 子树在DFS序上也是连续的区间

### 四、用线段树维护 🌳

把DFS序映射到线段树上：
- 路径操作：把路径分成O(log n)段重链，每段对应线段树的一个区间
- 子树操作：子树的DFS序是连续区间，直接在线段树上操作

**时间复杂度**：
- 路径操作：O(log² n)（O(log n)段 × O(log n)线段树）
- 子树操作：O(log n)（一个区间）`,

    derivation: `## 树链剖分的推导与实现

### 1. 重链剖分的性质

**定理**：从根到任意节点的路径，最多经过O(log n)条重链。

**证明**：
- 每经过一条轻边，子树大小至少翻倍
- 因为如果u是v的轻儿子，size(u) ≤ size(v)/2
- 所以从轻边跳O(log n)次，子树大小就超过n了
- 因此路径上最多有O(log n)条轻边，也就最多O(log n)条重链 ✓

### 2. 第一次DFS：计算基本信息

\`\`\`cpp
int fa[MAXN], depth[MAXN], size[MAXN], heavy_son[MAXN];

void dfs1(int u, int f, int dep) {
    fa[u] = f;
    depth[u] = dep;
    size[u] = 1;
    heavy_son[u] = 0;
    int maxSubSize = 0;
    
    for (int v : adj[u]) {
        if (v == f) continue;
        dfs1(v, u, dep + 1);
        size[u] += size[v];
        if (size[v] > maxSubSize) {
            maxSubSize = size[v];
            heavy_son[u] = v;
        }
    }
}
\`\`\`

### 3. 第二次DFS：生成DFS序

\`\`\`cpp
int dfn[MAXN], top[MAXN], curDfn;

void dfs2(int u, int t) {
    dfn[u] = ++curDfn;
    top[u] = t; // 所在重链的顶端
    
    if (heavy_son[u]) {
        // 优先访问重儿子，让重链连续
        dfs2(heavy_son[u], t);
    }
    
    for (int v : adj[u]) {
        if (v == fa[u] || v == heavy_son[u]) continue;
        dfs2(v, v); // 轻儿子开启新的重链
    }
}
\`\`\`

### 4. 线段树维护

\`\`\`cpp
long long tree[MAXN * 4], lazy[MAXN * 4];
int a[MAXN]; // 原数组（按DFS序重排）

void build(int node, int l, int r) {
    if (l == r) {
        tree[node] = a[l];
        return;
    }
    int mid = (l + r) / 2;
    build(node * 2, l, mid);
    build(node * 2 + 1, mid + 1, r);
    tree[node] = tree[node * 2] + tree[node * 2 + 1];
}

void pushdown(int node, int l, int r) {
    if (lazy[node]) {
        int mid = (l + r) / 2;
        lazy[node * 2] += lazy[node];
        lazy[node * 2 + 1] += lazy[node];
        tree[node * 2] += lazy[node] * (mid - l + 1);
        tree[node * 2 + 1] += lazy[node] * (r - mid);
        lazy[node] = 0;
    }
}

void update(int node, int l, int r, int ql, int qr, long long val) {
    if (ql <= l && r <= qr) {
        tree[node] += val * (r - l + 1);
        lazy[node] += val;
        return;
    }
    pushdown(node, l, r);
    int mid = (l + r) / 2;
    if (ql <= mid) update(node * 2, l, mid, ql, qr, val);
    if (qr > mid) update(node * 2 + 1, mid + 1, r, ql, qr, val);
    tree[node] = tree[node * 2] + tree[node * 2 + 1];
}

long long query(int node, int l, int r, int ql, int qr) {
    if (ql <= l && r <= qr) return tree[node];
    pushdown(node, l, r);
    int mid = (l + r) / 2;
    long long ans = 0;
    if (ql <= mid) ans += query(node * 2, l, mid, ql, qr);
    if (qr > mid) ans += query(node * 2 + 1, mid + 1, r, ql, qr);
    return ans;
}
\`\`\`

### 5. 路径操作

\`\`\`cpp
// 路径修改：给u到v路径上的所有点加val
void pathUpdate(int u, int v, long long val) {
    while (top[u] != top[v]) {
        // 让u和v跳到同一条重链
        if (depth[top[u]] < depth[top[v]]) swap(u, v);
        // u所在重链更深，先处理u到top[u]这段
        update(1, 1, n, dfn[top[u]], dfn[u], val);
        u = fa[top[u]]; // 跳到重链上方的父节点
    }
    // 现在u和v在同一条重链上
    if (depth[u] > depth[v]) swap(u, v);
    update(1, 1, n, dfn[u], dfn[v], val);
}

// 路径查询：查询u到v路径上的和
long long pathQuery(int u, int v) {
    long long ans = 0;
    while (top[u] != top[v]) {
        if (depth[top[u]] < depth[top[v]]) swap(u, v);
        ans += query(1, 1, n, dfn[top[u]], dfn[u]);
        u = fa[top[u]];
    }
    if (depth[u] > depth[v]) swap(u, v);
    ans += query(1, 1, n, dfn[u], dfn[v]);
    return ans;
}
\`\`\`

### 6. 子树操作

\`\`\`cpp
// 子树修改：给u的子树所有点加val
void subtreeUpdate(int u, long long val) {
    update(1, 1, n, dfn[u], dfn[u] + size[u] - 1, val);
}

// 子树查询：查询u的子树的和
long long subtreeQuery(int u) {
    return query(1, 1, n, dfn[u], dfn[u] + size[u] - 1);
}

| 操作 | 时间复杂度 | 说明 |
|------|-----------|------|
| 预处理 | O(n) | 两次DFS |
| 路径修改 | O(log² n) | O(log n)段 × O(log n)线段树 |
| 路径查询 | O(log² n) | 同上 |
| 子树修改 | O(log n) | 一个区间 |
| 子树查询 | O(log n) | 一个区间 |

using namespace std;

const int MAXN = 100005;

vector<int> adj[MAXN];
int fa[MAXN], depth[MAXN], size[MAXN], heavy_son[MAXN];
int dfn[MAXN], top[MAXN], curDfn;
int a[MAXN], b[MAXN]; // b是按DFS序重排的数组
int n, m, root;

long long tree[MAXN * 4], lazy[MAXN * 4];

void dfs1(int u, int f, int dep) {
    fa[u] = f;
    depth[u] = dep;
    size[u] = 1;
    heavy_son[u] = 0;
    int maxSubSize = 0;
    
    for (int v : adj[u]) {
        if (v == f) continue;
        dfs1(v, u, dep + 1);
        size[u] += size[v];
        if (size[v] > maxSubSize) {
            maxSubSize = size[v];
            heavy_son[u] = v;
        }
    }
}

void dfs2(int u, int t) {
    dfn[u] = ++curDfn;
    top[u] = t;
    b[curDfn] = a[u];
    
    if (heavy_son[u]) {
        dfs2(heavy_son[u], t);
    }
    
    for (int v : adj[u]) {
        if (v == fa[u] || v == heavy_son[u]) continue;
        dfs2(v, v);
    }
}

void build(int node, int l, int r) {
    if (l == r) {
        tree[node] = b[l];
        return;
    }
    int mid = (l + r) / 2;
    build(node * 2, l, mid);
    build(node * 2 + 1, mid + 1, r);
    tree[node] = tree[node * 2] + tree[node * 2 + 1];
}

void pushdown(int node, int l, int r) {
    if (lazy[node]) {
        int mid = (l + r) / 2;
        lazy[node * 2] += lazy[node];
        lazy[node * 2 + 1] += lazy[node];
        tree[node * 2] += lazy[node] * (mid - l + 1);
        tree[node * 2 + 1] += lazy[node] * (r - mid);
        lazy[node] = 0;
    }
}

void update(int node, int l, int r, int ql, int qr, long long val) {
    if (ql <= l && r <= qr) {
        tree[node] += val * (r - l + 1);
        lazy[node] += val;
        return;
    }
    pushdown(node, l, r);
    int mid = (l + r) / 2;
    if (ql <= mid) update(node * 2, l, mid, ql, qr, val);
    if (qr > mid) update(node * 2 + 1, mid + 1, r, ql, qr, val);
    tree[node] = tree[node * 2] + tree[node * 2 + 1];
}

long long query(int node, int l, int r, int ql, int qr) {
    if (ql <= l && r <= qr) return tree[node];
    pushdown(node, l, r);
    int mid = (l + r) / 2;
    long long ans = 0;
    if (ql <= mid) ans += query(node * 2, l, mid, ql, qr);
    if (qr > mid) ans += query(node * 2 + 1, mid + 1, r, ql, qr);
    return ans;
}

void pathUpdate(int u, int v, long long val) {
    while (top[u] != top[v]) {
        if (depth[top[u]] < depth[top[v]]) swap(u, v);
        update(1, 1, n, dfn[top[u]], dfn[u], val);
        u = fa[top[u]];
    }
    if (depth[u] > depth[v]) swap(u, v);
    update(1, 1, n, dfn[u], dfn[v], val);
}

long long pathQuery(int u, int v) {
    long long ans = 0;
    while (top[u] != top[v]) {
        if (depth[top[u]] < depth[top[v]]) swap(u, v);
        ans += query(1, 1, n, dfn[top[u]], dfn[u]);
        u = fa[top[u]];
    }
    if (depth[u] > depth[v]) swap(u, v);
    ans += query(1, 1, n, dfn[u], dfn[v]);
    return ans;
}

void subtreeUpdate(int u, long long val) {
    update(1, 1, n, dfn[u], dfn[u] + size[u] - 1, val);
}

long long subtreeQuery(int u) {
    return query(1, 1, n, dfn[u], dfn[u] + size[u] - 1);
}

int main() {
    cin >> n >> m >> root;
    for (int i = 1; i <= n; i++) cin >> a[i];
    
    for (int i = 1; i < n; i++) {
        int u, v;
        cin >> u >> v;
        adj[u].push_back(v);
        adj[v].push_back(u);
    }
    
    dfs1(root, 0, 1);
    dfs2(root, root);
    build(1, 1, n);
    
    for (int i = 1; i <= m; i++) {
        int op, u, v;
        long long val;

        if (op == 1) { // 路径修改

}`

    problemDesc: `## 🌳🌳 7.14 树套树

### 这是什么问题？

想象你是一个游戏设计师，需要管理一个二维的游戏世界🎮：
- 地图上有很多怪物，每个怪物有坐标(x,y)和战斗力
- **修改操作**：在坐标(x,y)生成一个战斗力为v的怪物
- **查询操作**：查询矩形区域[x1,x2]×[y1,y2]内战斗力最强的怪物

如果用一个二维数组，空间O(n²)太大；如果遍历所有怪物，时间O(n)太慢！

**树套树**就是为了解决这个问题！它用"外层树+内层树"的结构，让二维操作变成O(log² n)！

> 🎯 比喻：树套树就像"俄罗斯套娃"，外层线段树管x坐标，每个节点里套一个线段树管y坐标！

常见形式：
- **线段树套线段树**：二维区间查询
- **线段树套平衡树**：二维区间第k大
- **树状数组套线段树**：空间优化版`,

    idea: `## 💡 算法思想

### 一、二维问题的挑战 📐

**问题**：给定平面上的点，支持：
1. 插入点(x, y, v)
2. 查询矩形[x1,x2]×[y1,y2]内的信息（最值/和/第k大等）

**难点**：二维空间太大，不能直接开数组！

### 二、树套树的核心思想 🎯

**关键观察**：把二维问题分解成两个一维问题！

**树套树的做法**：
1. **外层树**：对第一维（x坐标）建线段树
2. **内层树**：外层树的每个节点里，套一棵对第二维（y坐标）的线段树

> 🧠 比喻：就像"班级里的学习小组"！外层线段树是班级，每个班级节点里套一个内层线段树（学习小组），小组按y坐标管理！

**查询过程**：
1. 在外层树上找到x范围[x1,x2]对应的O(log n)个节点
2. 对这O(log n)个节点，分别在它们的内层树上查询y范围[y1,y2]
3. 合并结果

### 三、常见树套树类型 🌲

**1. 线段树套线段树**
- 外层：x坐标的线段树
- 内层：y坐标的线段树
- 空间：O(n log n)（动态开点）
- 查询：O(log² n)

**2. 线段树套平衡树**
- 外层：x坐标的线段树
- 内层：y坐标的平衡树（如Splay）
- 优势：支持查询区间第k大
- 查询：O(log² n)

**3. 树状数组套线段树**
- 外层：x坐标的树状数组
- 内层：y坐标的动态开点线段树
- 优势：空间更优，常数更小
- 查询：O(log² n)

### 四、动态开点技术 💡

**问题**：如果内层线段树都开满，空间O(n²)爆炸！

**解决**：动态开点——只开用到的节点！
- 每个内层线段树初始为空
- 插入时才创建需要的节点
- 用数组模拟指针，避免new的开销

**空间分析**：
- 每次插入在外层树上经过O(log n)个节点
- 每个节点的内层树新建O(log n)个节点
- 总空间：O(n log² n) 或优化到 O(n log n)`,

    derivation: `## 树套树的推导与实现

### 1. 线段树套平衡树实现二维第k大

**问题**：给定二维平面上的点，查询矩形区域内第k大的值。

**思路**：
1. 外层线段树维护x范围
2. 每个节点的平衡树维护该x范围内的y值集合
3. 查询时，在外层找到O(log n)个节点，在每个平衡树上二分

### 2. 代码实现

\`\`\`cpp
// 外层线段树节点
struct SegNode {
    int root; // 内层平衡树的根
} seg[MAXN * 4];

// 内层Splay节点
struct SplayNode {
    int ch[2], fa;
    int val, cnt, size;
} splay[MAXN * 40];

int splayCnt;

// Splay操作（同7.12）
void splay_rotate(int x) { /* ... */ }
void splay_splay(int x, int goal) { /* ... */ }

// 内层平衡树插入
void splay_insert(int &root, int val) {
    int cur = root, p = 0;
    while (cur && splay[cur].val != val) {
        p = cur;
        cur = splay[cur].ch[val > splay[cur].val];
    }
    if (cur) {
        splay[cur].cnt++;
    } else {
        cur = ++splayCnt;
        splay[cur].val = val;
        splay[cur].cnt = splay[cur].size = 1;
        splay[cur].fa = p;
        if (p) splay[p].ch[val > splay[p].val] = cur;
    }
    splay_splay(cur, 0);
    root = cur;
}

// 外层线段树插入
void insert(int node, int l, int r, int x, int y) {
    splay_insert(seg[node].root, y);
    if (l == r) return;
    int mid = (l + r) / 2;
    if (x <= mid) insert(node * 2, l, mid, x, y);
    else insert(node * 2 + 1, mid + 1, r, x, y);
}

// 查询外层区间[ql,qr]内，y值在[y1,y2]的元素个数
int countInRange(int node, int l, int r, int ql, int qr, int y1, int y2) {
    if (ql <= l && r <= qr) {
        // 在内层平衡树上查询[y1,y2]的个数
        return queryRange(seg[node].root, y1, y2);
    }
    int mid = (l + r) / 2;
    int ans = 0;
    if (ql <= mid) ans += countInRange(node * 2, l, mid, ql, qr, y1, y2);
    if (qr > mid) ans += countInRange(node * 2 + 1, mid + 1, r, ql, qr, y1, y2);
    return ans;
}

// 查询矩形内第k大
int queryKth(int ql, int qr, int y1, int y2, int k) {
    // 二分答案
    int left = 1, right = MAXY, ans = -1;
    while (left <= right) {
        int mid = (left + right) / 2;
        // 查询值在[mid, MAXY]范围内的个数
        int cnt = countInRange(1, 1, MAXX, ql, qr, mid, y2);
        if (cnt >= k) {
            ans = mid;
            left = mid + 1;
        } else {
            right = mid - 1;
        }
    }
    return ans;
}
\`\`\`

### 3. 树状数组套动态开点线段树

**优势**：空间更优，常数更小。

\`\`\`cpp
// 内层动态开点线段树
struct InnerNode {
    int ls, rs;
    int sum;
} inner[MAXN * 40];

int innerCnt;
int innerRoot[MAXN]; // 树状数组的每个位置对应一个内层树根

// 内层线段树插入
void innerInsert(int &root, int l, int r, int pos, int val) {
    if (!root) root = ++innerCnt;
    inner[root].sum += val;
    if (l == r) return;
    int mid = (l + r) / 2;
    if (pos <= mid) innerInsert(inner[root].ls, l, mid, pos, val);
    else innerInsert(inner[root].rs, mid + 1, r, pos, val);
}

// 树状数组更新
void bitUpdate(int x, int y, int val) {
    for (; x <= MAXX; x += x & -x) {
        innerInsert(innerRoot[x], 1, MAXY, y, val);
    }
}

// 内层线段树查询
int innerQuery(int root, int l, int r, int ql, int qr) {
    if (!root) return 0;
    if (ql <= l && r <= qr) return inner[root].sum;
    int mid = (l + r) / 2;
    int ans = 0;
    if (ql <= mid) ans += innerQuery(inner[root].ls, l, mid, ql, qr);
    if (qr > mid) ans += innerQuery(inner[root].rs, mid + 1, r, ql, qr);
    return ans;
}

// 树状数组查询
int bitQuery(int x, int y1, int y2) {
    int ans = 0;
    for (; x > 0; x -= x & -x) {
        ans += innerQuery(innerRoot[x], 1, MAXY, y1, y2);
    }
    return ans;
}

// 二维区间查询
int query2D(int x1, int x2, int y1, int y2) {
    return bitQuery(x2, y1, y2) - bitQuery(x1 - 1, y1, y2);
}

  'ch7_15_intro': {
    problemDesc: `## 🔗🌳 7.15 动态树（LCT）

### 这是什么问题？

想象你是一个网络管理员，需要管理一个动态变化的网络拓扑🌐：
- 节点之间可以**连边**或**断边**
- 需要查询两个节点是否**连通**
- 需要查询连通块内的**信息**（如节点数、权值和等）
- 需要**修改**节点或边的权值

如果用并查集，只能处理加边不能处理断边；如果用树链剖分，树的结构不能改变！

**动态树（Link-Cut Tree，LCT）**就是为了解决这个问题！它支持：
- **Link(u, v)**：连接u和v
- **Cut(u, v)**：断开u和v之间的边
- **Query(u, v)**：查询u到v路径上的信息
- **ChangeRoot(u)**：把u变成所在树的根

> 🎯 比喻：LCT就像"会变形的树"，可以随意连接、断开、翻转！

LCT是"树上的瑞士军刀"，能解决各种动态树问题！`,

    idea: `## 💡 算法思想

### 一、动态树的挑战 🌲

**问题**：维护一个森林，支持：
1. 加边（Link）
2. 断边（Cut）
3. 路径查询
4. 换根

**难点**：树的结构在动态变化！

### 二、LCT的核心思想 🔗

**关键观察**：用**Splay**维护树的"偏好路径"！

**LCT的概念**：
1. **Preferred Child（偏好儿子）**：每个节点有一个"偏好儿子"
2. **Preferred Edge（偏好边）**：连接节点和偏好儿子的边
3. **Preferred Path（偏好路径）**：由偏好边连成的路径

> 🧠 比喻：就像"高速公路"！LCT把树分成若干条"高速公路"（偏好路径），每条高速公路用一棵Splay维护！

**LCT的操作**：
1. **Access(u)**：把u到根的路径变成一条偏好路径
2. **MakeRoot(u)**：把u变成所在树的根
3. **Link(u, v)**：连接u和v
4. **Cut(u, v)**：断开u和v
5. **FindRoot(u)**：找到u所在树的根

### 三、Splay维护偏好路径 🎯

**结构**：
- 每条偏好路径用一棵Splay维护
- Splay按**深度**排序（中序遍历是深度递增）
- 不同偏好路径之间用**虚边**连接（记录父节点）

**关键操作**：
- **Access(u)**：从u到根，把经过的路径都变成偏好路径
  - 从u开始，跳到当前偏好路径的顶端
  - 把顶端通过虚边连到上一条偏好路径
  - 重复直到到达整棵树的根
  
- **MakeRoot(u)**：
  - 先Access(u)，让u到根成为一条偏好路径
  - 然后Splay(u)，让u成为Splay的根
  - 翻转u的左子树（因为u要变成根，深度关系要反转）

### 四、LCT的应用 🚀

1. **维护连通性**：FindRoot判断是否连通
2. **路径查询**：Access后在Splay上查询
3. **树链剖分的动态版**：支持加边断边的路径操作
4. **维护生成树**：如最小生成树的动态维护`,

### 1. LCT的节点结构

\`\`\`cpp
struct Node {
    int ch[2]; // Splay的左右儿子
    int fa;    // 父节点（可能是Splay内的，也可能是虚边）
    int val;   // 节点权值
    int sum;   // 子树信息（Splay内的）
    bool rev;  // 翻转标记
} t[MAXN];
\`\`\`

### 2. 基础操作

\`\`\`cpp
// 判断节点类型
bool isRoot(int x) {
    return t[t[x].fa].ch[0] != x && t[t[x].fa].ch[1] != x;
}

// 翻转操作
void pushRev(int x) {
    if (x) {
        swap(t[x].ch[0], t[x].ch[1]);
        t[x].rev ^= 1;
    }
}

// 下传标记
void pushDown(int x) {
    if (t[x].rev) {
        pushRev(t[x].ch[0]);
        pushRev(t[x].ch[1]);
        t[x].rev = 0;
    }
}

// 更新信息
void pushUp(int x) {
    t[x].sum = t[t[x].ch[0]].sum ^ t[t[x].ch[1]].sum ^ t[x].val;
}

// 旋转
void rotate(int x) {
    int y = t[x].fa, z = t[y].fa;
    int k = (t[y].ch[1] == x);
    
    if (!isRoot(y)) {
        t[z].ch[t[z].ch[1] == y] = x;
    }
    t[x].fa = z;
    
    t[y].ch[k] = t[x].ch[k ^ 1];
    if (t[x].ch[k ^ 1]) t[t[x].ch[k ^ 1]].fa = y;
    
    t[x].ch[k ^ 1] = y;
    t[y].fa = x;
    
    pushUp(y);
    pushUp(x);
}

// Splay操作：把x旋转到Splay的根
void splay(int x) {
    int top = 0;
    static int stk[MAXN];
    stk[++top] = x;
    
    // 找到Splay的根，收集路径
    for (int i = x; !isRoot(i); i = t[i].fa) {
        stk[++top] = t[i].fa;
    }
    
    // 从上到下下传标记
    while (top) pushDown(stk[top--]);
    
    // 旋转
    while (!isRoot(x)) {
        int y = t[x].fa, z = t[y].fa;
        if (!isRoot(y)) {
            if ((t[y].ch[0] == x) ^ (t[z].ch[0] == y)) rotate(x);
            else rotate(y);
        }
        rotate(x);
    }
}
\`\`\`

### 3. LCT核心操作

\`\`\`cpp
// Access(u)：把u到根的路径变成偏好路径
void access(int x) {
    for (int y = 0; x; y = x, x = t[x].fa) {
        splay(x);
        t[x].ch[1] = y;
        pushUp(x);
    }
}

// MakeRoot(u)：把u变成所在树的根
void makeRoot(int x) {
    access(x);
    splay(x);
    pushRev(x);
}

// FindRoot(u)：找到u所在树的根
int findRoot(int x) {
    access(x);
    splay(x);
    while (t[x].ch[0]) {
        pushDown(x);
        x = t[x].ch[0];
    }
    splay(x);
    return x;
}

// Link(u, v)：连接u和v
void link(int x, int y) {
    makeRoot(x);
    if (findRoot(y) != x) {
        t[x].fa = y;
    }
}

// Cut(u, v)：断开u和v之间的边
void cut(int x, int y) {
    makeRoot(x);
    if (findRoot(y) == x && t[y].fa == x && !t[y].ch[0]) {
        t[y].fa = 0;
        t[x].ch[1] = 0;
        pushUp(x);
    }
}

// 路径查询：查询u到v路径上的异或和
int queryPath(int x, int y) {
    makeRoot(x);
    access(y);
    splay(y);
    return t[y].sum;
}
\`\`\`

### 4. 时间复杂度分析

**均摊分析**：
- Access操作：均摊O(log n)
- MakeRoot、FindRoot、Link、Cut：均摊O(log n)
- 路径查询：均摊O(log n)

**关键洞察**：虽然单次操作可能O(n)，但均摊下来是O(log n)！

### 5. LCT的应用示例

**问题**：动态维护森林，支持加边、断边、查询连通性。

\`\`\`cpp
int main() {
    int n, m;
    cin >> n >> m;
    
    for (int i = 1; i <= n; i++) {
        cin >> t[i].val;
        t[i].sum = t[i].val;
    }
    
    for (int i = 1; i <= m; i++) {
        int op, x, y;
        cin >> op >> x >> y;
        if (op == 1) { // 加边
            link(x, y);
        } else if (op == 2) { // 断边
            cut(x, y);
        } else if (op == 3) { // 查询连通性
            if (findRoot(x) == findRoot(y)) cout << "Yes\\n";
            else cout << "No\\n";
        } else if (op == 4) { // 路径查询
            cout << queryPath(x, y) << "\\n";
        }
    }
    
    return 0;
}
\`\`\`

### 这是什么问题？

想象你是一个游戏开发者，需要实现一个"时光倒流"功能⏰：
- 玩家有一个序列，可以进行各种操作（修改、查询）
- 玩家可以**保存当前状态**，继续游戏
- 玩家可以**回到任意一个保存的状态**，重新开始

如果用普通数据结构，每次修改都会覆盖之前的状态，无法"时光倒流"！

**可持久化数据结构**就是为了解决这个问题！它支持：
- **修改**：生成一个新版本
- **查询**：查询任意历史版本
- **保留所有版本**：不破坏旧版本

> 🎯 比喻：可持久化数据结构就像"游戏的存档系统"，可以随时读档！

常见的可持久化数据结构：
- **可持久化数组**：最基础
- **可持久化线段树**（主席树）：7.11已介绍
- **可持久化平衡树**：支持历史版本的有序集合
- **可持久化并查集**：支持历史版本的连通性查询`,

    idea: `## 💡 算法思想

### 一、可持久化的核心挑战 🕰️

**问题**：如何保存数据结构的"所有历史版本"？

**朴素想法**：每次修改都完整复制一份。但这样空间O(n·m)，m是修改次数，爆炸💥！

**优化思路**：
- 每次修改只影响**一部分**节点
- 其他节点可以**共享**！
- 只**新建被修改的节点**，其他指向旧版本

> 🧠 比喻：就像"修改论文"，只重写改动的段落，其他段落复印原来的！

### 二、可持久化的通用方法 🎯

**核心思想**：**路径复制**

1. 找到被修改的路径（从根到叶子）
2. 复制路径上的所有节点
3. 新建节点的子节点：如果没被修改，指向旧版本的节点
4. 生成新版本的新根

**适用条件**：
- 数据结构是**树形**的
- 每次修改只影响**一条路径**或**O(log n)个节点**

### 三、可持久化数组 📝

**问题**：维护一个数组，支持：
1. 修改某个位置
2. 查询某个位置
3. 查询任意历史版本

**实现**：用线段树实现
- 每个版本是一棵线段树
- 修改时复制一条路径
- 空间：O(n + m log n)

### 四、可持久化平衡树 🌳

**问题**：维护一个有序集合，支持：
1. 插入元素
2. 删除元素
3. 查询排名/第k小
4. 查询任意历史版本

**实现**：用Treap或Splay实现
- 每个版本是一棵平衡树
- 修改时复制一条路径
- 空间：O(n + m log n)

### 五、可持久化并查集 🔗

**问题**：维护一个并查集，支持：
1. 合并两个集合
2. 查询连通性
3. 查询任意历史版本

**实现**：用可持久化数组维护父节点和秩
- 每个版本是一个可持久化数组
- 空间：O(n log n + m log² n)`,

### 1. 可持久化数组

\`\`\`cpp
struct Node {
    int ls, rs;
    int val;
} t[MAXN * 40];

int root[MAXN];
int nodeCnt;

// 建树
int build(int l, int r) {
    int p = ++nodeCnt;
    if (l == r) {
        t[p].val = a[l];
        return p;
    }
    int mid = (l + r) / 2;
    t[p].ls = build(l, mid);
    t[p].rs = build(mid + 1, r);
    return p;
}

// 修改：在版本pre的基础上，把位置pos改成val
int modify(int pre, int l, int r, int pos, int val) {
    int p = ++nodeCnt;
    t[p] = t[pre]; // 复制节点
    
    if (l == r) {
        t[p].val = val;
        return p;
    }
    
    int mid = (l + r) / 2;
    if (pos <= mid)
        t[p].ls = modify(t[pre].ls, l, mid, pos, val);
    else
        t[p].rs = modify(t[pre].rs, mid + 1, r, pos, val);
    
    return p;
}

// 查询：查询版本root中位置pos的值
int query(int root, int l, int r, int pos) {
    if (l == r) return t[root].val;
    
    int mid = (l + r) / 2;
    if (pos <= mid) return query(t[root].ls, l, mid, pos);
    else return query(t[root].rs, mid + 1, r, pos);
}
\`\`\`

### 2. 可持久化并查集

\`\`\`cpp
// 用可持久化数组维护fa和rank
int faRoot[MAXN], rankRoot[MAXN];

// 查询版本v中x的父节点
int findFa(int v, int x) {
    return query(faRoot[v], 1, n, x);
}

// 查询版本v中x的秩
int findRank(int v, int x) {
    return query(rankRoot[v], 1, n, x);
}

// 查询版本v中x的根（路径压缩）
int find(int v, int x) {
    int fx = findFa(v, x);
    if (fx == x) return x;
    return find(v, fx);
}

// 合并：在版本v的基础上，合并x和y
int merge(int v, int x, int y) {
    int fx = find(v, x);
    int fy = find(v, y);
    
    if (fx == fy) {
        // 没有变化，新版本和旧版本一样
        faRoot[v + 1] = faRoot[v];
        rankRoot[v + 1] = rankRoot[v];
        return;
    }
    
    int rankX = findRank(v, fx);
    int rankY = findRank(v, fy);
    
    if (rankX < rankY) swap(fx, fy);
    
    // 把fy的父节点改成fx
    faRoot[v + 1] = modify(faRoot[v], 1, n, fy, fx);
    rankRoot[v + 1] = rankRoot[v];
    
    if (rankX == rankY) {
        // fx的秩加1
        rankRoot[v + 1] = modify(rankRoot[v + 1], 1, n, fx, rankX + 1);
    }
}

### 3. 可持久化Treap（简化版）

\`\`\`cpp
struct Node {
    int ls, rs;
    int val, pri;
    int size;
} t[MAXN * 40];

int root[MAXN];
int nodeCnt;

// 复制节点
int copyNode(int x) {
    int p = ++nodeCnt;
    t[p] = t[x];
    return p;
}

// 旋转（需要复制节点）
void rotate(int &x, int k) {
    int y = copyNode(t[x].ch[k]);
    t[x].ch[k] = t[y].ch[k ^ 1];
    t[y].ch[k ^ 1] = x;
    x = y;
}

// 插入（生成新版本）
void insert(int pre, int &cur, int val) {
    if (!cur) {
        cur = ++nodeCnt;
        t[cur].val = val;
        t[cur].pri = rand();
        t[cur].size = 1;
        return;
    }
    
    cur = copyNode(pre); // 复制当前节点
    t[cur].size++;
    
    if (val < t[cur].val) {
        insert(t[pre].ls, t[cur].ls, val);
        if (t[t[cur].ls].pri > t[cur].pri) rotate(cur, 0);
    } else {
        insert(t[pre].rs, t[cur].rs, val);
        if (t[t[cur].rs].pri > t[cur].pri) rotate(cur, 1);
    }
}

// 生成新版本
void insertVersion(int v, int val) {
    root[v + 1] = root[v];
    insert(root[v], root[v + 1], val);
}

| 数据结构 | 初始空间 | 每次修改空间 |
|---------|---------|------------|
| 可持久化数组 | O(n) | O(log n) |
| 可持久化线段树 | O(n) | O(log n) |
| 可持久化平衡树 | O(n) | O(log n) |
| 可持久化并查集 | O(n log n) | O(log² n) |

### 这是什么问题？

想象你是一个游戏设计师，需要在一个二维地图上做操作🗺️：
- 地图上有许多NPC，每个NPC有坐标(x,y)
- **查询操作**：找到距离某个点最近的NPC
- **范围查询**：找到矩形区域内的所有NPC

如果用暴力方法，每次查询都要遍历所有NPC，O(n)太慢！

**K-D Tree**就是为了解决这个问题！它是一种**多维空间的数据结构**，能把最近邻查询优化到O(√n)甚至更快！

> 🎯 比喻：K-D Tree就像"空间的二分法"，每次把空间切成两半，快速定位目标区域！

K-D Tree的应用：
- **最近邻查询**：找到离查询点最近的点
- **范围查询**：找到矩形/圆形区域内的点
- **K近邻查询**：找到离查询点最近的k个点`,

    idea: `## 💡 算法思想

### 一、多维空间的挑战 📐

**问题**：给定n个k维空间中的点，支持：
1. 最近邻查询：找到离查询点最近的点
2. 范围查询：找到某个区域内的所有点

**难点**：多维空间不能直接排序！

### 二、K-D Tree的核心思想 🔪

**关键观察**：每次选择一个维度，把空间切成两半！

**K-D Tree的构建**：
1. 选择一个维度（轮流选择或选择方差最大的）
2. 找到该维度的中位数
3. 用中位数把空间切成两半
4. 递归构建左右子树

> 🧠 比喻：就像"切蛋糕"！每次选择一个方向切一刀，把空间分成两半！

**性质**：
- 每个节点代表一个点
- 左子树的所有点在当前维度上 ≤ 当前节点
- 右子树的所有点在当前维度上 ≥ 当前节点
- 树的高度：O(log n)（如果数据分布均匀）

### 三、最近邻查询 🎯

**查询过程**：
1. 从根节点开始，像BST一样往下走
2. 维护"当前最近点"和"当前最近距离"
3. 回溯时，检查另一子树是否可能有更近的点
4. 如果查询点到分割面的距离 ≥ 当前最近距离，剪枝

**关键优化**：
- **剪枝**：如果不可能有更近的点，不搜索该子树
- **维护子树范围**：每个节点维护子树的bounding box，加速判断

### 四、范围查询 📦

**查询过程**：
1. 从根节点开始
2. 如果当前节点的子树范围完全在查询范围内，全部加入答案
3. 如果当前节点的子树范围完全不在查询范围内，剪枝
4. 否则递归查询左右子树

### 五、K-D Tree的优化 🚀

**1. 替罪树重构**
- 当树不平衡时，暴力重构
- 保持树的平衡，保证查询效率

**2. 维护子树信息**
- 每个节点维护子树的bounding box
- 加速范围查询和最近邻查询

**3. 批量构建**
- 给定n个点，O(n log n)构建K-D Tree
- 每次选择中位数，保证平衡`,

    derivation: `## K-D Tree的推导与实现

### 1. K-D Tree的节点结构

\`\`\`cpp
struct Point {
    int x, y; // 二维坐标
    int id;   // 点的编号
};

struct Node {
    Point p;        // 当前节点代表的点
    int ls, rs;     // 左右儿子
    int minx, maxx; // 子树x范围
    int miny, maxy; // 子树y范围
} t[MAXN];
\`\`\`

### 2. 构建K-D Tree

\`\`\`cpp
// 比较函数：按第d维排序
bool cmpX(const Point &a, const Point &b) { return a.x < b.x; }
bool cmpY(const Point &a, const Point &b) { return a.y < b.y; }

// 维护子树范围
void pushUp(int u) {
    t[u].minx = t[u].maxx = t[u].p.x;
    t[u].miny = t[u].maxy = t[u].p.y;
    
    if (t[u].ls) {
        t[u].minx = min(t[u].minx, t[t[u].ls].minx);
        t[u].maxx = max(t[u].maxx, t[t[u].ls].maxx);
        t[u].miny = min(t[u].miny, t[t[u].ls].miny);
        t[u].maxy = max(t[u].maxy, t[t[u].ls].maxy);
    }
    if (t[u].rs) {
        t[u].minx = min(t[u].minx, t[t[u].rs].minx);
        t[u].maxx = max(t[u].maxx, t[t[u].rs].maxx);
        t[u].miny = min(t[u].miny, t[t[u].rs].miny);
        t[u].maxy = max(t[u].maxy, t[t[u].rs].maxy);
    }
}

// 构建：在点集a[l..r]中构建K-D Tree，当前深度为dep
int build(int l, int r, int dep) {
    if (l > r) return 0;
    
    int mid = (l + r) / 2;
    
    // 选择排序的维度
    if (dep % 2 == 0) {
        nth_element(a + l, a + mid, a + r + 1, cmpX);
    } else {
        nth_element(a + l, a + mid, a + r + 1, cmpY);
    }
    
    int u = mid; // 用mid作为节点编号
    t[u].p = a[mid];
    t[u].ls = build(l, mid - 1, dep + 1);
    t[u].rs = build(mid + 1, r, dep + 1);
    
    pushUp(u);
    return u;
}
\`\`\`

### 3. 最近邻查询

\`\`\`cpp
// 计算两点距离的平方
long long dist(const Point &a, const Point &b) {
    return (long long)(a.x - b.x) * (a.x - b.x) + 
           (long long)(a.y - b.y) * (a.y - b.y);
}

// 查询点到子树u的最小可能距离
long long minDist(int u, const Point &p) {
    long long dx = 0, dy = 0;
    if (p.x < t[u].minx) dx = t[u].minx - p.x;
    else if (p.x > t[u].maxx) dx = p.x - t[u].maxx;
    if (p.y < t[u].miny) dy = t[u].miny - p.y;
    else if (p.y > t[u].maxy) dy = p.y - t[u].maxy;
    return dx * dx + dy * dy;
}

long long ans; // 当前最近距离
int ansId;     // 当前最近点的编号

// 查询最近邻
void query(int u, const Point &p) {
    if (!u) return;
    
    // 更新答案
    if (t[u].p.id != p.id) { // 不查询自己
        long long d = dist(t[u].p, p);
        if (d < ans) {
            ans = d;
            ansId = t[u].p.id;
        }
    }
    
    // 计算到左右子树的最小可能距离
    long long dl = t[u].ls ? minDist(t[u].ls, p) : LLONG_MAX;
    long long dr = t[u].rs ? minDist(t[u].rs, p) : LLONG_MAX;
    
    // 优先搜索更有可能的子树
    if (dl < dr) {
        if (dl < ans) query(t[u].ls, p);
        if (dr < ans) query(t[u].rs, p);
    } else {
        if (dr < ans) query(t[u].rs, p);
        if (dl < ans) query(t[u].ls, p);
    }
}
\`\`\`

### 4. 范围查询

\`\`\`cpp
vector<int> ansList; // 范围内的点

// 判断子树u是否完全在查询矩形内
bool inRect(int u, int x1, int x2, int y1, int y2) {
    return t[u].minx >= x1 && t[u].maxx <= x2 &&
           t[u].miny >= y1 && t[u].maxy <= y2;
}

// 判断子树u是否完全不在查询矩形内
bool outRect(int u, int x1, int x2, int y1, int y2) {
    return t[u].minx > x2 || t[u].maxx < x1 ||
           t[u].miny > y2 || t[u].maxy < y1;
}

// 判断点是否在查询矩形内
bool pointInRect(const Point &p, int x1, int x2, int y1, int y2) {
    return p.x >= x1 && p.x <= x2 && p.y >= y1 && p.y <= y2;
}

// 范围查询
void queryRect(int u, int x1, int x2, int y1, int y2) {
    if (!u) return;
    
    if (inRect(u, x1, x2, y1, y2)) {
        // 子树完全在范围内，全部加入
        collectAll(u);
        return;
    }
    
    if (outRect(u, x1, x2, y1, y2)) {
        // 子树完全不在范围内，剪枝
        return;
    }
    
    // 检查当前点
    if (pointInRect(t[u].p, x1, x2, y1, y2)) {
        ansList.push_back(t[u].p.id);
    }
    
    // 递归查询
    queryRect(t[u].ls, x1, x2, y1, y2);
    queryRect(t[u].rs, x1, x2, y1, y2);
}
\`\`\`

### 5. 时间复杂度总结

| 操作 | 时间复杂度 | 说明 |
|------|-----------|------|
| 构建 | O(n log n) | 每次找中位数 |
| 最近邻查询 | O(√n) 平均 | 最坏O(n) |
| 范围查询 | O(√n + k) | k是答案数量 |
| 插入 | O(log n) 平均 | 最坏O(n) |

K-D Tree是"多维空间的利器"，在计算几何和空间查询中广泛应用！`,
