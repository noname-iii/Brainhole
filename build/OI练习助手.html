    code: `// 回文自动机经典：统计回文子串
// 求字符串中本质不同的回文子串个数
#include <iostream>
#include <string>
#include <cstring>
using namespace std;

const int MAXN = 1000005;

struct Node {
    int len;        // 回文串长度
    int fail;       // 最长回文真后缀
    int next[26];   // 两边加字符后的回文串
    long long cnt;  // 出现次数
} node[MAXN];

int tot;    // 节点总数
int last;   // 上一个节点
char s[MAXN];

// 初始化
void init() {
    node[0].len = 0;
    node[0].fail = 1;
    memset(node[0].next, 0, sizeof(node[0].next));
    node[0].cnt = 0;
    
    node[1].len = -1;
    node[1].fail = 1;
    memset(node[1].next, 0, sizeof(node[1].next));
    node[1].cnt = 0;
    
    tot = 1;
    last = 0;
}

// 添加字符
void add(int i, int c) {
    int p = last;
    
    // 找到可以扩展的位置
    while (s[i - node[p].len - 1] != s[i]) {
        p = node[p].fail;
    }
    
    // 如果新回文串不存在，创建新节点
    if (!node[p].next[c]) {
        tot++;
        node[tot].len = node[p].len + 2;
        memset(node[tot].next, 0, sizeof(node[tot].next));
        node[tot].cnt = 0;
        
        // 找 fail 指针
        int q = node[p].fail;
        while (s[i - node[q].len - 1] != s[i]) {
            q = node[q].fail;
        }
        node[tot].fail = node[q].next[c];
        
        node[p].next[c] = tot;
    }
    
    last = node[p].next[c];
    node[last].cnt++;
}

int main() {
    cin >> (s + 1);
    int n = strlen(s + 1);
    
    init();
    
    for (int i = 1; i <= n; i++) {
        add(i, s[i] - 'a');
    }
    
    // 统计出现次数（从后往前累加）
    for (int i = tot; i >= 2; i--) {
        node[node[i].fail].cnt += node[i].cnt;
    }
    
    // 本质不同的回文子串个数
    cout << "本质不同的回文子串个数: " << tot - 1 << endl;
    
    // 输出每个回文子串的信息
    for (int i = 2; i <= tot; i++) {
        cout << "长度 " << node[i].len 
             << "，出现 " << node[i].cnt << " 次" << endl;
    }
    
    return 0;
}

### 4. 时间复杂度

| 操作 | 时间复杂度 |

    code: `// 后缀数组经典：不同子串个数
// 求字符串的本质不同子串个数
#include <iostream>
#include <string>
#include <algorithm>
using namespace std;

const int MAXN = 1000005;
int sa[MAXN], rk[MAXN], oldrk[MAXN], id[MAXN], cnt[MAXN];
int height[MAXN];
char s[MAXN];
int n, m;

// 构建后缀数组
void buildSA() {
    m = 127;
    
    // 初始排序
    for (int i = 1; i <= n; i++) cnt[rk[i] = s[i]]++;
    for (int i = 1; i <= m; i++) cnt[i] += cnt[i-1];
    for (int i = n; i >= 1; i--) sa[cnt[rk[i]]--] = i;
    
    // 倍增
    for (int w = 1; w < n; w <<= 1) {
        int p = 0;
        for (int i = n; i > n - w; i--) id[++p] = i;
        for (int i = 1; i <= n; i++) {
            if (sa[i] > w) id[++p] = sa[i] - w;
        }
        
        for (int i = 1; i <= m; i++) cnt[i] = 0;
        for (int i = 1; i <= n; i++) cnt[rk[id[i]]]++;
        for (int i = 1; i <= m; i++) cnt[i] += cnt[i-1];
        for (int i = n; i >= 1; i--) sa[cnt[rk[id[i]]]--] = id[i];
        
        for (int i = 1; i <= n; i++) oldrk[i] = rk[i];
        p = 0;
        for (int i = 1; i <= n; i++) {
            rk[sa[i]] = (oldrk[sa[i]] == oldrk[sa[i-1]] && 
                         oldrk[sa[i]+w] == oldrk[sa[i-1]+w]) ? p : ++p;
        }
        if (p == n) break;
        m = p;
    }
}

// 计算height数组
void buildHeight() {
    int k = 0;
    for (int i = 1; i <= n; i++) {
        if (rk[i] == 1) {
            k = 0;
            continue;
        }
        if (k) k--;
        int j = sa[rk[i] - 1];
        while (i + k <= n && j + k <= n && s[i+k] == s[j+k]) k++;
        height[rk[i]] = k;
    }
}

int main() {
    cin >> (s + 1);
    n = strlen(s + 1);
    
    buildSA();
    buildHeight();
    
    // 不同子串个数 = 总子串数 - sum(height)
    long long total = (long long)n * (n + 1) / 2;
    long long sum = 0;
    for (int i = 2; i <= n; i++) {
        sum += height[i];
    }
    
    cout << "本质不同的子串个数: " << total - sum << endl;
    
    return 0;
}

// 求字符串的本质不同子串个数
#include <iostream>
#include <string>
#include <cstring>
using namespace std;

const int MAXN = 2000005;

struct State {
    int len, fa;
    int next[26];
} st[MAXN];

int sz, last;
char s[MAXN];

// 初始化
void init() {
    st[0].len = 0;
    st[0].fa = -1;
    memset(st[0].next, 0, sizeof(st[0].next));
    sz = 1;
    last = 0;
}

// 添加字符
void extend(int c) {
    int cur = sz++;
    st[cur].len = st[last].len + 1;
    memset(st[cur].next, 0, sizeof(st[cur].next));
    
    int p = last;
    while (p != -1 && !st[p].next[c]) {
        st[p].next[c] = cur;
        p = st[p].fa;
    }
    
    if (p == -1) {
        st[cur].fa = 0;
    } else {
        int q = st[p].next[c];
        if (st[q].len == st[p].len + 1) {
            st[cur].fa = q;
        } else {
            int clone = sz++;
            st[clone] = st[q];
            st[clone].len = st[p].len + 1;
            
            while (p != -1 && st[p].next[c] == q) {
                st[p].next[c] = clone;
                p = st[p].fa;
            }
            
            st[q].fa = st[cur].fa = clone;
        }
    }
    
    last = cur;
}

int main() {
    cin >> (s + 1);
    int n = strlen(s + 1);
    
    init();
    for (int i = 1; i <= n; i++) {
        extend(s[i] - 'a');
    }
    
    // 计算不同子串个数
    long long ans = 0;
    for (int i = 1; i < sz; i++) {
        ans += st[i].len - st[st[i].fa].len;
    }
    
    cout << "本质不同的子串个数: " << ans << endl;
    
    return 0;
}

    code: `// 位运算经典：快速幂 + 位运算技巧
#include <iostream>
using namespace std;

// 快速幂：计算 a^b % mod
// 核心思想：把b拆成二进制，不断平方
long long qpow(long long a, long long b, long long mod) {
    long long ans = 1;    // 答案初始为1
    a %= mod;             // 防止a本身就大于mod
    while (b > 0) {
        if (b & 1)        // 检查b的当前最低位是否为1
            ans = ans * a % mod;  // 是1就把当前的a乘进去
        a = a * a % mod;  // a不断平方：a → a² → a⁴ → a⁸...
        b >>= 1;          // b右移一位，看下一位
    }
    return ans;
}

// 判断奇偶：看最后一位即可
bool isOdd(int x) {
    return x & 1;  // 最后一位是1→奇数，是0→偶数
}

// 交换两个数（不用临时变量的魔法）
void swapByXor(int &a, int &b) {
    a ^= b;   // 第一步：a变成a^b
    b ^= a;   // 第二步：b变成b^(a^b)=a，b拿到a的值！
    a ^= b;   // 第三步：a变成(a^b)^a=b，a拿到b的值！
}

// 取出最低位的1（lowbit）
// 例如 x=12(1100)，lowbit=4(0100)
int lowbit(int x) {
    return x & (-x);  // 利用补码的巧妙性质
}

// 枚举{1,2,...,n}的所有子集
void enumerateSubsets(int n) {
    for (int S = 0; S < (1 << n); S++) {
        // S的每一种值就是一个子集的二进制表示
        cout << "子集 ";
        for (int i = 0; i < n; i++) {
            if (S & (1 << i)) {  // 检查第i位是否为1
                cout << i + 1 << " ";
            }
        }
        cout << endl;
    }
}

int main() {
    // 快速幂示例
    cout << "2^10 % 1000 = " << qpow(2, 10, 1000) << endl;  // 24
    
    // 位运算技巧示例
    int x = 10;  // 二进制1010
    cout << "x = " << x << endl;
    cout << "x 是奇数吗？" << (isOdd(x) ? "是" : "否") << endl;  // 否
    cout << "lowbit(x) = " << lowbit(x) << endl;  // 2
    
    // 交换示例
    int a = 5, b = 7;
    cout << "交换前：a=" << a << ", b=" << b << endl;
    swapByXor(a, b);
    cout << "交换后：a=" << a << ", b=" << b << endl;
    
    // 枚举子集示例
    cout << "枚举 {1,2,3} 的所有子集：" << endl;
    enumerateSubsets(3);
    
    return 0;
}

// 💡 位运算的精髓：直接操作二进制，又快又省又神奇！`

### 1. 试除法——为什么只需要试到√n？ 🤔

假设 n 的所有因子都 > √n。
设 n = a × b，其中 a ≤ b。
因为 a > √n 且 b > √n，所以 a × b > √n × √n = n。
但 a × b = n，矛盾！
所以 n 一定有一个 ≤ √n 的因子。

**代码实现：**
\`\`\`
bool isPrime(int n) {
    if (n < 2) return false;           // 0和1不是质数
    for (int i = 2; i * i <= n; i++) { // 只试到√n
        if (n % i == 0) return false;   // 找到因子，不是质数
    }
    return true;                        // 没找到因子，是质数
}
\`\`\`

### 1. 欧几里得算法——为什么辗转相除有效？ 🤔

**定理：** gcd(a, b) = gcd(b, a % b)

**严格证明：**
设 a = k×b + r，其中 r = a % b。

**第一步：** 设 d = gcd(a, b)，则 d|a 且 d|b。
因为 r = a - k×b，所以 d|r = d|(a - k×b)。
因此 d 是 b 和 r 的**公约数**。

**第二步：** 设 d' = gcd(b, r)，则 d'|b 且 d'|r。
因为 a = k×b + r，所以 d'|a = d'|(k×b + r)。
因此 d' 是 a 和 b 的**公约数**。

**结论：** a和b的公约数集合 = b和r的公约数集合。
所以最大公约数也相等：gcd(a, b) = gcd(b, r)。 ✅

### 2. 时间复杂度分析

每次取模后，数值至少减半（因为 a % b < b，且 a % b < a/2 当 a > b 时）。
所以最多 O(log(min(a, b))) 步就结束了。

**举例：** gcd(1000000, 1) 只需要1步！gcd(10^18, 10^18-1) 也只需要几十步。

### 3. 最小公倍数公式

**定理：** lcm(a, b) = a × b / gcd(a, b)

**证明：**
设 d = gcd(a, b)，a = d×m，b = d×n，其中 gcd(m, n) = 1。
则 lcm(a, b) = d×m×n = (d×m)×(d×n)/d = a×b/d。

💡 **代码中先除后乘**：\`a / gcd(a,b) * b\`，防止 a×b 溢出！

### 4. 扩展欧几里得算法

**目标：** 求 x, y 使得 a×x + b×y = gcd(a, b)

**思路：** 递归！
- 当 b=0 时：x=1, y=0（因为 a×1 + 0×0 = a = gcd(a,0)）
- 当 b≠0 时：先递归求 gcd(b, a%b) 的解 (x', y')
  即 b×x' + (a%b)×y' = gcd

  a×y' + b×(x' - (a/b)×y') = gcd

    return d;
}

|------|------------|
| gcd | O(log(min(a,b))) |
| exgcd | O(log(min(a,b))) |

#include <iostream>
using namespace std;

// 欧几里得算法求GCD（辗转相除法）
// 核心：gcd(a, b) = gcd(b, a % b)
int gcd(int a, int b) {
    return b == 0 ? a : gcd(b, a % b);
    // 当b=0时，a就是最大公约数
    // 否则继续辗转相除
}

// 最小公倍数 LCM
// 公式：lcm(a,b) = a / gcd(a,b) * b
int lcm(int a, int b) {
    return a / gcd(a, b) * b;  // ⭐先除后乘，防止溢出！
}

// 扩展欧几里得算法
// 返回 gcd(a,b)，同时求出 x,y 使得 a*x + b*y = gcd(a,b)
int exgcd(int a, int b, int &x, int &y) {
    if (b == 0) {
        // 递归终点：a*1 + 0*0 = a
        x = 1;
        y = 0;
        return a;
    }
    // 递归求解 gcd(b, a%b)
    int d = exgcd(b, a % b, x, y);
    // 回溯时更新 x, y
    int t = x;                // 保存旧x
    x = y;                    // 新x = 旧y
    y = t - (a / b) * y;     // 新y = 旧x - (a/b)*旧y
    return d;
}

// 求模逆元：求 x 使得 a*x ≡ 1 (mod m)
// 原理：ax ≡ 1 (mod m) 等价于 ax + my = 1，用exgcd求解
int modInverse(int a, int m) {
    int x, y;
    int d = exgcd(a, m, x, y);
    if (d != 1) return -1;  // gcd≠1，逆元不存在
    return (x % m + m) % m;  // 保证结果非负
}

int main() {
    // GCD 示例
    cout << "gcd(48, 18) = " << gcd(48, 18) << endl;   // 6
    cout << "gcd(100, 75) = " << gcd(100, 75) << endl;  // 25
    
    // LCM 示例
    cout << "lcm(12, 18) = " << lcm(12, 18) << endl;   // 36
    cout << "lcm(7, 5) = " << lcm(7, 5) << endl;       // 35
    
    // 扩展欧几里得示例
    int x, y;
    int d = exgcd(48, 18, x, y);
    cout << "48x + 18y = " << d << " 的解：x=" << x << ", y=" << y << endl;
    cout << "验证：48×" << x << " + 18×" << y << " = " << 48*x + 18*y << endl;
    
    // 模逆元示例
    int inv = modInverse(3, 11);
    cout << "3 模 11 的逆元 = " << inv << endl;  // 4
    cout << "验证：3 × " << inv << " mod 11 = " << (3 * inv) % 11 << endl;  // 1
    
    return 0;
}

### 1. 定义

φ(n) = 1 到 n 中和 n 互质的数的个数。

### 2. 计算公式

**容斥原理推导：**

设 n = p₁^a₁ × p₂^a₂ × ... × pₖ^aₖ。

1 到 n 中：
- 是 p₁ 倍数的有 n/p₁ 个
- 是 p₂ 倍数的有 n/p₂ 个
- ...
- 同时是 p₁ 和 p₂ 倍数的有 n/(p₁×p₂) 个
- ...

n/p₁ + n/p₂ + ... - n/(p₁p₂) - ... + ...

和 n 互质的数的个数 = n - (上面那个) = 
n × (1 - 1/p₁) × (1 - 1/p₂) × ... × (1 - 1/pₖ)

### 3. 算法实现

    for (int i = 2; i * i <= n; i++) {
        if (n % i == 0) {
            ans = ans / i * (i - 1);  // ans *= (1 - 1/i)
            while (n % i == 0) n /= i;

    if (n > 1) ans = ans / n * (n - 1);

    return ans;
}

// 欧拉筛法求 1 到 n 的欧拉函数 O(n)
vector<int> eulerSieve(int n) {
    vector<int> phi(n + 1);
    vector<int> primes;
    vector<bool> isPrime(n + 1, true);
    
    phi[1] = 1;
    isPrime[0] = isPrime[1] = false;
    
    for (int i = 2; i <= n; i++) {
        if (isPrime[i]) {
            primes.push_back(i);
            phi[i] = i - 1;  // 质数的欧拉函数
        }
        
        for (int p : primes) {
            if ((long long)i * p > n) break;
            isPrime[i * p] = false;
            
            if (i % p == 0) {
                phi[i * p] = phi[i] * p;
                break;
            } else {
                phi[i * p] = phi[i] * (p - 1);
            }
        }
    }
    return phi;
}

// 快速幂
long long qpow(long long a, long long b, long long mod) {
    long long ans = 1;
    a %= mod;
    while (b > 0) {
        if (b & 1) ans = ans * a % mod;
        a = a * a % mod;
        b >>= 1;
    }
    return ans;
}

// 欧拉定理应用：a^b mod m，当 b 很大时
// a^b ≡ a^(b mod φ(m) + φ(m)) (mod m)，当 b >= φ(m)
long long powerMod(long long a, long long b, long long m) {
    if (b < eulerPhi(m)) {
        return qpow(a, b, m);
    } else {
        return qpow(a, b % eulerPhi(m) + eulerPhi(m), m);
    }
}

int main() {
    // 计算单个数的欧拉函数
    cout << "φ(10) = " << eulerPhi(10) << endl;  // 4
    cout << "φ(12) = " << eulerPhi(12) << endl;  // 4
    cout << "φ(7) = " << eulerPhi(7) << endl;    // 6（7是质数）
    
    // 欧拉筛法
    vector<int> phi = eulerSieve(20);
    cout << "1到20的欧拉函数：" << endl;
    for (int i = 1; i <= 20; i++) {
        cout << "φ(" << i << ") = " << phi[i] << "  ";
        if (i % 5 == 0) cout << endl;
    }
    
    // 欧拉定理示例
    // 计算 3^100 mod 7
    // φ(7) = 6，所以 3^100 ≡ 3^(100 mod 6) = 3^4 (mod 7)
    cout << "3^100 mod 7 = " << powerMod(3, 100, 7) << endl;
    
    return 0;
}

// 💡 欧拉函数的精髓：容斥原理，数论的基石！`

#include <set>

// Nim游戏：判断先手是否必胜
bool nimWin(vector<int>& a) {
    int xorSum = 0;
    for (int x : a) xorSum ^= x;
    return xorSum != 0;
}

// 巴什博弈：n个物品，每次拿1到m个
bool bashWin(int n, int m) {
    return n % (m + 1) != 0;
}

// SG函数（记忆化搜索）
vector<int> sg;
vector<vector<int>> nextStates;

int getSG(int state) {
    if (sg[state] != -1) return sg[state];
    
    set<int> s;
    for (int nxt : nextStates[state]) {
        s.insert(getSG(nxt));
    }
    
    int mex = 0;
    while (s.count(mex)) mex++;
    return sg[state] = mex;
}

// 示例：取石子游戏（每次可以拿1、2、3个）
void example() {
    int n = 10;
    nextStates.resize(n + 1);
    sg.assign(n + 1, -1);
    
    // 建图
    for (int i = 0; i <= n; i++) {
        if (i >= 1) nextStates[i].push_back(i - 1);
        if (i >= 2) nextStates[i].push_back(i - 2);
        if (i >= 3) nextStates[i].push_back(i - 3);
    }
    
    // 计算SG值
    sg[0] = 0;  // 终态
    for (int i = 1; i <= n; i++) {
        getSG(i);
    }
    
    cout << "取石子游戏的SG值：" << endl;
    for (int i = 0; i <= n; i++) {
        cout << "SG(" << i << ") = " << sg[i] << endl;
    }
}

#include <iomanip>

// 掷骰子期望
double diceExpectation() {
    double E = 0;
    for (int i = 1; i <= 6; i++) {
        E += i * (1.0 / 6.0);
    }
    return E;
}

// 收集优惠券问题：n种优惠券，期望收集次数
double couponCollector(int n) {
    double E = 0;
    for (int i = 1; i <= n; i++) {
        E += (double)n / i;
    }
    return E;
}

// 概率DP：掷骰子，求总和为n的期望次数
double diceDP(int n) {
    vector<double> dp(n + 1, 0);
    
    for (int i = 1; i <= n; i++) {
        dp[i] = 1;  // 至少要掷一次
        for (int j = 1; j <= 6 && i - j >= 0; j++) {
            dp[i] += dp[i - j] / 6.0;
        }
    }
    
    return dp[n];
}

    double p = pow((double)(m - 1) / m, n);
    return m * p;
}

想象你在一个圆形跑道上跑步。跑道周长是m，你每次跑a步。问：跑多少步后，你恰好停在位置b？

🎯 **求解方法：**

**① 转化为不定方程**
ax ≡ b (mod m) 等价于 ax - my = b

**② 有解条件**
设 d = gcd(a, m)。方程有解 ⟺ d | b（d能整除b）

**③ 求解步骤**
1. 用扩展欧几里得求 ax₀ + my₀ = d 的解 (x₀, y₀)
2. 因为 d | b，所以 x = x₀ × (b/d) 是原方程的解
3. 所有解为 x + k×(m/d)，k为任意整数

**④ 特例：模逆元**
当 b = 1 时，ax ≡ 1 (mod m)，x就是a模m的逆元。

💡 **一句话记住线性同余：** "扩展欧几里得是钥匙，打开同余方程的锁！"`,

    derivation: `## 线性同余方程的推导与实现

### 1. 问题定义

求解 ax ≡ b (mod m)，即找整数x使得 ax mod m = b。

### 2. 转化为不定方程

ax ≡ b (mod m) 
⟺ ax - my = b（对某个整数y）

### 3. 有解条件

**定理：** ax ≡ b (mod m) 有解 ⟺ gcd(a, m) | b

**证明：**
设 d = gcd(a, m)。如果 ax - my = b 有解，则 d | (ax - my)，所以 d | b。

### 4. 求解算法

\`\`\`
// 求解 ax ≡ b (mod m)
int solveLinearCongruence(int a, int b, int m) {
    int x, y;
    int d = exgcd(a, m, x, y);  // 求 ax + my = d
    
    if (b % d != 0) return -1;  // 无解
    
    // x₀ 是 ax + my = d 的解
    // x = x₀ × (b/d) 是 ax ≡ b (mod m) 的解
    x = (long long)x * (b / d) % m;
    return (x % m + m) % m;  // 保证非负
}
\`\`\`

### 5. 模逆元

当 b = 1 时，ax ≡ 1 (mod m)，x是a模m的逆元。

\`\`\`
int modInverse(int a, int m) {
    return solveLinearCongruence(a, 1, m);
}
\`\`\`

有解条件：gcd(a, m) = 1

### 6. 时间复杂度

| 操作 | 时间复杂度 |
|------|------------|
| 扩展欧几里得 | O(log(min(a, m))) |
| 求解线性同余 | O(log(min(a, m))) |`,

    code: `// 线性同余方程经典：求解与应用
#include <iostream>
using namespace std;

// 扩展欧几里得
int exgcd(int a, int b, int &x, int &y) {
    if (b == 0) {
        x = 1; y = 0;
        return a;
    }
    int d = exgcd(b, a % b, x, y);
    int t = x;
    x = y;
    y = t - (a / b) * y;
    return d;
}

// 求解线性同余方程 ax ≡ b (mod m)
int solveLinearCongruence(int a, int b, int m) {
    int x, y;
    int d = exgcd(a, m, x, y);
    
    if (b % d != 0) {
        cout << "方程无解" << endl;
        return -1;
    }
    
    // x₀ × (b/d) 是一个解
    x = (long long)x * (b / d) % m;
    return (x % m + m) % m;  // 保证非负
}

// 求模逆元
int modInverse(int a, int m) {
    return solveLinearCongruence(a, 1, m);
}

    int a = 3, b = 5, m = 11;
    int x = solveLinearCongruence(a, b, m);
    cout << a << "x ≡ " << b << " (mod " << m << ")" << endl;
    cout << "x = " << x << endl;
    cout << "验证：" << a << " × " << x << " mod " << m 
         << " = " << (a * x) % m << endl;
    
    // 示例2：求 3 模 11 的逆元
    cout << "\\n3 模 11 的逆元 = " << modInverse(3, 11) << endl;
    cout << "验证：3 × 4 mod 11 = " << (3 * 4) % 11 << endl;
    
    // 示例3：2x ≡ 4 (mod 6)
    a = 2; b = 4; m = 6;
    x = solveLinearCongruence(a, b, m);
    cout << "\\n" << a << "x ≡ " << b << " (mod " << m << ")" << endl;
    cout << "x = " << x << endl;
    
    return 0;
}

中国剩余定理说：如果模数两两互质，那么一定存在唯一解（在模数乘积的范围内）！

🎯 **求解方法：**

**① 构造法**
设 M = m₁ × m₂ × ... × mₖ（所有模数的乘积）
设 Mᵢ = M / mᵢ
设 tᵢ 是 Mᵢ 模 mᵢ 的逆元（Mᵢ × tᵢ ≡ 1 (mod mᵢ)）

则 x = Σ aᵢ × Mᵢ × tᵢ (mod M)

- 当 i = j 时，Mⱼ × tⱼ ≡ 1 (mod mⱼ)，所以 aⱼ × Mⱼ × tⱼ ≡ aⱼ (mod mⱼ)

### 1. 问题定义

求解同余方程组：
\`\`\`
x ≡ a₁ (mod m₁)
x ≡ a₂ (mod m₂)
...
x ≡ aₖ (mod mₖ)
\`\`\`

其中 m₁, m₂, ..., mₖ 两两互质。

### 2. 定理内容

**定理：** 如果模数两两互质，则方程组有唯一解（模 M = m₁m₂...mₖ）。

### 3. 构造法求解

**步骤：**
1. 计算 M = m₁ × m₂ × ... × mₖ
2. 对每个 i，计算 Mᵢ = M / mᵢ
3. 求 Mᵢ 模 mᵢ 的逆元 tᵢ（即 Mᵢ × tᵢ ≡ 1 (mod mᵢ)）
4. 解为 x = Σ aᵢ × Mᵢ × tᵢ (mod M)

### 4. 代码实现

\`\`\`
long long CRT(vector<int>& a, vector<int>& m) {
    long long M = 1;
    for (int mi : m) M *= mi;
    
    long long x = 0;
    for (int i = 0; i < a.size(); i++) {
        long long Mi = M / m[i];
        long long ti = modInverse(Mi, m[i]);
        x = (x + a[i] * Mi % M * ti % M) % M;
    }
    
    return (x % M + M) % M;
}
\`\`\`

int exgcd(int a, int b, int &x, int &y) {
    if (b == 0) {

        return a;
    }
    int d = exgcd(b, a % b, x, y);
    int t = x;
    x = y;
    y = t - (a / b) * y;
    return d;
}

    derivation: `## 高次同余方程的推导与实现

### 1. 问题定义

求解 a^x ≡ b (mod m)，求最小的非负整数x。

### 2. BSGS算法

**核心思想：** 分块查找。

设 s = ⌈√m⌉，令 x = i×s - j（0 ≤ j < s）。

则 a^(i×s - j) ≡ b (mod m)
⟺ a^(i×s) ≡ b × a^j (mod m)

**算法步骤：**
1. **Baby Step：** 计算 b × a^j (mod m) 对所有 0 ≤ j < s，存入哈希表
2. **Giant Step：** 枚举 i 从 0 到 s，计算 a^(i×s) (mod m)，在哈希表中查找

### 3. 代码实现

\`\`\`
int BSGS(int a, int b, int m) {
    unordered_map<int, int> table;
    int s = ceil(sqrt(m));
    
    // Baby Step：存 b * a^j
    long long cur = b;
    for (int j = 0; j < s; j++) {
        table[cur] = j;
        cur = cur * a % m;
    }
    
    // Giant Step：查 a^(i*s)
    long long as = qpow(a, s, m);  // a^s mod m
    cur = 1;
    for (int i = 0; i <= s; i++) {
        if (table.count(cur)) {
            int j = table[cur];
            int x = i * s - j;
            if (x >= 0) return x;
        }
        cur = cur * as % m;
    }
    
    return -1;  // 无解
}
\`\`\`

    a %= mod;
    while (b > 0) {
        if (b & 1) ans = ans * a % mod;
        a = a * a % mod;
        b >>= 1;

    return ans;

    for (int i = 1; i < MAXN; i++) {
        fact[i] = fact[i-1] * i % MOD;

    for (int i = MAXN-2; i >= 0; i--) {

    return fact[n] * invFact[n-m] % MOD;

long long inclusionExclusion(vector<long long>& sizes,

    int n = sizes.size();
    long long ans = 0;
    
    for (int S = 1; S < (1 << n); S++) {
        int cnt = __builtin_popcount(S);

    for (int i = 1; i <= 20; i++) {

// 错排数 D(n)
long long derangement(int n) {
    long long ans = 0;
    long long sign = 1;
    
    for (int i = 0; i <= n; i++) {

这就是著名的**错排问题**，它的答案和**卡特兰数**有着千丝万缕的联系。

再想象另一个场景：你有2n个人排队买票，票价5元。其中n个人拿着5元纸币，n个人拿着10元纸币。售票员一开始没有零钱。问有多少种排队方式，使得**任何时候售票员都能找得开零钱**？

答案就是第n个**卡特兰数**！

这些看似不相关的问题，背后都隐藏着同一组神奇的数列——**卡特兰数**和**斯特林数**。它们在组合数学中无处不在：
- 🎪 括号匹配的方案数
- 🌳 n个节点的二叉树个数
- 🍰 把n个元素划分成k个非空集合的方案数
- 🔑 矩阵连乘的括号化方案数`,

    idea: `🎭 **卡特兰数 = 计数"合法序列"的万能钥匙**

**① 卡特兰数（Catalan Number）**

卡特兰数描述的是：在某种"对称"操作中，**合法方案**的数量。

**经典模型：括号匹配**
n对括号，有多少种合法匹配方式？
\`\`\`
n=1: ()                    → 1种
n=2: ()(), (())            → 2种
n=3: ()()(), ()(()), (())(), (()()), ((()))  → 5种
\`\`\`

**卡特兰数公式：**
\`\`\`
C(n) = C(2n, n) / (n+1) = (2n)! / ((n+1)! × n!)
\`\`\`

递推公式：
\`\`\`
C(0) = 1
C(n+1) = Σ C(i) × C(n-i)  (i从0到n)
\`\`\`

前几个卡特兰数：1, 1, 2, 5, 14, 42, 132, 429, 1430, 4862, ...

**为什么叫"卡特兰"？** 因为比利时数学家卡特兰在研究各种组合问题时频繁遇到这个数列。

**② 卡特兰数的应用**

以下问题的答案都是第n个卡特兰数：
- n对括号的合法匹配数
- n+1个叶子的满二叉树个数
- 凸n+2边形分成三角形的方法数
- 栈的出栈序列数（1到n依次入栈，合法出栈序列数）
- 不超过对角线的凸多边形三角划分数

**③ 斯特林数（Stirling Number）**

斯特林数分两种：

**第一类斯特林数 s(n, k)** —— 把n个元素排成k个**圆排列**的方案数。
\`\`\`
想象n个人围成k个圆桌吃饭，每桌至少1人，有多少种坐法？
\`\`\`

递推：s(n, k) = s(n-1, k-1) + (n-1) × s(n-1, k)

**第二类斯特林数 S(n, k)** —— 把n个**不同**元素分成k个**非空集合**的方案数。
\`\`\`
想象n个不同的球放进k个相同的盒子，每盒至少1个球，有多少种放法？
\`\`\`

递推：S(n, k) = k × S(n-1, k) + S(n-1, k-1)

💡 **一句话记住：** "卡特兰数数合法序列，斯特林数数分堆堆！"`,

    derivation: `## 卡特兰数与斯特林数的推导与实现

### 1. 卡特兰数的推导

**方法一：折线法（反射原理）**

问题：从(0,0)走到(2n,0)，每步向右上或右下走一格，要求路径**不穿过x轴**。

总路径数 = C(2n, n)
不合法路径数 = 从(0,0)到(2n,-2)的路径数 = C(2n, n+1)（反射原理）

合法路径数 = C(2n, n) - C(2n, n+1) = C(2n, n) / (n+1)

**方法二：生成函数**

设 C(x) = Σ C(n) × x^n

由递推 C(n+1) = Σ C(i) × C(n-i) 得：
C(x) = 1 + x × C(x)²

解方程：C(x) = (1 - √(1-4x)) / (2x)

### 2. 代码实现

**① 卡特兰数**
\`\`\`
long long catalan(int n) {
    // C(2n, n) / (n+1)
    long long ans = 1;
    for (int i = 1; i <= n; i++) {
        ans = ans * (n + i) / i;
    }
    return ans / (n + 1);
}
\`\`\`

带取模版本：
\`\`\`
long long catalan_mod(int n, long long mod) {
    // 用卢卡斯定理或直接算组合数
    return C(2*n, n, mod) * inv(n+1, mod) % mod;
}
\`\`\`

**② 第二类斯特林数**
\`\`\`

    S[0][0] = 1;

}
\`\`\`

**③ 第一类斯特林数**
\`\`\`

void initStirling1() {
    s[0][0] = 1;
    for (int i = 1; i < MAXN; i++) {
        for (int j = 1; j <= i; j++) {
            s[i][j] = (s[i-1][j-1] + (i-1) * s[i-1][j]) % MOD;
        }
    }
}
\`\`\`

### 3. 应用

**出栈序列问题：**
1到n依次入栈，合法出栈序列数 = C(n)

**二叉树计数：**
n个节点的不同二叉树数 = C(n)

**集合划分：**
n个元素分成k个非空集合 = S(n, k)`,

#include <iostream>
#include <vector>

const int MOD = 1e9 + 7;

// 快速幂
long long qpow(long long a, long long b, long long mod) {
    long long ans = 1;
    a %= mod;
    while (b > 0) {
        if (b & 1) ans = ans * a % mod;
        a = a * a % mod;
        b >>= 1;
    }
    return ans;
}

// 逆元
long long inv(long long a, long long mod) {
    return qpow(a, mod - 2, mod);
}

// 阶乘
long long fact[200005], ifact[200005];

void init() {
    fact[0] = 1;
    for (int i = 1; i <= 200000; i++) {
        fact[i] = fact[i-1] * i % MOD;
    }
    ifact[200000] = inv(fact[200000], MOD);
    for (int i = 199999; i >= 0; i--) {
        ifact[i] = ifact[i+1] * (i+1) % MOD;
    }
}

// 组合数
long long C(int n, int m) {
    if (m < 0 || m > n) return 0;
    return fact[n] * ifact[m] % MOD * ifact[n-m] % MOD;
}

// 卡特兰数 C(n)

    return C(2*n, n) * inv(n + 1, MOD) % MOD;

    for (int i = 1; i <= 1000; i++) {

  'ch6_7_1_intro': {
    problemDesc: `📊 想象你是一个游戏设计师。你设计了一个角色成长系统，角色的属性由一个向量表示（攻击力、防御力、速度...）。每次升级时，属性按照一个固定的规则变换——比如攻击力变成原来的2倍加防御力，防御力变成原来的3倍...

这种"向量按照固定规则变换"的操作，就是**矩阵乘法**！

再想象：你有一个递推式 f(n) = f(n-1) + f(n-2)（斐波那契数列）。如果n=10^18，你怎么快速求出f(n)？

暴力递推？太慢了！但如果你能把递推式写成矩阵形式：
\`\`\`
[f(n)  ]   [1 1]   [f(n-1)]
[f(n-1)] = [1 0] × [f(n-2)]
\`\`\`
那么 f(n) 就可以用**矩阵快速幂**在 O(log n) 时间内求出！

矩阵在OI中的应用：
- ⚡ 递推加速（矩阵快速幂）

    idea: `📊 **矩阵 = 线性变换的"操作面板"**

**① 矩阵基础**

矩阵就是一个数表：
\`\`\`
A = [a₁₁ a₁₂]    2×2矩阵
    [a₂₁ a₂₂]
\`\`\`

**矩阵乘法：**
\`\`\`
C = A × B
C[i][j] = Σ A[i][k] × B[k][j]
\`\`\`

注意：矩阵乘法**不满足交换律**！A×B ≠ B×A

**② 矩阵快速幂**

和整数快速幂一模一样！
\`\`\`
A^n = ?

把n拆成二进制：
n = 13 = 1101(二进制)
A^13 = A^8 × A^4 × A^1

每次平方，遇到1就乘进去。
时间复杂度：O(矩阵大小³ × log n)

**③ 矩阵快速幂加速递推**

**斐波那契数列：**
\`\`\`
f(n) = f(n-1) + f(n-2)

写成矩阵形式：
[f(n)  ]   [1 1]^(n-1)   [f(1)]

用矩阵快速幂求 [1 1]^(n-1) 即可！

**一般方法：**
1. 把递推式写成矩阵形式
2. 用矩阵快速幂求解
3. 时间复杂度从 O(n) 降到 O(k³ × log n)（k是矩阵大小）

💡 **一句话记住矩阵快速幂：** "递推太慢？矩阵加速，O(log n)搞定！"`,

    derivation: `## 矩阵快速幂的推导与实现

### 1. 矩阵乘法

\`\`\`
C = A × B
C[i][j] = Σ_{k=1}^{m} A[i][k] × B[k][j]

时间复杂度：O(n³)（n×n矩阵）
\`\`\`

### 2. 矩阵快速幂

**原理：** 和整数快速幂一样，利用结合律。

\`\`\`
A^n：
- n是偶数：A^n = (A^(n/2))²
- n是奇数：A^n = A × A^(n-1)
\`\`\`

**代码：**
\`\`\`
struct Matrix {
    long long a[105][105];
    int n;
    
    Matrix(int _n) : n(_n) {
        memset(a, 0, sizeof(a));
    }
    
    Matrix operator*(const Matrix& B) const {
        Matrix C(n);
        for (int i = 0; i < n; i++)
            for (int k = 0; k < n; k++)
                for (int j = 0; j < n; j++)
                    C.a[i][j] = (C.a[i][j] + a[i][k] * B.a[k][j]) % MOD;
        return C;
    }
};

Matrix qpow(Matrix A, long long b) {
    Matrix ans(A.n);
    for (int i = 0; i < A.n; i++) ans.a[i][i] = 1; // 单位矩阵
    
    while (b > 0) {
        if (b & 1) ans = ans * A;
        A = A * A;
        b >>= 1;
    }
    return ans;
}
\`\`\`

### 3. 斐波那契数列

\`\`\`
[f(n+1)]   [1 1]^n   [f(1)]
[f(n)  ] = [1 0]   × [f(0)]

f(1) = 1, f(0) = 0
\`\`\`

### 4. 时间复杂度

| 操作 | 时间复杂度 |
|------|------------|
| 矩阵乘法 | O(k³) |
| 矩阵快速幂 | O(k³ × log n) |
| 普通递推 | O(n) |

当 n > k³/log n 时，矩阵快速幂更快。`,

    code: `// 矩阵快速幂经典：斐波那契数列
#include <iostream>
#include <cstring>
using namespace std;

const long long MOD = 1e9 + 7;

struct Matrix {
    long long a[5][5];
    int n;
    
    Matrix(int _n) : n(_n) {
        memset(a, 0, sizeof(a));
    }
    
    Matrix operator*(const Matrix& B) const {
        Matrix C(n);
        for (int i = 0; i < n; i++)
            for (int k = 0; k < n; k++)
                if (a[i][k])
                    for (int j = 0; j < n; j++)
                        C.a[i][j] = (C.a[i][j] + a[i][k] * B.a[k][j]) % MOD;
        return C;
    }
    
    void print() {
        for (int i = 0; i < n; i++) {
            for (int j = 0; j < n; j++) {
                cout << a[i][j] << " ";
            }
            cout << endl;
        }
    }
};

// 矩阵快速幂
Matrix qpow(Matrix A, long long b) {
    Matrix ans(A.n);
    for (int i = 0; i < A.n; i++) ans.a[i][i] = 1; // 单位矩阵
    
    while (b > 0) {
        if (b & 1) ans = ans * A;
        A = A * A;
        b >>= 1;
    }
    return ans;
}

// 斐波那契数列第n项 O(log n)
long long fib(long long n) {
    if (n <= 1) return n;
    
    Matrix T(2);
    T.a[0][0] = 1; T.a[0][1] = 1;
    T.a[1][0] = 1; T.a[1][1] = 0;
    
    Matrix res = qpow(T, n - 1);
    return res.a[0][0]; // f(n) = res[0][0] * f(1) + res[0][1] * f(0)
}

// 例题：线性递推
// f(n) = 2*f(n-1) + 3*f(n-2), f(0)=1, f(1)=2
long long linearRec(long long n) {
    if (n == 0) return 1;
    if (n == 1) return 2;
    
    Matrix T(2);
    T.a[0][0] = 2; T.a[0][1] = 3;
    T.a[1][0] = 1; T.a[1][1] = 0;
    
    Matrix res = qpow(T, n - 1);
    return (res.a[0][0] * 2 + res.a[0][1] * 1) % MOD;
}

int main() {
    // 斐波那契数列
    cout << "斐波那契数列：" << endl;
    for (int i = 0; i <= 10; i++) {
        cout << "f(" << i << ") = " << fib(i) << endl;
    }
    
    // 超大斐波那契
    cout << "\\nf(10^18) = " << fib(1000000000000000000LL) << endl;
    
    // 线性递推
    cout << "\\n线性递推 f(10) = " << linearRec(10) << endl;
    
    return 0;
}

// 💡 矩阵快速幂的精髓：递推加速，O(log n)搞定！`

💡 **一句话记住高斯消元：** "消成阶梯，回代求解！"`,

    derivation: `## 高斯消元的推导与实现

### 1. 算法步骤

**消元阶段：**
\`\`\`
for i = 0 to n-1:
    1. 找第i列绝对值最大的行（主元），交换到第i行
    2. 把第i行除以主元，使主元变为1
    3. 对于下面的每一行j，减去 第i行 × a[j][i]
\`\`\`

**回代阶段：**
\`\`\`
for i = n-1 down to 0:
    x[i] = a[i][n] - Σ a[i][j] × x[j]  (j从i+1到n-1)
\`\`\`

### 2. 代码实现

\`\`\`
int gauss(vector<vector<double>>& a, vector<double>& ans) {
    int n = a.size();
    
    for (int i = 0; i < n; i++) {
        // 找主元
        int maxRow = i;
        for (int j = i + 1; j < n; j++) {
            if (abs(a[j][i]) > abs(a[maxRow][i])) {
                maxRow = j;
            }
        }
        swap(a[i], a[maxRow]);
        
        if (abs(a[i][i]) < EPS) return 0; // 无解或无穷解
        
        // 消元
        for (int j = i + 1; j < n; j++) {
            double factor = a[j][i] / a[i][i];
            for (int k = i; k <= n; k++) {
                a[j][k] -= a[i][k] * factor;
            }
        }
    }
    
    // 回代
    ans.resize(n);
    for (int i = n - 1; i >= 0; i--) {
        ans[i] = a[i][n];
        for (int j = i + 1; j < n; j++) {
            ans[i] -= a[i][j] * ans[j];
        }
        ans[i] /= a[i][i];
    }
    return 1;
}
\`\`\`

\`\`\`
用bitset优化，时间复杂度 O(n³/64)

    int n = a.size();
    
    for (int i = 0; i < n; i++) {
        // 找主元（部分主元法）
        int maxRow = i;
        for (int j = i + 1; j < n; j++) {
            if (abs(a[j][i]) > abs(a[maxRow][i])) {
                maxRow = j;
            }
        }
        swap(a[i], a[maxRow]);
        
        if (abs(a[i][i]) < EPS) return 0; // 无唯一解
        
        // 消元
        for (int j = i + 1; j < n; j++) {
            double factor = a[j][i] / a[i][i];
            for (int k = i; k <= n; k++) {
                a[j][k] -= a[i][k] * factor;
            }
        }
    }
    
    // 回代
    ans.resize(n);
    for (int i = n - 1; i >= 0; i--) {
        ans[i] = a[i][n];
        for (int j = i + 1; j < n; j++) {
            ans[i] -= a[i][j] * ans[j];
        }
        ans[i] /= a[i][i];
    }
    return 1;
}

// 异或方程组（开关问题）
int gaussXOR(vector<vector<int>>& a, vector<int>& ans) {
    int n = a.size();
    
    for (int i = 0; i < n; i++) {
        int pivot = i;
        for (int j = i + 1; j < n; j++) {
            if (a[j][i]) {
                pivot = j;
                break;
            }
        }
        if (!a[pivot][i]) return 0;
        swap(a[i], a[pivot]);
        
        for (int j = i + 1; j < n; j++) {
            if (a[j][i]) {
                for (int k = i; k <= n; k++) {
                    a[j][k] ^= a[i][k];
                }
            }
        }
    }
    
    ans.resize(n);
    for (int i = n - 1; i >= 0; i--) {
        ans[i] = a[i][n];
        for (int j = i + 1; j < n; j++) {
            ans[i] ^= a[i][j] * ans[j];
        }
    }
    return 1;
}

struct LinearBasis {
    long long base[64];
    int cnt;
    int sz; // 线性基大小
    
    void init() {
        memset(base, 0, sizeof(base));
        cnt = 0;
        sz = 0;
    }
    
    bool insert(long long x) {
        for (int i = 62; i >= 0; i--) {
            if ((x >> i) & 1) {
                if (!base[i]) {
                    base[i] = x;
                    sz++;
                    return true;
                }
                x ^= base[i];
            }
        }
        return false;
    }
    
    // 查询最大异或和
    long long queryMax() {
        long long ans = 0;
        for (int i = 62; i >= 0; i--) {
            ans = max(ans, ans ^ base[i]);
        }
        return ans;
    }
    
    // 查询最小异或和（非空）
    long long queryMin() {
        for (int i = 0; i <= 62; i++) {
            if (base[i]) return base[i];
        }
        return 0;
    }
    
    // 重构线性基（用于查询第k小）
    void rebuild() {
        for (int i = 62; i >= 0; i--) {
            for (int j = i - 1; j >= 0; j--) {
                if ((base[i] >> j) & 1) {
                    base[i] ^= base[j];
                }
            }
        }
    }
    
    // 查询第k小异或和
    long long queryKth(long long k) {
        rebuild();
        long long ans = 0;
        int idx = 0;
        for (int i = 0; i <= 62; i++) {
            if (base[i]) {
                if ((k >> idx) & 1) {
                    ans ^= base[i];
                }
                idx++;
            }
        }
        return ans;
    }
};

    cout << "最小异或和: " << lb.queryMin() << endl;
    
    // 第k小
    cout << "\\n所有能异或出的值（从小到大）：" << endl;
    long long total = 1LL << lb.sz;
    for (long long k = 0; k < total && k < 20; k++) {

}

### 1. 单位根

n次单位根 ωₙ = e^(2πi/n)

性质：
- ωₙⁿ = 1
- ωₙᵏ = ωₙₙₖₙₖ（折半引理）
- ωₙᵏ⁺ⁿ/² = -ωₙᵏ（消去引理）

### 2. FFT算法

\`\`\`
FFT(A):
  if |A| == 1: return A
  
  把A按奇偶分成 A₀ 和 A₁
  A₀ = (a₀, a₂, a₄, ...)
  A₁ = (a₁, a₃, a₅, ...)
  
  递归计算 FFT(A₀) 和 FFT(A₁)
  
  合并：
  for k = 0 to n/2-1:
    A[ωₙᵏ] = A₀[ωₙ/₂ᵏ] + ωₙᵏ × A₁[ωₙ/₂ᵏ]
    A[ωₙᵏ⁺ⁿ/²] = A₀[ωₙ/₂ᵏ] - ωₙᵏ × A₁[ωₙ/₂ᵏ]
\`\`\`

时间复杂度：T(n) = 2T(n/2) + O(n) = O(n log n)

### 3. 代码实现

\`\`\`
struct Complex {
    double r, i;
    Complex(double r = 0, double i = 0) : r(r), i(i) {}
    Complex operator+(const Complex& o) const { return {r + o.r, i + o.i}; }
    Complex operator-(const Complex& o) const { return {r - o.r, i - o.i}; }
    Complex operator*(const Complex& o) const { 
        return {r * o.r - i * o.i, r * o.i + i * o.r}; 
    }
};

void fft(vector<Complex>& a, bool inv) {
    int n = a.size();
    // 蝴蝶变换
    for (int i = 1, j = 0; i < n; i++) {
        int bit = n >> 1;
        for (; j & bit; bit >>= 1) j ^= bit;
        j ^= bit;
        if (i < j) swap(a[i], a[j]);
    }
    
    // 分治合并
    for (int len = 2; len <= n; len <<= 1) {
        double ang = 2 * PI / len * (inv ? -1 : 1);
        Complex wlen(cos(ang), sin(ang));
        for (int i = 0; i < n; i += len) {
            Complex w(1, 0);
            for (int j = 0; j < len / 2; j++) {
                Complex u = a[i + j], v = w * a[i + j + len / 2];
                a[i + j] = u + v;
                a[i + j + len / 2] = u - v;
                w = w * wlen;
            }
        }
    }
    
    if (inv) {
        for (auto& x : a) x.r /= n;
    }
}

void ntt(vector<long long>& a, bool inv, long long mod) {

        j ^= bit;
        if (i < j) swap(a[i], a[j]);

    for (int len = 2; len <= n; len <<= 1) {
        long long gn = qpow(3, (mod - 1) / len, mod);
        if (inv) gn = qpow(gn, mod - 2, mod);
        for (int i = 0; i < n; i += len) {

                a[i + j] = (u + v) % mod;
                a[i + j + len / 2] = (u - v + mod) % mod;

        }
    }
    
    if (inv) {
        long long inv_n = qpow(n, mod - 2, mod);
        for (auto& x : a) x = x * inv_n % mod;
    }
}

#include <vector>
#include <cmath>
using namespace std;

const double PI = acos(-1.0);
const long long MOD = 998244353;

// 快速幂
long long qpow(long long a, long long b, long long mod) {
    long long ans = 1;
    a %= mod;
    while (b > 0) {
        if (b & 1) ans = ans * a % mod;
        a = a * a % mod;
        b >>= 1;
    }
    return ans;
}

// 复数
struct Complex {
    double r, i;
    Complex(double r = 0, double i = 0) : r(r), i(i) {}
    Complex operator+(const Complex& o) const { return {r + o.r, i + o.i}; }

    Complex operator*(const Complex& o) const { 
        return {r * o.r - i * o.i, r * o.i + i * o.r}; 
    }
};

void fft(vector<Complex>& a, bool inv) {
    int n = a.size();
    for (int i = 1, j = 0; i < n; i++) {
        int bit = n >> 1;
        for (; j & bit; bit >>= 1) j ^= bit;
        j ^= bit;
        if (i < j) swap(a[i], a[j]);

        Complex wlen(cos(ang), sin(ang));
        for (int i = 0; i < n; i += len) {
            Complex w(1, 0);
            for (int j = 0; j < len / 2; j++) {
                Complex u = a[i + j], v = w * a[i + j + len / 2];
                a[i + j] = u + v;
                a[i + j + len / 2] = u - v;
                w = w * wlen;
            }
        }
    }
    
    if (inv) {
        for (auto& x : a) x.r /= n;
    }
}

// 多项式乘法（FFT）
vector<long long> multiply_fft(vector<long long>& a, vector<long long>& b) {
    vector<Complex> fa(a.begin(), a.end()), fb(b.begin(), b.end());
    int n = 1;
    while (n < a.size() + b.size()) n <<= 1;
    fa.resize(n); fb.resize(n);
    
    fft(fa, false); fft(fb, false);
    for (int i = 0; i < n; i++) fa[i] = fa[i] * fb[i];
    fft(fa, true);
    
    vector<long long> res(n);
    for (int i = 0; i < n; i++) {
        res[i] = round(fa[i].r);
    }
    return res;
}

// NTT
void ntt(vector<long long>& a, bool inv) {
    int n = a.size();
    for (int i = 1, j = 0; i < n; i++) {
        int bit = n >> 1;
        for (; j & bit; bit >>= 1) j ^= bit;
        j ^= bit;
        if (i < j) swap(a[i], a[j]);
    }
    
    for (int len = 2; len <= n; len <<= 1) {
        long long gn = qpow(3, (MOD - 1) / len, MOD);
        if (inv) gn = qpow(gn, MOD - 2, MOD);
        for (int i = 0; i < n; i += len) {
            long long g = 1;
            for (int j = 0; j < len / 2; j++) {
                long long u = a[i + j], v = g * a[i + j + len / 2] % MOD;
                a[i + j] = (u + v) % MOD;
                a[i + j + len / 2] = (u - v + MOD) % MOD;
                g = g * gn % MOD;
            }
        }
    }
    
    if (inv) {
        long long inv_n = qpow(n, MOD - 2, MOD);

    }

// 多项式乘法（NTT）
vector<long long> multiply_ntt(vector<long long>& a, vector<long long>& b) {
    vector<long long> fa = a, fb = b;
    int n = 1;
    while (n < a.size() + b.size()) n <<= 1;

    for (int i = 0; i < n; i++) fa[i] = fa[i] * fb[i] % MOD;

**① 莫比乌斯函数 μ(n)**

\`\`\`
μ(n) =

  (-1)^k,      如果 n 是 k 个不同质数的乘积
  0,           如果 n 有平方因子
\`\`\`

例如：

\`\`\`

vector<int> primes;

void initMu() {
    mu[1] = 1;
    for (int i = 2; i < MAXN; i++) {
        if (isPrime[i]) {
            primes.push_back(i);
            mu[i] = -1;
        }
        for (int p : primes) {

            isPrime[i * p] = false;
            if (i % p == 0) {
                mu[i * p] = 0;
                break;
            } else {
                mu[i * p] = -mu[i];
            }
        }
    }
    
    // 前缀和
    sumMu[0] = 0;
    for (int i = 1; i < MAXN; i++) {
        sumMu[i] = sumMu[i - 1] + mu[i];
    }

long long countCoprime(int n, int m) {

    for (int l = 1, r; l <= min(n, m); l = r + 1) {
        r = min(n / (n / l), m / (m / l));

}

    for (int d = 1; d <= min(n, m); d++) {
        ans += (long long)d * countCoprime(n / d, m / d);
    }
    return ans;
}

        double div = a[r][c];

                double factor = a[i][c];

            }
        }

### 1. 循环分解

vector<vector<int>> decompose(vector<int>& p) {
    int n = p.size();
    vector<bool> vis(n, false);
    vector<vector<int>> cycles;
    
    for (int i = 0; i < n; i++) {
        if (!vis[i]) {

            while (!vis[j]) {

vector<int> power(vector<int>& p, long long k) {
    int n = p.size();
    vector<int> res(n);
    auto cycles = decompose(p);

#include <iostream>
#include <vector>
using namespace std;

struct DSU {
    vector<int> fa, rank;
    
    DSU(int n) {
        fa.resize(n + 1);
        rank.resize(n + 1, 0);
        for (int i = 1; i <= n; i++) {
            fa[i] = i;
        }
    }
    
    int find(int x) {
        if (fa[x] == x) return x;
        return fa[x] = find(fa[x]);  // 路径压缩
    }
    
    void unite(int x, int y) {
        int fx = find(x), fy = find(y);
        if (fx == fy) return;
        
        if (rank[fx] < rank[fy]) swap(fx, fy);
        fa[fy] = fx;
        if (rank[fx] == rank[fy]) rank[fx]++;
    }
    
    bool same(int x, int y) {
        return find(x) == find(y);
    }
};

int topK(vector<int>& a, int k) {
    priority_queue<int, vector<int>, greater<int>> minHeap;  // 小根堆
    
    for (int x : a) {

        if (minHeap.size() > k) {

    problemDesc: `📊 想象你是一个游戏主播，要实时统计观众的点赞数。你有n个观众，每个观众的点赞数会不断变化。你需要快速回答：

如果用数组，每次求和要O(n)，太慢了！

**ST表（Sparse Table）** 可以帮你：
- 预处理：O(n log n)
- 查询区间最值：O(1)

    idea: `📊 **ST表 = 倍增思想 + 动态规划**

**ST表的核心思想：**

\`\`\`
st[i][j] 表示从i开始，长度为2^j的区间的最值

st[i][0] = a[i]  // 长度为1
st[i][1] = max(st[i][0], st[i+1][0])  // 长度为2
st[i][2] = max(st[i][1], st[i+2][1])  // 长度为4
...
st[i][j] = max(st[i][j-1], st[i+2^(j-1)][j-1])
\`\`\`

**查询区间[L, R]的最值：**
\`\`\`
找到最大的k，使得2^k ≤ R-L+1
答案 = max(st[L][k], st[R-2^k+1][k])

两个长度为2^k的区间可以覆盖[L, R]！
\`\`\`

**为什么可以重叠？**
因为求最值时，重叠不影响结果！（max满足幂等性）

💡 **一句话记住ST表：** "倍增预处理，O(1)查询最值！"`,

    derivation: `## ST表的实现

### 1. 预处理

\`\`\`
int st[100005][20];  // st[i][j]表示从i开始长度为2^j的区间

void build(int* a, int n) {
    // 初始化
    for (int i = 1; i <= n; i++) {
        st[i][0] = a[i];
    }
    
    // 倍增
    for (int j = 1; (1 << j) <= n; j++) {
        for (int i = 1; i + (1 << j) - 1 <= n; i++) {
            st[i][j] = max(st[i][j-1], st[i + (1 << (j-1))][j-1]);
        }
    }
}
\`\`\`

### 2. 查询

\`\`\`
int query(int L, int R) {
    int k = log2(R - L + 1);  // 找到最大的k
    return max(st[L][k], st[R - (1 << k) + 1][k]);
}
\`\`\`

### 3. 时间复杂度

| 操作 | 时间复杂度 |
|------|------------|
| 预处理 | O(n log n) |
| 查询 | O(1) |

### 4. 局限性

ST表只能处理**静态数据**（不能修改），如果需要修改要用线段树或树状数组。`,

    code: `// ST表经典应用

#include <vector>
#include <cmath>

const int LOG = 20;

int lg[MAXN];  // 预处理log2

// 预处理
void build(int* a, int n) {
    // 预处理log
    lg[1] = 0;
    for (int i = 2; i <= n; i++) {
        lg[i] = lg[i / 2] + 1;
    }
    
    // 初始化
    for (int i = 1; i <= n; i++) {
        st[i][0] = a[i];

    // 倍增
    for (int j = 1; (1 << j) <= n; j++) {
        for (int i = 1; i + (1 << j) - 1 <= n; i++) {

        }
    }
}

### 2. 树状数组实现

#include <vector>

int lowbit(int x) {
    return x & (-x);
}

struct BIT {
    vector<int> c;
    int n;
    
    BIT(int n) : n(n) {
        c.resize(n + 1, 0);
    }
    
    void add(int i, int x) {
        for (; i <= n; i += lowbit(i)) {
            c[i] += x;
        }
    }
    
    int query(int i) {
        int sum = 0;
        for (; i > 0; i -= lowbit(i)) {
            sum += c[i];
        }
        return sum;
    }
    
    int queryRange(int L, int R) {
        return query(R) - query(L - 1);
    }
};

long long countInversions(vector<int>& a) {
    int n = a.size();
    BIT bit(n);
    long long ans = 0;
    
    for (int i = n - 1; i >= 0; i--) {
        ans += bit.query(a[i] - 1);
        bit.add(a[i], 1);
    }
    
    return ans;
}

**线段树的结构：**

\`\`\`
每个节点代表一个区间[L, R]
左儿子代表[L, mid]
右儿子代表[mid+1, R]
叶子节点代表单个元素

1  2 3  4 5  6 7  8

**线段树的操作：**

**① 建树**
\`\`\`
void build(int node, int L, int R) {
    if (L == R) {
        tree[node] = a[L];
        return;
    }
    int mid = (L + R) / 2;
    build(2*node, L, mid);
    build(2*node+1, mid+1, R);
    tree[node] = max(tree[2*node], tree[2*node+1]);
}
\`\`\`

**② 区间查询**
\`\`\`
int query(int node, int L, int R, int ql, int qr) {
    if (ql <= L && R <= qr) return tree[node];
    int mid = (L + R) / 2;
    int res = -INF;
    if (ql <= mid) res = max(res, query(2*node, L, mid, ql, qr));
    if (qr > mid) res = max(res, query(2*node+1, mid+1, R, ql, qr));
    return res;
}
\`\`\`

💡 **一句话记住线段树：** "区间二分，O(log n)搞定一切！"`,

    derivation: `## 线段树的实现

### 1. 基础线段树（区间最值）

\`\`\`
int tree[400005];

void build(int node, int L, int R, int* a) {
    if (L == R) {
        tree[node] = a[L];
        return;
    }
    int mid = (L + R) / 2;
    build(2*node, L, mid, a);
    build(2*node+1, mid+1, R, a);
    tree[node] = max(tree[2*node], tree[2*node+1]);
}

void update(int node, int L, int R, int pos, int val) {
    if (L == R) {
        tree[node] = val;
        return;
    }
    int mid = (L + R) / 2;
    if (pos <= mid) update(2*node, L, mid, pos, val);
    else update(2*node+1, mid+1, R, pos, val);
    tree[node] = max(tree[2*node], tree[2*node+1]);
}

int query(int node, int L, int R, int ql, int qr) {
    if (ql <= L && R <= qr) return tree[node];
    int mid = (L + R) / 2;
    int res = -1e9;
    if (ql <= mid) res = max(res, query(2*node, L, mid, ql, qr));
    if (qr > mid) res = max(res, query(2*node+1, mid+1, R, ql, qr));
    return res;
}
\`\`\`

### 2. 懒标记（区间修改）

\`\`\`
int lazy[400005];

void pushDown(int node, int L, int R) {
    if (lazy[node]) {
        int mid = (L + R) / 2;
        tree[2*node] += lazy[node];
        tree[2*node+1] += lazy[node];
        lazy[2*node] += lazy[node];
        lazy[2*node+1] += lazy[node];
        lazy[node] = 0;
    }
}

void updateRange(int node, int L, int R, int ql, int qr, int val) {
    if (ql <= L && R <= qr) {
        tree[node] += val;
        lazy[node] += val;
        return;
    }
    pushDown(node, L, R);
    int mid = (L + R) / 2;
    if (ql <= mid) updateRange(2*node, L, mid, ql, qr, val);
    if (qr > mid) updateRange(2*node+1, mid+1, R, ql, qr, val);
    tree[node] = max(tree[2*node], tree[2*node+1]);
}
\`\`\`

### 3. 时间复杂度

| 操作 | 时间复杂度 |
|------|------------|
| 建树 | O(n) |
| 单点修改 | O(log n) |
| 区间修改 | O(log n) |
| 区间查询 | O(log n) |`,

    code: `// 线段树经典应用
#include <iostream>
#include <vector>
#include <algorithm>
using namespace std;

const int INF = 1e9;

struct SegmentTree {
    vector<int> tree, lazy;
    int n;
    
    SegmentTree(int n) : n(n) {
        tree.resize(4 * n + 1);
        lazy.resize(4 * n + 1, 0);
    }
    
    void build(int node, int L, int R, vector<int>& a) {
        if (L == R) {
            tree[node] = a[L];
            return;
        }
        int mid = (L + R) / 2;
        build(2*node, L, mid, a);
        build(2*node+1, mid+1, R, a);
        tree[node] = max(tree[2*node], tree[2*node+1]);
    }
    
    void pushDown(int node, int L, int R) {
        if (lazy[node]) {
            tree[2*node] += lazy[node];
            tree[2*node+1] += lazy[node];
            lazy[2*node] += lazy[node];
            lazy[2*node+1] += lazy[node];
            lazy[node] = 0;
        }
    }
    
    void updatePoint(int node, int L, int R, int pos, int val) {
        if (L == R) {
            tree[node] = val;
            return;
        }
        int mid = (L + R) / 2;
        if (pos <= mid) updatePoint(2*node, L, mid, pos, val);
        else updatePoint(2*node+1, mid+1, R, pos, val);
        tree[node] = max(tree[2*node], tree[2*node+1]);
    }
    
    void updateRange(int node, int L, int R, int ql, int qr, int val) {
        if (ql <= L && R <= qr) {
            tree[node] += val;
            lazy[node] += val;
            return;
        }
        pushDown(node, L, R);
        int mid = (L + R) / 2;
        if (ql <= mid) updateRange(2*node, L, mid, ql, qr, val);
        if (qr > mid) updateRange(2*node+1, mid+1, R, ql, qr, val);
        tree[node] = max(tree[2*node], tree[2*node+1]);
    }
    
    int query(int node, int L, int R, int ql, int qr) {
        if (ql <= L && R <= qr) return tree[node];
        pushDown(node, L, R);
        int mid = (L + R) / 2;
        int res = -INF;
        if (ql <= mid) res = max(res, query(2*node, L, mid, ql, qr));
        if (qr > mid) res = max(res, query(2*node+1, mid+1, R, ql, qr));
        return res;
    }
};

int main() {
    vector<int> a = {0, 3, 1, 4, 1, 5, 9, 2, 6};  // 1-indexed
    int n = 8;
    
    SegmentTree st(n);
    st.build(1, 1, n, a);
    
    cout << "原始数组: ";
    for (int i = 1; i <= n; i++) cout << a[i] << " ";
    cout << endl;
    
    // 区间查询
    cout << "\\n区间查询（最大值）：" << endl;
    cout << "[1, 4]的最大值: " << st.query(1, 1, n, 1, 4) << endl;
    cout << "[3, 7]的最大值: " << st.query(1, 1, n, 3, 7) << endl;
    cout << "[5, 8]的最大值: " << st.query(1, 1, n, 5, 8) << endl;
    
    // 单点修改
    st.updatePoint(1, 1, n, 3, 10);
    cout << "\\n修改a[3]=10后：" << endl;
    cout << "[1, 4]的最大值: " << st.query(1, 1, n, 1, 4) << endl;
    
    // 区间修改
    st.updateRange(1, 1, n, 2, 5, 3);
    cout << "\\n区间[2,5]加3后：" << endl;
    cout << "[1, 8]的最大值: " << st.query(1, 1, n, 1, 8) << endl;
    
    return 0;
}

// 💡 线段树的精髓：区间二分，O(log n)搞定一切！`

💡 **一句话记住二叉树**："每个节点最多两个孩子，递归结构美如画！"`,

    idea: `🌲 **二叉树 = 每个节点最多两个孩子的树**

**二叉树的三种遍历方式：**

**① 前序遍历（根-左-右）**
\`\`\`
访问顺序：A → B → D → E → C → F
void preorder(Node* root) {
    if (!root) return;
    visit(root);           // 先访问根
    preorder(root->left);  // 再遍历左子树
    preorder(root->right); // 最后遍历右子树
}
\`\`\`

**② 中序遍历（左-根-右）**
\`\`\`
访问顺序：D → B → E → A → C → F
void inorder(Node* root) {
    if (!root) return;
    inorder(root->left);   // 先遍历左子树
    visit(root);           // 再访问根
    inorder(root->right);  // 最后遍历右子树
}
\`\`\`

**③ 后序遍历（左-右-根）**
\`\`\`
访问顺序：D → E → B → F → C → A
void postorder(Node* root) {
    if (!root) return;
    postorder(root->left);
    postorder(root->right);
    visit(root);
}
\`\`\`

💡 **一句话记住遍历**："前序=根先，中序=根中，后序=根后！"`,

    derivation: `## 二叉树的推导与实现

### 1. 二叉树的性质

**性质1**：第i层最多有 2^i 个节点（根节点在第0层）
**性质2**：深度为k的二叉树最多有 2^(k+1) - 1 个节点
**性质3**：叶子节点数 = 度为2的节点数 + 1

### 2. 二叉搜索树（BST）

**性质**：左子树所有值 < 根 < 右子树所有值

\`\`\`cpp
Node* search(Node* root, int key) {
    if (!root || root->val == key) return root;
    if (key < root->val) return search(root->left, key);
    return search(root->right, key);
}
\`\`\`

### 3. 时间复杂度

| 操作 | 平均 | 最坏 |
|------|------|------|
| 查找 | O(log n) | O(n) |

你要找到这棵树上**距离最远的两个点**——就像要找到家族里住得最远的两个亲戚！

从G到H的路径：G → D → B → A → C → F → H，长度是6（经过6条边）

这就是**树的直径**——树中最长路径的长度！

🎯 **为什么要学树的直径？**
- 🏃 运动员训练：找到操场上最远的两个点
- 🚇 地铁规划：找到线路中最长的区间
- 🌐 网络延迟：找到网络中延迟最大的两个节点

💡 **一句话记住树的直径**："树中最远两点的距离！"`,

    idea: `🌲 **树的直径 = 树中最长路径**

**想象一下：**

你有一棵大树，要找到最远的两个点。暴力方法是枚举所有点对，但太慢了！

**方法1：两次BFS/DFS（超简单！）**

这个方法有个神奇的名字叫"两遍BFS法"，超级好记：

\`\`\`
步骤1：从任意点S出发，BFS找到最远的点A
  - 就像你站在操场任意位置，找到离你最近的同学
  - 这个同学一定在直径的一端！

步骤2：从A出发，BFS找到最远的点B
  - 从这个同学出发，找到离他最远的人
  - A到B的距离就是树的直径！

为什么这个方法是对的？
- 假设直径是U-V
- 从任意点S出发，最远的点一定是U或V（否则可以构造更长的路径）
- 所以第一次BFS一定能找到直径的一个端点！
\`\`\`

**方法2：树形DP（更优雅！）**

\`\`\`
对于每个节点u：
  - 左子树最深深度 = left_depth
  - 右子树最深深度 = right_depth
  - 经过u的最长路径 = left_depth + right_depth
  
  直径 = max(所有节点的最长路径)

就像站在每个节点上，看看经过自己的最长路有多长！
\`\`\`

**两种方法对比：**

| 方法 | 时间复杂度 | 空间复杂度 | 难度 |
|------|-----------|-----------|------|
| 两次BFS | O(n) | O(n) | ⭐ 简单 |
| 树形DP | O(n) | O(n) | ⭐⭐ 中等 |

💡 **一句话记住求直径**："两次BFS或树形DP，O(n)搞定！"`,

    derivation: `## 树的直径的推导与实现

### 1. 方法1：两次BFS

**正确性证明**：
- 假设树的直径是U-V，从任意点S出发
- 最远的点一定是U或V（否则可以构造更长的路径）

**时间复杂度**：O(n)，两次BFS各遍历一次树

### 2. 方法2：树形DP

**状态定义**：
- dp[u] = 以u为根的子树中，从u出发的最长路径长度

**转移方程**：
\`\`\`
dp[u] = max(dp[v] + 1)  (v是u的孩子)
ans = max(ans, depth1 + depth2)
\`\`\`

    code: `// 树的直径经典应用
#include <iostream>
#include <vector>
#include <queue>
#include <algorithm>
using namespace std;

const int MAXN = 100005;
vector<int> adj[MAXN];
int n;

pair<int, int> bfs(int start) {
    vector<int> dist(n + 1, -1);
    queue<int> q;
    q.push(start);
    dist[start] = 0;
    
    int farthest = start, maxDist = 0;
    
    while (!q.empty()) {
        int u = q.front();
        q.pop();
        
        for (int v : adj[u]) {
            if (dist[v] == -1) {
                dist[v] = dist[u] + 1;
                q.push(v);
                if (dist[v] > maxDist) {
                    maxDist = dist[v];
                    farthest = v;
                }
            }
        }
    }
    
    return {farthest, maxDist};
}

int diameter() {
    auto [a, d1] = bfs(1);
    auto [b, d2] = bfs(a);
    return d2;
}

int main() {
    cin >> n;
    for (int i = 1; i < n; i++) {
        int u, v;
        cin >> u >> v;
        adj[u].push_back(v);
        adj[v].push_back(u);
    }
    
    cout << "树的直径: " << diameter() << endl;
    
    return 0;
}

  'ch8_3_3_intro': {
    problemDesc: `🌲 想象你是一棵家族树中的成员，你要找到你和你的堂兄弟的**最近公共祖先**！

比如这棵家族树：
\`\`\`
            1（爷爷）
           / \\
          2   3（爸爸和叔叔）
         / \\ / \\
        4  5 6  7（你和兄弟姐妹、堂兄弟）
\`\`\`

现在问题来了：
- 4和5的最近公共祖先是谁？→ 是2（你们的爸爸）
- 4和6的最近公共祖先是谁？→ 是1（你们的爷爷）
- 6和7的最近公共祖先是谁？→ 是3（你们的叔叔）

这就是**LCA（Least Common Ancestor，最近公共祖先）**！

🎯 **LCA在OI中的超广泛应用：**
- 🌲 **树上路径问题**：两点之间的路径一定经过它们的LCA
- 📏 **树上距离查询**：dist(u,v) = depth[u] + depth[v] - 2×depth[LCA(u,v)]
- 🚇 **地铁换乘**：找到两条线路的最近公共站点
- 📦 **文件路径**：找到两个文件的最近公共目录

💡 **一句话记住LCA**："两个节点往上走，第一个碰到的共同祖先！"`,

    idea: `🌲 **LCA = 两个节点的最近公共祖先**

**想象一下：**

你和你的堂兄弟在家族树上，要找到你们最近的共同祖先。最简单的方法是什么？

**方法1：暴力向上跳（最直观）**
\`\`\`
步骤1：让你和堂兄弟站在同一层（深度相同）
  - 如果你在第3层，堂兄弟在第2层
  - 你先往上跳1步，到第2层
  
步骤2：两个人同时往上跳，直到相遇
  - 如果跳到同一个节点，那就是LCA！
  
时间复杂度：O(n) —— 最坏情况要跳到根节点
\`\`\`

**方法2：倍增法（OI中最常用！）**

这个方法就像"跳远比赛"，每次跳2的幂次步！

\`\`\`
预处理：
  fa[u][k] = 节点u向上跳2^k步到达的祖先
  
  比如：
  fa[u][0] = u的父亲（跳2^0=1步）
  fa[u][1] = u的爷爷（跳2^1=2步）
  fa[u][2] = u的曾祖父的曾祖父（跳2^2=4步）
  
查询LCA(u, v)：
  1. 让u和v在同一深度
     - 如果depth[u] > depth[v]，让u往上跳到和v一样深
     - 用二进制拆分：比如跳13步 = 跳8步+跳4步+跳1步
  
  2. 如果u == v，说明一个是另一个的祖先，直接返回u
  
  3. 从大到小枚举k（19, 18, ..., 1, 0）
     - 如果fa[u][k] != fa[v][k]
       说明跳2^k步还没到LCA，继续跳
       u = fa[u][k], v = fa[v][k]
     - 如果fa[u][k] == fa[v][k]
       说明跳过头了，不跳
  
  4. 最后u和v的父亲就是LCA！
     return fa[u][0]

时间复杂度：
  - 预处理：O(n log n)
  - 查询：O(log n) —— 超快！
\`\`\`

**为什么倍增法这么快？**

就像二进制一样，任何数字都可以用2的幂次表示！
- 跳13步 = 8 + 4 + 1 = 2^3 + 2^2 + 2^0
- 最多只需要跳log n次

**三种方法对比：**

| 方法 | 预处理 | 查询 | 空间 | 难度 |
|------|--------|------|------|------|
| 暴力 | O(1) | O(n) | O(n) | ⭐ 简单 |
| 倍增 | O(n log n) | O(log n) | O(n log n) | ⭐⭐ 中等 |

### 1. 倍增法详解

**预处理**：

#include <iostream>
#include <vector>
using namespace std;

const int MAXN = 500005;
const int LOG = 20;

vector<int> adj[MAXN];
int depth[MAXN], fa[MAXN][LOG];
int n, q;

void dfs(int u, int f) {
    depth[u] = depth[f] + 1;
    fa[u][0] = f;
    
    for (int k = 1; k < LOG; k++) {
        fa[u][k] = fa[fa[u][k-1]][k-1];
    }
    
    for (int v : adj[u]) {
        if (v != f) {
            dfs(v, u);
        }
    }
}

int lca(int u, int v) {
    if (depth[u] < depth[v]) swap(u, v);
    
    for (int k = LOG - 1; k >= 0; k--) {
        if (depth[fa[u][k]] >= depth[v]) {
            u = fa[u][k];
        }
    }
    
    if (u == v) return u;
    
    for (int k = LOG - 1; k >= 0; k--) {
        if (fa[u][k] != fa[v][k]) {
            u = fa[u][k];
            v = fa[v][k];
        }
    }
    
    return fa[u][0];
}

int main() {

    for (int i = 1; i < n; i++) {
        int u, v;
        cin >> u >> v;
        adj[u].push_back(v);
        adj[v].push_back(u);
    }
    
    depth[0] = 0;
    dfs(1, 0);
    
    while (q--) {
        int u, v;
        cin >> u >> v;
        cout << lca(u, v) << "\\n";
    }

}

💡 **一句话记住MST**："Kruskal排序边，Prim扩展点！"`,

    derivation: `## 最小生成树的推导与实现

### 1. Kruskal算法

**贪心策略**：每次选择权值最小的边，如果不形成环就加入

**正确性证明**：
- 假设最优解不包含Kruskal选择的边e=(u,v)
- 将e加入最优解，会形成一个环
- 环上一定存在另一条边e'，权值 >= e的权值
- 用e替换e'，得到更优或相等的解，矛盾

### 2. Prim算法

**贪心策略**：从起点开始，每次选择连接已访问和未访问的最小权值边

### 3. 两种算法对比

| 算法 | 时间复杂度 | 适用场景 |
|------|-----------|---------|
| Kruskal | O(m log m) | 稀疏图（边少） |
| Prim | O(m log n) | 稠密图（边多） |`,

    code: `// 最小生成树经典应用
#include <iostream>
#include <vector>
#include <algorithm>
using namespace std;

const int MAXN = 5005;

struct Edge {
    int u, v, w;
    bool operator<(const Edge& o) const {
        return w < o.w;
    }
};

vector<Edge> edges;
int fa[MAXN];
int n, m;

int find(int x) {
    return fa[x] == x ? x : fa[x] = find(fa[x]);
}

int kruskal() {
    sort(edges.begin(), edges.end());
    int ans = 0, cnt = 0;
    
    for (int i = 1; i <= n; i++) fa[i] = i;
    
    for (auto& e : edges) {
        int fu = find(e.u), fv = find(e.v);
        if (fu != fv) {
            fa[fu] = fv;
            ans += e.w;
            cnt++;
            if (cnt == n - 1) break;
        }
    }
    
    return cnt == n - 1 ? ans : -1;
}

int main() {
    cin >> n >> m;
    
    for (int i = 0; i < m; i++) {
        int u, v, w;
        cin >> u >> v >> w;
        edges.push_back({u, v, w});
    }
    
    cout << "最小生成树权值: " << kruskal() << endl;
    
    return 0;
}

// 💡 最小生成树的精髓：贪心选择，Kruskal或Prim！`

    derivation: `## 拓扑排序的推导与实现

### 1. 算法详解

**为什么拓扑排序能工作？**

**关键观察**：DAG中一定存在入度为0的点

**证明**（反证法）：
- 假设DAG中所有点的入度都 >= 1
- 从任意点出发，沿着入边反向走
- 因为每个点都有入边，可以一直走
- 但图是有限的，一定会走到重复的点，形成环
- 这与DAG无环矛盾！

### 2. 判断是否有环

**观察**：如果拓扑排序的输出点数 < n，说明有环

### 3. 时间复杂度

| 步骤 | 时间复杂度 |
|------|-----------|
| 计算入度 | O(n + m) |

    code: `// 拓扑排序经典应用
#include <iostream>
#include <vector>
#include <queue>
using namespace std;

const int MAXN = 100005;
vector<int> adj[MAXN];
int n, m;

vector<int> topo_sort() {
    vector<int> indeg(n + 1, 0);
    
    for (int u = 1; u <= n; u++) {
        for (int v : adj[u]) {
            indeg[v]++;
        }
    }
    
    queue<int> q;
    for (int i = 1; i <= n; i++) {
        if (indeg[i] == 0) q.push(i);
    }
    
    vector<int> order;
    while (!q.empty()) {
        int u = q.front();
        q.pop();
        order.push_back(u);
        
        for (int v : adj[u]) {
            if (--indeg[v] == 0) {
                q.push(v);
            }
        }
    }
    
    return order.size() == n ? order : vector<int>();
}

int main() {
    cin >> n >> m;
    
    for (int i = 0; i < m; i++) {
        int u, v;
        cin >> u >> v;
        adj[u].push_back(v);
    }
    
    vector<int> order = topo_sort();
    
    if (order.empty()) {
        cout << "图中有环！" << endl;
    } else {
        cout << "拓扑排序: ";
        for (int u : order) {
            cout << u << " ";
        }
        cout << endl;
    }
    
    return 0;
}

💡 **一句话记住差分约束**："不等式组转化为最短路！"`,

    idea: `⚖️ **差分约束 = 不等式组转化为最短路**

**核心思想**：

对于不等式 xi - xj <= w，可以转化为：
- 从j到i连一条边，权值为w
- xi <= xj + w（三角不等式）

**求解方法**：
1. 建图：每个不等式对应一条边
2. 求最短路：从源点S到每个点的最短路就是变量的取值
3. 如果有负环，说明无解

💡 **一句话记住差分约束**："不等式变边，最短路求解！"`,

    derivation: `## 差分约束的推导与实现

### 1. 转化原理

**不等式 xi - xj <= w 的几何意义**：
- xi <= xj + w
- 这和最短路的三角不等式 dist[i] <= dist[j] + w 形式相同！

**建图方法**：
- 每个变量xi对应点i
- 每个不等式 xi - xj <= w 对应从j到i的边，权值为w
- 添加源点S，从S到所有点连边，权值为0

### 2. 常见约束类型

| 约束 | 建图 |
|------|------|
| xi - xj <= w | j -> i, 权值w |
| xi - xj >= w | i -> j, 权值-w |
| xi = xj + w | j -> i, 权值w; i -> j, 权值-w |`,

    code: `// 差分约束经典应用
#include <iostream>
#include <vector>
#include <queue>
using namespace std;

const int MAXN = 5005;
const int INF = 1e9;

struct Edge {
    int u, v, w;
};

vector<Edge> edges;
vector<int> adj[MAXN];
int n, m;

bool spfa(int S) {
    vector<int> dist(n + 1, INF);
    vector<int> cnt(n + 1, 0);
    vector<bool> inq(n + 1, false);
    
    queue<int> q;
    dist[S] = 0;
    q.push(S);
    inq[S] = true;
    
    while (!q.empty()) {
        int u = q.front();
        q.pop();
        inq[u] = false;
        
        for (int i : adj[u]) {
            Edge& e = edges[i];
            if (dist[e.v] > dist[u] + e.w) {
                dist[e.v] = dist[u] + e.w;
                cnt[e.v] = cnt[u] + 1;
                if (cnt[e.v] >= n) return false;
                if (!inq[e.v]) {
                    q.push(e.v);
                    inq[e.v] = true;
                }
            }
        }
    }
    
    return true;
}

int main() {
    cin >> n >> m;
    
    for (int i = 0; i < m; i++) {
        int u, v, w;
        cin >> u >> v >> w;
        edges.push_back({u, v, w});
        adj[u].push_back(edges.size() - 1);
    }
    
    for (int i = 1; i <= n; i++) {
        edges.push_back({0, i, 0});
        adj[0].push_back(edges.size() - 1);
    }
    
    if (spfa(0)) {
        cout << "有解！" << endl;
    } else {
        cout << "无解（有负环）！" << endl;
    }
    
    return 0;
}

### 1. Tarjan算法求强连通分量

**核心思想**：
- 用DFS遍历图
- 维护dfn[u]（访问顺序）和low[u]（能回到的最早祖先）
- 当low[u] == dfn[u]时，找到一个强连通分量

**算法步骤**：
\`\`\`cpp
void tarjan(int u) {
    dfn[u] = low[u] = ++timer;
    stk.push(u);
    
    for (int v : adj[u]) {
        if (!dfn[v]) {
            tarjan(v);
            low[u] = min(low[u], low[v]);
        } else if (in_stack[v]) {
            low[u] = min(low[u], dfn[v]);
        }
    }
    
    if (dfn[u] == low[u]) {
        // 找到一个强连通分量
        while (true) {
            int v = stk.top();
            stk.pop();
            in_stack[v] = false;
            scc[v] = scc_cnt;
            if (u == v) break;
        }
        scc_cnt++;
    }
}
\`\`\`

### 2. 割点判断

**判断条件**：
- 对于节点u，如果存在子节点v使得 low[v] >= dfn[u]
- 且u不是根节点，或者u有多个子节点
- 则u是割点

### 3. 桥判断

**判断条件**：
- 对于边(u, v)，如果 low[v] > dfn[u]
- 则(u, v)是桥

### 4. 时间复杂度

| 算法 | 时间复杂度 |
|------|-----------|
| Tarjan | O(n + m) |
| 割点 | O(n + m) |
| 桥 | O(n + m) |`,

    code: `// 连通性经典应用
#include <iostream>
#include <vector>
using namespace std;

const int MAXN = 100005;
vector<int> adj[MAXN];
int dfn[MAXN], low[MAXN], timer = 0;
int stk[MAXN], top = 0;
bool in_stack[MAXN];
int scc[MAXN], scc_cnt = 0;
int n, m;

void tarjan(int u) {
    dfn[u] = low[u] = ++timer;
    stk[++top] = u;
    in_stack[u] = true;
    
    for (int v : adj[u]) {
        if (!dfn[v]) {
            tarjan(v);
            low[u] = min(low[u], low[v]);
        } else if (in_stack[v]) {
            low[u] = min(low[u], dfn[v]);
        }
    }
    
    if (dfn[u] == low[u]) {
        scc_cnt++;
        while (true) {
            int v = stk[top--];
            in_stack[v] = false;
            scc[v] = scc_cnt;
            if (u == v) break;
        }
    }
}

int main() {
    cin >> n >> m;
    
    for (int i = 0; i < m; i++) {
        int u, v;
        cin >> u >> v;
        adj[u].push_back(v);
    }
    
    for (int i = 1; i <= n; i++) {
        if (!dfn[i]) tarjan(i);
    }
    
    cout << "强连通分量个数: " << scc_cnt << endl;
    
    return 0;
}

### 1. 匈牙利算法

**核心思想**：

- 找到增广路后，将路径上的边取反（匹配变非匹配，非匹配变匹配）

**算法步骤**：
\`\`\`cpp
bool dfs(int u) {
    for (int v : adj[u]) {
        if (!vis[v]) {
            vis[v] = true;
            if (!match[v] || dfs(match[v])) {
                match[v] = u;
                return true;
            }
        }
    }
    return false;
}

int hungarian() {
    int ans = 0;
    for (int i = 1; i <= n; i++) {
        memset(vis, false, sizeof(vis));
        if (dfs(i)) ans++;
    }
    return ans;
}

💡 **一句话记住2-SAT**："建图 + Tarjan，O(n+m)搞定！"`,

    derivation: `## 2-SAT的推导与实现

### 1. 建图方法

**对于子句 (a ∨ b)**：
- 等价于 ¬a → b 和 ¬b → a
- 如果a为假，则b必须为真
- 如果b为假，则a必须为真

**变量表示**：
- 变量x_i用节点2i表示
- ¬x_i用节点2i+1表示

### 2. 求解算法

**步骤**：
1. 建图：每个子句转化为两条有向边
2. 求强连通分量（Tarjan算法）
3. 检查：如果x_i和¬x_i在同一个强连通分量，则无解
4. 赋值：按拓扑序给变量赋值

### 3. 时间复杂度

| 步骤 | 时间复杂度 |
|------|-----------|
| 建图 | O(n + m) |
| Tarjan | O(n + m) |
| 总计 | O(n + m) |`,

    code: `// 2-SAT经典应用
#include <iostream>
#include <vector>
using namespace std;

const int MAXN = 2000005;
vector<int> adj[MAXN];
int dfn[MAXN], low[MAXN], timer = 0;
int stk[MAXN], top = 0;
bool in_stack[MAXN];
int scc[MAXN], scc_cnt = 0;
int n, m;

void tarjan(int u) {
    dfn[u] = low[u] = ++timer;
    stk[++top] = u;
    in_stack[u] = true;
    
    for (int v : adj[u]) {
        if (!dfn[v]) {
            tarjan(v);
            low[u] = min(low[u], low[v]);
        } else if (in_stack[v]) {
            low[u] = min(low[u], dfn[v]);
        }
    }
    
    if (dfn[u] == low[u]) {
        scc_cnt++;
        while (true) {
            int v = stk[top--];
            in_stack[v] = false;
            scc[v] = scc_cnt;
            if (u == v) break;
        }
    }
}

int main() {
    cin >> n >> m;
    
    for (int i = 0; i < m; i++) {
        int u, v, fu, fv;
        cin >> u >> fu >> v >> fv;
        // (xu ∨ xv) 转化为 ¬xu -> xv 和 ¬xv -> xu
        adj[2 * u + !fu].push_back(2 * v + fv);
        adj[2 * v + !fv].push_back(2 * u + fu);
    }
    
    for (int i = 0; i < 2 * n; i++) {
        if (!dfn[i]) tarjan(i);
    }
    
    for (int i = 0; i < n; i++) {
        if (scc[2 * i] == scc[2 * i + 1]) {
            cout << "无解！" << endl;
            return 0;
        }
    }
    
    cout << "有解！" << endl;
    for (int i = 0; i < n; i++) {
        cout << (scc[2 * i] > scc[2 * i + 1] ? 1 : 0) << " ";
    }
    cout << endl;
    
    return 0;
}

// 💡 2-SAT的精髓：建图 + Tarjan，O(n+m)搞定！`

    code: `// 虚树经典应用
#include <iostream>
#include <vector>
#include <algorithm>
using namespace std;

const int MAXN = 100005;
const int LOG = 20;

vector<int> adj[MAXN];
int depth[MAXN], fa[MAXN][LOG], dfn[MAXN], timer = 0;
int n, q;
vector<int> key_points;
vector<int> virtual_adj[MAXN];

void dfs(int u, int f) {
    depth[u] = depth[f] + 1;
    fa[u][0] = f;
    dfn[u] = ++timer;
    
    for (int k = 1; k < LOG; k++) {
        fa[u][k] = fa[fa[u][k-1]][k-1];
    }
    
    for (int v : adj[u]) {
        if (v != f) {
            dfs(v, u);
        }
    }
}

int LCA(int u, int v) {
    if (depth[u] < depth[v]) swap(u, v);
    
    for (int k = LOG - 1; k >= 0; k--) {
        if (depth[fa[u][k]] >= depth[v]) {
            u = fa[u][k];
        }
    }
    
    if (u == v) return u;
    
    for (int k = LOG - 1; k >= 0; k--) {
        if (fa[u][k] != fa[v][k]) {
            u = fa[u][k];
            v = fa[v][k];
        }
    }
    
    return fa[u][0];
}

void build_virtual_tree() {
    sort(key_points.begin(), key_points.end(), [](int a, int b) {
        return dfn[a] < dfn[b];
    });
    
    vector<int> stk;
    for (int u : key_points) {
        if (stk.empty()) {
            stk.push_back(u);
            continue;
        }
        
        int lca = LCA(u, stk.back());
        
        while (stk.size() >= 2 && depth[stk[stk.size()-2]] >= depth[lca]) {
            virtual_adj[stk[stk.size()-2]].push_back(stk.back());
            stk.pop_back();
        }
        
        if (stk.back() != lca) {
            virtual_adj[lca].push_back(stk.back());
            stk.pop_back();
            if (stk.empty() || stk.back() != lca) {
                stk.push_back(lca);
            }
        }
        
        stk.push_back(u);
    }
    
    while (stk.size() >= 2) {
        virtual_adj[stk[stk.size()-2]].push_back(stk.back());
        stk.pop_back();
    }
}

int main() {
    cin >> n >> q;
    
    for (int i = 1; i < n; i++) {
        int u, v;
        cin >> u >> v;
        adj[u].push_back(v);
        adj[v].push_back(u);
    }
    
    depth[0] = 0;
    dfs(1, 0);
    
    for (int i = 0; i < q; i++) {
        int u;
        cin >> u;
        key_points.push_back(u);
    }
    
    build_virtual_tree();
    
    cout << "虚树构建完成！" << endl;
    
    return 0;
}

// 💡 虚树的精髓：排序+LCA+单调栈，O(k log k)构建！`

💡 **一句话记住Matrix Tree定理**："用矩阵计算生成树个数！"`,

    idea: `📐 **Matrix Tree定理 = 用矩阵计算生成树个数**

**核心思想**：

**算法步骤**：
\`\`\`
1. 构造度数矩阵D：D[i][i] = 节点i的度数
2. 构造邻接矩阵A：A[i][j] = i和j之间的边数
3. 构造拉普拉斯矩阵L = D - A
4. 删除L的任意一行一列，得到L'
5. 计算det(L')，就是生成树个数
\`\`\`

**时间复杂度**：O(n^3)（高斯消元）

💡 **一句话记住Matrix Tree定理**："L = D - A，det(L') = 生成树个数！"`,

    derivation: `## Matrix Tree定理的推导与实现

### 1. 算法详解

**拉普拉斯矩阵**：
- L = D - A
- D是度数矩阵（对角矩阵）
- A是邻接矩阵

**定理**：
- 删除L的任意一行一列，得到L'
- det(L') = 生成树个数

**为什么正确？**
- 这是图论中的经典定理
- 证明涉及代数图论和矩阵理论

### 2. 实现细节

**高斯消元求行列式**：
\`\`\`cpp
double det(vector<vector<double>>& mat, int n) {
    double res = 1;
    
    for (int i = 0; i < n; i++) {
        // 找主元
        int pivot = i;
        for (int j = i + 1; j < n; j++) {
            if (abs(mat[j][i]) > abs(mat[pivot][i])) {
                pivot = j;
            }
        }
        
        if (abs(mat[pivot][i]) < 1e-9) return 0;
        
        swap(mat[i], mat[pivot]);
        if (i != pivot) res = -res;
        
        res *= mat[i][i];
        
        for (int j = i + 1; j < n; j++) {
            double factor = mat[j][i] / mat[i][i];
            for (int k = i; k < n; k++) {
                mat[j][k] -= factor * mat[i][k];
            }
        }
    }
    
    return res;
}
\`\`\`

### 3. 时间复杂度

| 步骤 | 时间复杂度 |
|------|-----------|
| 构造矩阵 | O(n^2) |
| 高斯消元 | O(n^3) |
| 总计 | O(n^3) |`,

    code: `// Matrix Tree定理经典应用
#include <iostream>
#include <vector>
#include <cmath>
using namespace std;

const int MAXN = 105;
int degree[MAXN];
int adj_matrix[MAXN][MAXN];
double L[MAXN][MAXN];
int n, m;

double det(vector<vector<double>>& mat, int n) {
    double res = 1;
    
    for (int i = 0; i < n; i++) {
        int pivot = i;
        for (int j = i + 1; j < n; j++) {
            if (abs(mat[j][i]) > abs(mat[pivot][i])) {
                pivot = j;
            }
        }
        
        if (abs(mat[pivot][i]) < 1e-9) return 0;
        
        swap(mat[i], mat[pivot]);
        if (i != pivot) res = -res;
        
        res *= mat[i][i];
        
        for (int j = i + 1; j < n; j++) {
            double factor = mat[j][i] / mat[i][i];
            for (int k = i; k < n; k++) {
                mat[j][k] -= factor * mat[i][k];
            }
        }
    }
    
    return res;
}

int main() {
    cin >> n >> m;
    
    for (int i = 0; i < m; i++) {
        int u, v;
        cin >> u >> v;
        degree[u]++;
        degree[v]++;
        adj_matrix[u][v]++;
        adj_matrix[v][u]++;
    }
    
    // 构造拉普拉斯矩阵
    for (int i = 1; i <= n; i++) {
        L[i][i] = degree[i];
        for (int j = 1; j <= n; j++) {
            if (i != j) {
                L[i][j] = -adj_matrix[i][j];
            }
        }
    }
    
    // 删除第n行第n列
    vector<vector<double>> mat(n - 1, vector<double>(n - 1));
    for (int i = 1; i < n; i++) {
        for (int j = 1; j < n; j++) {
            mat[i-1][j-1] = L[i][j];
        }
    }
    
    double ans = det(mat, n - 1);
    cout << "生成树个数: " << round(ans) << endl;
    
    return 0;
}

// 💡 Matrix Tree定理的精髓：L = D - A，det(L') = 生成树个数！`

### 1. 算法详解

**什么是对踵点？**
- 凸包上的两个点，存在两条平行线分别经过这两个点，且凸包在两条线之间
- 这两个点就是对踵点

**为什么旋转卡壳有效？**
- 凸包的直径一定在某对对踵点上
- 旋转卡壳可以枚举所有对踵点
- 每次旋转角度最小，保证不遗漏

### 2. 实现细节

\`\`\`cpp
double rotating_calipers(vector<Point>& hull) {
    int n = hull.size();
    if (n == 2) return dist(hull[0], hull[1]);
    
    int i = 0, j = 0;
    // 找到最上面的点和最下面的点
    for (int k = 0; k < n; k++) {
        if (hull[k].y < hull[i].y) i = k;
        if (hull[k].y > hull[j].y) j = k;
    }
    
    double ans = 0;
    int si = i, sj = j;
    
    while (i != sj || j != si) {
        ans = max(ans, dist(hull[i], hull[j]));
        
        // 计算旋转角度
        double angle_i = cross(hull[(i+1)%n] - hull[i], hull[j] - hull[i]);
        double angle_j = cross(hull[(j+1)%n] - hull[j], hull[i] - hull[j]);
        
        if (angle_i > angle_j) {
            i = (i + 1) % n;
        } else {
            j = (j + 1) % n;
        }
    }
    
    return ans;
}
\`\`\`

- ✅ 最小面积外接矩形
- ✅ 合并凸包

    code: `// 旋转卡壳经典应用
#include <iostream>
#include <vector>
#include <algorithm>
#include <cmath>
using namespace std;

struct Point {
    double x, y;
    Point operator-(const Point& o) const { return {x - o.x, y - o.y}; }
};

double cross(Point a, Point b) {
    return a.x * b.y - a.y * b.x;
}

double dist(Point a, Point b) {
    return sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y));
}

vector<Point> convex_hull(vector<Point>& pts) {
    int n = pts.size();
    sort(pts.begin(), pts.end(), [](const Point& a, const Point& b) {
        return a.x < b.x || (a.x == b.x && a.y < b.y);
    });
    
    vector<Point> hull(2 * n);
    int k = 0;
    
    for (int i = 0; i < n; i++) {
        while (k >= 2 && cross(hull[k-1] - hull[k-2], pts[i] - hull[k-2]) <= 0) k--;
        hull[k++] = pts[i];
    }
    
    for (int i = n - 2, t = k + 1; i >= 0; i--) {
        while (k >= t && cross(hull[k-1] - hull[k-2], pts[i] - hull[k-2]) <= 0) k--;
        hull[k++] = pts[i];
    }
    
    hull.resize(k - 1);
    return hull;
}

double rotating_calipers(vector<Point>& hull) {
    int n = hull.size();
    if (n == 2) return dist(hull[0], hull[1]);
    
    int i = 0, j = 0;
    for (int k = 0; k < n; k++) {
        if (hull[k].y < hull[i].y) i = k;
        if (hull[k].y > hull[j].y) j = k;
    }
    
    double ans = 0;
    int si = i, sj = j;
    
    while (i != sj || j != si) {
        ans = max(ans, dist(hull[i], hull[j]));
        
        double angle_i = cross(hull[(i+1)%n] - hull[i], hull[j] - hull[i]);
        double angle_j = cross(hull[(j+1)%n] - hull[j], hull[i] - hull[j]);
        
        if (angle_i > angle_j) {
            i = (i + 1) % n;
        } else {
            j = (j + 1) % n;
        }
    }
    
    return ans;
}

int main() {
    int n;
    cin >> n;
    
    vector<Point> pts(n);
    for (int i = 0; i < n; i++) {
        cin >> pts[i].x >> pts[i].y;
    }
    
    vector<Point> hull = convex_hull(pts);
    double diameter = rotating_calipers(hull);
    
    cout << "凸包直径: " << diameter << endl;
    
    return 0;
}

// 💡 旋转卡壳的精髓：平行线旋转，O(n)找最远点对！`

### 1. 算法详解

**什么是半平面？**
- 一条直线将平面分成两部分，每部分就是一个半平面
- 例如：y > 0 表示x轴上方的半平面

**增量法思想**：
- 按极角排序所有半平面
- 用双端队列维护当前的交集

### 2. 实现细节

\`\`\`cpp
struct Line {
    Point p, v;
    double ang;
    
    Line(Point p, Point v) : p(p), v(v) {
        ang = atan2(v.y, v.x);
    }
    
    bool operator<(const Line& o) const {
        return ang < o.ang;
    }
};

bool on_left(Line l, Point p) {
    return cross(l.v, p - l.p) > 0;
}

Point intersection(Line a, Line b) {
    // 求两条直线的交点
    double t = cross(b.p - a.p, b.v) / cross(a.v, b.v);
    return a.p + a.v * t;
}

vector<Point> half_plane_intersection(vector<Line>& lines) {
    sort(lines.begin(), lines.end());
    
    deque<Line> q;
    deque<Point> p;
    
    for (auto& l : lines) {
        while (q.size() > 1 && !on_left(l, p.back())) {
            q.pop_back();
            p.pop_back();
        }
        while (q.size() > 1 && !on_left(l, p.front())) {
            q.pop_front();
            p.pop_front();
        }
        
        if (q.size() == 1) {
            p.push_back(intersection(q.back(), l));
        } else if (cross(q.back().v, l.v) > 1e-8) {
            p.push_back(intersection(q.back(), l));
        }
        
        q.push_back(l);
    }
    
    while (q.size() > 1 && !on_left(q.front(), p.back())) {
        q.pop_back();
        p.pop_back();
    }
    
    if (q.size() < 3) return {};
    
    p.push_back(intersection(q.back(), q.front()));
    return vector<Point>(p.begin(), p.end());
}

### 1. 算法详解

**为什么CDQ分治有效？**
- 第一维排序后，左半部分的x一定小于右半部分
- 只需要考虑y的偏序关系
- 用树状数组维护y的偏序

### 2. 实现细节

\`\`\`cpp
void cdq(int L, int R) {
    if (L == R) return;
    
    int mid = (L + R) / 2;
    cdq(L, mid);
    cdq(mid + 1, R);
    
    // 处理左半部分对右半部分的影响
    int i = L, j = mid + 1;
    vector<Point> tmp;
    
    while (i <= mid && j <= R) {
        if (pts[i].y <= pts[j].y) {
            add(pts[i].y, 1);
            tmp.push_back(pts[i++]);
        } else {
            ans[pts[j].id] += query(pts[j].y);
            tmp.push_back(pts[j++]);
        }
    }
    
    while (j <= R) {
        ans[pts[j].id] += query(pts[j].y);
        tmp.push_back(pts[j++]);
    }
    
    // 清空树状数组
    for (int k = L; k < i; k++) {
        add(pts[k].y, -1);
    }
    
    // 合并
    for (int k = L; k <= R; k++) {
        pts[k] = tmp[k - L];
    }
}

### 一、质数的定义

质数就是**只有1和它本身两个因数**的自然数（大于1）。比如 2, 3, 5, 7, 11... 而像 4=2×2, 6=2×3 这种有其他因数的叫**合数**。

> 🎯 比喻：质数就像乐高积木中的"基础块"，所有合数都可以用质数"拼"出来！

### 二、试除法判定质数

最朴素的想法：从 2 试到 n-1，看有没有能整除 n 的。

**优化**：如果 n 有因数，那一定有一个因数 ≤ √n。所以只需要试到 √n 就够了！

> 🧠 为什么？因为如果 a×b=n，且 a>√n, b>√n，那 a×b > n，矛盾！

### 三、埃氏筛法（Eratosthenes筛）

想象你有一张1~N的数表：
1. 从2开始，2是质数 ✅
2. 把2的所有倍数（4,6,8...）全部划掉 ❌
3. 下一个没被划掉的是3，3是质数 ✅
4. 划掉3的所有倍数（6,9,12...）
5. 重复...

> 🎯 比喻：像筛沙子一样，把"合数沙子"筛掉，留下的就是"质数金子"！

### 四、线性筛（欧拉筛）

埃氏筛的问题是：有些数会被重复筛掉（比如6被2筛一次，又被3筛一次）。**线性筛**保证每个合数只被筛一次，时间复杂度 O(N)！

\`\`\`

const int MAXN = 10000005;
bool not_prime[MAXN];  // not_prime[i]=true 表示 i 是合数
int primes[MAXN];      // 存所有质数
int cnt = 0;

void eratosthenes(int n) {
    not_prime[0] = not_prime[1] = true;  // 0和1不是质数
    for (int i = 2; i <= n; i++) {
        if (!not_prime[i]) {             // i是质数
            primes[cnt++] = i;
            for (int j = i * 2; j <= n; j += i)
                not_prime[j] = true;     // 划掉i的倍数
        }
    }
}
\`\`\`

**复杂度分析**：每个质数 p 会筛掉 N/p 个数，总操作数 = N/2 + N/3 + N/5 + ... ≈ N·log(log(N))。

### 一、辗转相除法（欧几里得算法）

求 GCD 最经典的方法！

> 🎯 比喻：想象两个小朋友分糖果。a 颗糖和 b 颗糖，每次用多的减少的，直到一样多——那个数就是GCD！

核心公式：\`gcd(a, b) = gcd(b, a % b)\`

为什么？因为 a = q×b + r，a和b的公约数一定也是b和r的公约数！

### 二、LCM 的求法

有个超美的公式：

\`lcm(a, b) = a × b / gcd(a, b)\`

> 🧠 直觉：a×b 把所有因子都乘了一遍，但公共部分被算了两次，除以gcd就去重了。

### 三、扩展欧几里得算法（exGCD）

普通GCD只告诉你gcd是多少，**扩展欧几里得**还能告诉你：存在整数 x, y 使得：

\`a·x + b·y = gcd(a, b)\`

> 🎯 比喻：就像说"我可以用a步和b步的组合，走出gcd步的距离"。

    derivation: `## 📐 推导与实现

### 一、欧几里得算法

**定理**：gcd(a, b) = gcd(b, a mod b)

**证明**：设 a = qb + r（r = a mod b）
- 若 d|a 且 d|b，则 d|(a - qb) = d|r
- 所以 a,b 的公因子也是 b,r 的公因子，反之亦然
- 因此 gcd(a,b) = gcd(b,r)

**代码**：
\`\`\`
int gcd(int a, int b) {
    return b == 0 ? a : gcd(b, a % b);
}
\`\`\`

**时间复杂度**：O(log(min(a,b)))，和斐波那契数列有关（最坏情况是相邻斐波那契数）。

### 二、LCM

\`\`\`
long long lcm(long long a, long long b) {
    return a / gcd(a, b) * b;  // 先除后乘，防溢出！
}
\`\`\`

### 三、扩展欧几里得

**目标**：求 x, y 使得 ax + by = gcd(a,b)

**推导**（递归）：
1. 当 b=0 时，gcd=a，显然 x=1, y=0
2. 否则，递归求 gcd(b, a%b) 的解 x', y'：
   - b·x' + (a%b)·y' = gcd
   - 因为 a%b = a - (a/b)·b
   - 代入：b·x' + (a - (a/b)·b)·y' = gcd
   - 整理：a·y' + b·(x' - (a/b)·y') = gcd
   - 所以 x = y', y = x' - (a/b)·y'

\`\`\`
int exgcd(int a, int b, int &x, int &y) {
    if (b == 0) {
        x = 1; y = 0;
        return a;
    }
    int g = exgcd(b, a % b, x, y);
    int tmp = x;
    x = y;
    y = tmp - (a / b) * y;
    return g;
}

|------|------|--------|
| gcd | 求最大公约数 | O(log n) |

#include <bits/stdc++.h>
using namespace std;

// 辗转相除法求GCD
int gcd(int a, int b) {
    return b == 0 ? a : gcd(b, a % b);
}

// 求LCM（注意先除后乘防溢出）
long long lcm(long long a, long long b) {
    return a / gcd(a, b) * b;
}

// 扩展欧几里得
// 返回gcd(a,b)，同时求出x,y使得 a*x + b*y = gcd(a,b)
int exgcd(int a, int b, int &x, int &y) {
    if (b == 0) {
        x = 1;
        y = 0;
        return a;
    }
    int g = exgcd(b, a % b, x, y);
    int tmp = x;
    x = y;
    y = tmp - (a / b) * y;
    return g;
}

// 应用：解方程 ax ≡ 1 (mod m)，即求a模m的逆元
// 前提：gcd(a, m) = 1
int modInverse(int a, int m) {
    int x, y;
    int g = exgcd(a, m, x, y);
    if (g != 1) return -1;  // 逆元不存在
    return (x % m + m) % m;  // 保证结果在[0, m)
}

int main() {
    int a, b;
    cin >> a >> b;
    cout << "GCD = " << gcd(a, b) << endl;
    cout << "LCM = " << lcm(a, b) << endl;
    
    int x, y;
    int g = exgcd(a, b, x, y);
    cout << g << " = " << a << "*" << x << " + " << b << "*" << y << endl;
    return 0;
}`

### 这是什么问题？

想象你站在一个钟面上，钟面有 n 个刻度（0 到 n-1）。你想知道：**有多少个刻度和 n 是"互质"的？** 也就是说，这些刻度数和 n 的最大公约数是1。

这个计数函数就叫**欧拉函数 φ(n)**！

比如 φ(12) = 4，因为 1~12 中和12互质的数只有 1, 5, 7, 11。

欧拉函数是数论中的"瑞士军刀"——从欧拉定理到RSA加密，从快速幂优化到莫比乌斯反演，到处都有它的身影！

核心问题：
1. 求单个 φ(n)
2. 线性筛求 1~N 的所有 φ(i)`,

    idea: `## 💡 算法思想

### 一、欧拉函数的定义

φ(n) = 1~n 中与 n 互质的数的个数。

> 🎯 比喻：把1~n想象成n个小朋友，φ(n)就是其中和n"合不来"（互质）的小朋友数量。

### 二、通项公式

如果 n 的质因数分解为 n = p₁^a₁ · p₂^a₂ · ... · pₖ^aₖ，则：

φ(n) = n · (1 - 1/p₁) · (1 - 1/p₂) · ... · (1 - 1/pₖ)

> 🧠 直觉：从n个数中，去掉p₁的倍数（占1/p₁），去掉p₂的倍数（占1/p₂）...用容斥的思想。

### 三、性质

1. **积性函数**：若 gcd(a,b)=1，则 φ(ab) = φ(a)·φ(b)
2. **质数的φ**：φ(p) = p-1（质数和所有比它小的数都互质）
3. **质数幂的φ**：φ(p^k) = p^k - p^(k-1) = p^(k-1)·(p-1)
4. **欧拉定理**：若 gcd(a,n)=1，则 a^φ(n) ≡ 1 (mod n)
5. **费马小定理**：当n是质数时，a^(n-1) ≡ 1 (mod n)

### 四、线性筛求欧拉函数

和线性筛素数类似，利用积性函数的性质，可以在 O(N) 内求出 1~N 的所有 φ 值。`,

    derivation: `## 📐 推导与实现

### 一、通项公式推导

**目标**：φ(n) = n · ∏(1 - 1/pᵢ)

**用容斥原理**：
- 1~n 中 p₁ 的倍数有 n/p₁ 个
- p₂ 的倍数有 n/p₂ 个
- p₁p₂ 的倍数有 n/(p₁p₂) 个
- ...

由容斥：与n不互质的数 = n/p₁ + n/p₂ + ... - n/(p₁p₂) - ...
与n互质的数 = n - (与n不互质的数) = n·∏(1 - 1/pᵢ)

### 二、单个φ(n)的计算 O(√n)

\`\`\`
int euler_phi(int n) {
    int res = n;
    for (int i = 2; i * i <= n; i++) {
        if (n % i == 0) {
            res = res / i * (i - 1);  // res *= (1 - 1/i)
            while (n % i == 0) n /= i; // 除尽i
        }
    }
    if (n > 1) res = res / n * (n - 1);  // 剩余的大质因子
    return res;
}
\`\`\`

### 三、线性筛求φ O(N)

利用积性函数性质：
1. φ(1) = 1
2. 若 p 是质数：φ(p) = p-1
3. 若 i % p == 0（p是i的质因子）：φ(i·p) = φ(i)·p
4. 若 i % p != 0：φ(i·p) = φ(i)·(p-1)

\`\`\`
int phi[MAXN];
int primes[MAXN], cnt = 0;
bool not_prime[MAXN];

void euler_sieve(int n) {
    phi[1] = 1;
    for (int i = 2; i <= n; i++) {
        if (!not_prime[i]) {
            primes[cnt++] = i;
            phi[i] = i - 1;  // 质数的φ
        }
        for (int j = 0; j < cnt && i * primes[j] <= n; j++) {
            not_prime[i * primes[j]] = true;
            if (i % primes[j] == 0) {
                phi[i * primes[j]] = phi[i] * primes[j];
                break;
            } else {
                phi[i * primes[j]] = phi[i] * (primes[j] - 1);
            }
        }
    }
}
\`\`\`

**关键理解**：
- i % p == 0 时，p 已经是 i 的质因子，i·p 只是多了一个 p 的幂次
- φ(i·p) = i·p · ∏(1-1/q) = p · (i · ∏(1-1/q)) = p · φ(i)
- i % p != 0 时，p 是新的质因子，由积性函数：φ(i·p) = φ(i)·φ(p) = φ(i)·(p-1)

| 方法 | 复杂度 | 适用场景 |
|------|--------|---------|
| 通项公式 | O(√n) | 单个n |
| 线性筛 | O(N) | 批量求1~N |`,
