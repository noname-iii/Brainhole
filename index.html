<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OI 练习助手 - 算法学习之旅</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/lesson.css">
    <link rel="stylesheet" href="css/ai-chat.css">
    <!-- 第三方库 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- 顶部导航栏 -->
        <header id="header">
            <div class="header-left">
                <span class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="6"></circle>
                        <circle cx="12" cy="12" r="2"></circle>
                    </svg>
                </span>
                <h1 class="logo-text">OI 练习助手</h1>
            </div>
            <div class="header-center">
                <div class="global-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="globalProgress"></div>
                    </div>
                    <span class="progress-text" id="globalProgressText">0%</span>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="btnStats" title="学习统计">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                </button>
                <button class="icon-btn" id="btnSettings" title="设置">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 主内容区域 -->
        <div id="mainContent">
            <!-- 地图视图 -->
            <div id="mapView" class="view active">
                <div class="map-container" id="mapContainer">
                    <!-- 章节地图由 JS 动态生成 -->
                </div>
            </div>

            <!-- 课程视图 -->
            <div id="lessonView" class="view">
                <div class="lesson-header">
                    <button class="btn-back" id="btnBack" style="display:none;">← 返回地图</button>
                    <h2 id="lessonTitle"></h2>
                </div>
                <div class="lesson-content" id="lessonContent">
                    <!-- 课程内容将由 JS 动态生成 -->
                </div>
            </div>
        </div>

        <!-- AI 助手浮动按钮 -->
        <button class="ai-fab" id="aiFab" title="AI 助手">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                <circle cx="12" cy="5" r="2"></circle>
                <path d="M12 7v4"></path>
                <line x1="8" y1="16" x2="8" y2="16"></line>
                <line x1="16" y1="16" x2="16" y2="16"></line>
            </svg>
        </button>

        <!-- AI 助手面板 -->
        <div class="ai-panel" id="aiPanel">
            <div class="ai-panel-header">
                <h3>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                        <circle cx="12" cy="5" r="2"></circle>
                        <path d="M12 7v4"></path>
                        <line x1="8" y1="16" x2="8" y2="16"></line>
                        <line x1="16" y1="16" x2="16" y2="16"></line>
                    </svg>
                    AI 学习助手
                </h3>
                <button class="btn-close" id="aiClose">×</button>
            </div>
            <div class="ai-panel-body" id="aiMessages">
                <div class="ai-welcome">
                    <p>你好！我是你的 OI 学习助手</p>
                    <p>有任何问题都可以问我哦！</p>
                </div>
            </div>
            <div class="ai-panel-footer">
                <textarea id="aiInput" placeholder="输入你的问题..." rows="3"></textarea>
                <button class="btn-send" id="aiSend">发送</button>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div class="modal" id="settingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>设置</h3>
                    <button class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>AI 昵称</label>
                        <input type="text" id="settingAiName" placeholder="给 AI 助手起个名字（如：小智）">
                    </div>
                    <div class="form-group">
                        <label>AI 服务商</label>
                        <select id="settingProvider">
                            <option value="openai">OpenAI</option>
                            <option value="anthropic">Anthropic (Claude)</option>
                            <option value="google">Google (Gemini)</option>
                            <option value="deepseek">DeepSeek</option>
                            <option value="zhipu">智谱 AI (GLM)</option>
                            <option value="qwen">通义千问 (Qwen)</option>
                            <option value="baidu">百度文心一言</option>
                            <option value="moonshot">月之暗面 (Kimi)</option>
                            <option value="yi">零一万物 (Yi)</option>
                            <option value="minimax">MiniMax</option>
                            <option value="siliconflow">硅基流动 (SiliconFlow)</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>API 密钥</label>
                        <input type="password" id="settingApiKey" placeholder="输入你的 API Key">
                    </div>
                    <div class="form-group">
                        <label>模型</label>
                        <select id="settingModel">
                            <option value="">请先选择服务商</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>洛谷用户名</label>
                        <input type="text" id="settingLuoguUser" placeholder="用于提交代码">
                    </div>
                    <div class="form-group">
                        <label>主题色</label>
                        <div class="color-picker-row">
                            <input type="color" id="settingThemeColor" value="#6366f1">
                            <span class="color-hex" id="settingThemeHex">#6366f1</span>
                            <button type="button" class="btn-reset-color" id="btnResetColor">恢复默认</button>
                        </div>
                    </div>
                    <button class="btn-primary" id="btnSaveSettings">保存设置</button>
                </div>
            </div>
        </div>

        <!-- 统计弹窗 -->
        <div class="modal" id="statsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;margin-right:8px;">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="14"></line>
                        </svg>
                        学习统计
                    </h3>
                    <button class="modal-close">×</button>
                </div>
                <div class="modal-body" id="statsBody">
                    <!-- 统计数据将由 JS 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本加载 -->
    <script src="js/data.js"></script>
    <script src="js/content.js"></script>
    <script src="js/missing_part6.js"></script>
    <script src="js/missing_part7.js"></script>
    <script src="js/missing_part8_10.js"></script>

    <script src="js/storage.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/luogu.js"></script>
    <script src="js/map.js"></script>
    <script src="js/lesson.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
