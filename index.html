<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OI 练习助手 - 算法学习之旅</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/lesson.css">
    <link rel="stylesheet" href="css/ai-chat.css">
    <!-- 第三方库 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- 顶部导航栏 -->
        <header id="header">
            <div class="header-left">
                <span class="logo-icon">🎯</span>
                <h1 class="logo-text">OI 练习助手</h1>
            </div>
            <div class="header-center">
                <div class="global-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="globalProgress"></div>
                    </div>
                    <span class="progress-text" id="globalProgressText">0%</span>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="btnStats" title="学习统计">📊</button>
                <button class="icon-btn" id="btnSettings" title="设置">⚙️</button>
            </div>
        </header>

        <!-- 主内容区域 -->
        <div id="mainContent">
            <!-- 地图视图 -->
            <div id="mapView" class="view active">
                <div class="map-container" id="mapContainer">
                    <!-- 章节地图由 JS 动态生成 -->
                </div>
            </div>

            <!-- 课程视图 -->
            <div id="lessonView" class="view">
                <div class="lesson-header">
                    <button class="btn-back" id="btnBack" style="display:none;">← 返回地图</button>
                    <h2 id="lessonTitle"></h2>
                </div>
                <div class="lesson-content" id="lessonContent">
                    <!-- 课程内容将由 JS 动态生成 -->
                </div>
            </div>
        </div>

        <!-- AI 助手浮动按钮 -->
        <button class="ai-fab" id="aiFab" title="AI 助手">🤖</button>

        <!-- AI 助手面板 -->
        <div class="ai-panel" id="aiPanel">
            <div class="ai-panel-header">
                <h3>🤖 AI 学习助手</h3>
                <button class="btn-close" id="aiClose">×</button>
            </div>
            <div class="ai-panel-body" id="aiMessages">
                <div class="ai-welcome">
                    <p>你好！我是你的 OI 学习助手 👋</p>
                    <p>有任何问题都可以问我哦！</p>
                </div>
            </div>
            <div class="ai-panel-footer">
                <textarea id="aiInput" placeholder="输入你的问题..." rows="3"></textarea>
                <button class="btn-send" id="aiSend">发送</button>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div class="modal" id="settingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>⚙️ 设置</h3>
                    <button class="modal-close">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>AI API 地址</label>
                        <input type="text" id="settingApiUrl" placeholder="例如：https://api.openai.com/v1/chat/completions">
                    </div>
                    <div class="form-group">
                        <label>AI API 密钥</label>
                        <input type="password" id="settingApiKey" placeholder="sk-...">
                    </div>
                    <div class="form-group">
                        <label>AI 模型</label>
                        <input type="text" id="settingModel" placeholder="gpt-4o-mini">
                    </div>
                    <div class="form-group">
                        <label>洛谷用户名</label>
                        <input type="text" id="settingLuoguUser" placeholder="用于提交代码">
                    </div>
                    <button class="btn-primary" id="btnSaveSettings">保存设置</button>
                </div>
            </div>
        </div>

        <!-- 统计弹窗 -->
        <div class="modal" id="statsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>📊 学习统计</h3>
                    <button class="modal-close">×</button>
                </div>
                <div class="modal-body" id="statsBody">
                    <!-- 统计数据将由 JS 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本加载 -->
    <script src="js/data.js"></script>
    <script src="js/content.js"></script>
    <script src="js/missing_part6.js"></script>
    <script src="js/missing_part7.js"></script>
    <script src="js/missing_part8_10.js"></script>

    <script src="js/storage.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/luogu.js"></script>
    <script src="js/map.js"></script>
    <script src="js/lesson.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
